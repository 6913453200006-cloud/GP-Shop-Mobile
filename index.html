                                    </h3>
                                    <div className="space-y-2">
                                        {customerRepairs.map(r => (
                                            <div key={r.id} className="p-3 bg-white border rounded-xl shadow-sm text-sm">
                                                <div className="flex justify-between">
                                                    <span className="font-bold">{r.id} ({r.model})</span>
                                                    {r.status === 'ซ่อมเสร็จสิ้น' && 
                                                        <button onClick={() => onPrintRepair('repair', r)} className="text-blue-600 underline text-xs">
                                                            <i className="fas fa-print mr-1"></i> พิมพ์
                                                        </button>
                                                    }
                                                </div>
                                                <div className="text-gray-500">อาการ: {r.issue} | ฿{r.price}</div>
                                            </div>
                                        ))}
                                        {customerRepairs.length === 0 && <p className="text-sm text-gray-400">ไม่พบประวัติซ่อม</p>}
                                    </div>
                                </div>
                                
                                <div className="border rounded-xl p-4 bg-gray-50">
                                    <h3 className="font-bold text-gray-800 mb-3 border-b pb-2 flex items-center">
                                        <i className="fas fa-exclamation-circle mr-2 text-gray-600"></i> ประวัติจำนำ
                                    </h3>
                                    <div className="space-y-2">
                                        {customerPawns.map(p => (
                                            <div key={p.id} className="p-3 bg-white border rounded-xl shadow-sm text-sm">
                                                <div className="flex justify-between"><span className="font-bold">{p.id} ({p.model})</span><span className="text-red-500 font-bold">฿{p.principal}</span></div>
                                                <div className="text-gray-500">สถานะ: {p.status}</div>
                                            </div>
                                        ))}
                                        {customerPawns.length === 0 && <p className="text-sm text-gray-400">ไม่พบประวัติจำนำ</p>}
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        // --- 3.6 สมุดบัญชีรายรับ-รายจ่าย (Ledger) ---
        const TransactionTab = ({ transactions, setTransactions, onPrint, showToast }) => {
            const now = new Date();
            const [selectedMonth, setSelectedMonth] = useState(now.getMonth());
            const [selectedYear, setSelectedYear] = useState(now.getFullYear());
            const [ledgerTab, setLedgerTab] = useState('all'); // 'all', 'sales', 'pawns' (แยกส่วนรายการจำนำและขายต่อวัน)
            
            const [editIdx, setEditIdx] = useState(null);
            const [draft, setDraft] = useState({});
            const [showAdd, setShowAdd] = useState(false);
            const blank = () => ({ date: dayKey(new Date()), type: 'รายรับ', detail: '', ref: '', amount: '', note: '', profit: '' });
            const [nr, setNr] = useState(blank());
            const inp = 'w-full border rounded-lg p-2 text-sm';
            const setDate = (ymd, base) => { const [y, m, d] = ymd.split('-').map(Number); const nd = new Date(base || new Date()); nd.setFullYear(y, m - 1, d); return nd; };

            const ledger = buildLedger(transactions);
            const monthRows = ledger.filter(r => r._d.getMonth() === selectedMonth && r._d.getFullYear() === selectedYear);
            
            // กรองตามประเภท Tab เพื่อแยกรายการจำนำออกจากขายหน้าร้าน/งานซ่อม
            const filteredRows = useMemo(() => {
                if (ledgerTab === 'sales') {
                    return monthRows.filter(r => !r.detail.includes('จำนำ') && !r.detail.includes('ไถ่เครื่อง') && !r.detail.includes('ซื้อสินค้าเข้าสต็อก'));
                } else if (ledgerTab === 'pawns') {
                    return monthRows.filter(r => r.detail.includes('จำนำ') || r.detail.includes('ไถ่เครื่อง'));
                } else if (ledgerTab === 'stock') {
                    return monthRows.filter(r => r.detail.includes('ซื้อสินค้าเข้าสต็อก'));
                }
                return monthRows;
            }, [monthRows, ledgerTab]);

            const totalIncome = monthRows.reduce((s, r) => s + r.inc, 0);
            const totalExpense = monthRows.reduce((s, r) => s + r.exp, 0);
            const netProfit = totalIncome - totalExpense;
            const monthSalesProfit = monthRows.reduce((s, r) => s + (r.profit || 0), 0); // กำไรจากรายการซื้อขายสินค้า (ราคาขาย-ต้นทุน) เดือนนี้
            const todayIncome = ledger.filter(r => dayKey(r._d) === dayKey(now)).reduce((s, r) => s + r.inc, 0);

            const days = [];
            filteredRows.forEach(r => {
                const k = dayKey(r._d);
                let g = days[days.length - 1];
                if (!g || g.k !== k) { g = { k, d: r._d, items: [] }; days.push(g); }
                g.items.push(r);
            });

            const startEdit = (r) => { setEditIdx(r._i); setDraft({ date: dayKey(r._d), detail: r.detail || '', ref: r.ref || '', income: r.inc || '', expense: r.exp || '', note: r.note || '', profit: (r.profit !== null && r.profit !== undefined) ? r.profit : '' }); };
            const saveEdit = (r) => {
                const inc = parseFloat(draft.income) || 0, exp = parseFloat(draft.expense) || 0;
                if ((inc > 0) === (exp > 0)) { showToast('กรอกยอดรายรับ หรือ รายจ่าย อย่างใดอย่างหนึ่งเท่านั้น'); return; }
                const nd = setDate(draft.date, r._d);
                setTransactions(prev => prev.map((t, i) => i === r._i ? { ...t, date: nd.toLocaleString('th-TH'), rawDate: nd.toISOString(), type: inc > 0 ? 'รายรับ' : 'รายจ่าย', amount: inc > 0 ? inc : exp, detail: draft.detail, ref: draft.ref, note: draft.note, profit: draft.profit !== '' ? (parseFloat(draft.profit) || 0) : null } : t));
                setEditIdx(null);
                showToast('บันทึกการแก้ไขแล้ว');
            };

            const removeRow = (r) => {
                if (!confirm(`ลบรายการ "${r.detail}" ?`)) return;
                setTransactions(prev => prev.filter((_, i) => i !== r._i));
                showToast('ลบรายการแล้ว');
            };

            const addRow = (e) => {
                e.preventDefault();
                const amount = parseFloat(nr.amount) || 0;
                if (amount <= 0) { showToast('กรุณากรอกจำนวนเงิน'); return; }
                const nd = setDate(nr.date);
                setTransactions(prev => [{ id: Date.now(), date: nd.toLocaleString('th-TH'), rawDate: nd.toISOString(), type: nr.type, detail: nr.detail, amount, qty: '-', ref: nr.ref, note: nr.note, profit: nr.profit !== '' ? (parseFloat(nr.profit) || 0) : null }, ...prev]);
                setNr(blank());
                setShowAdd(false);
                showToast('เพิ่มรายการเรียบร้อย');
            };

            const handlePrintSummary = () => onPrint('transaction', { monthStr: `${TH_MONTHS[selectedMonth]} ${selectedYear}`, totalIncome, totalExpense, netProfit, transactions: filteredRows });

            const cards = [
                { label: 'วันนี้ขายได้', val: todayIncome, c: 'text-green-600', b: 'border-green-100' },
                { label: `รายรับรวมเดือน${TH_MONTHS[selectedMonth]}`, val: totalIncome, c: 'text-green-600', b: 'border-green-100' },
                { label: 'รายจ่ายรวมเดือนนี้', val: totalExpense, c: 'text-red-600', b: 'border-red-100' },
                { label: 'กำไรสุทธิเดือนนี้', val: netProfit, c: 'text-blue-600', b: 'border-blue-100' },
                { label: 'กำไรจากการขายสินค้าเดือนนี้', val: monthSalesProfit, c: 'text-purple-600', b: 'border-purple-100' },
            ];

            return (
                <div className="space-y-6 page-fade-in">
                    <div className="flex flex-wrap justify-between items-end gap-3">
                        <h2 className="text-2xl font-bold text-gray-800">สมุดบัญชีรายรับ-รายจ่าย</h2>
                        <div className="flex flex-wrap gap-2">
                            <select value={selectedMonth} onChange={e => setSelectedMonth(Number(e.target.value))} className="border p-2 rounded-xl bg-white shadow-sm font-medium">
                                {TH_MONTHS.map((m, i) => <option key={i} value={i}>{m}</option>)}
                            </select>
                            <select value={selectedYear} onChange={e => setSelectedYear(Number(e.target.value))} className="border p-2 rounded-xl bg-white shadow-sm font-medium">
                                {[...Array(5)].map((_, i) => { const y = now.getFullYear() - i; return <option key={y} value={y}>{y}</option>; })}
                            </select>
                            <button onClick={() => setShowAdd(!showAdd)} className="bg-blue-600 text-white px-4 py-2 rounded-xl font-bold text-sm hover:bg-blue-700 shadow-sm transition"><i className="fas fa-plus mr-1"></i>เพิ่มรายการ</button>
                            <button onClick={handlePrintSummary} className="bg-blue-100 text-blue-600 px-3 py-2 rounded-xl hover:bg-blue-200 shadow-sm transition" title="พิมพ์สรุปยอด"><i className="fas fa-print"></i></button>
                        </div>
                    </div>

                    <div className="grid grid-cols-2 lg:grid-cols-5 gap-4">
                        {cards.map(c => (
                            <div key={c.label} className={`bg-white p-4 rounded-2xl shadow-sm border ${c.b}`}>
                                <p className="text-xs text-gray-500 font-medium mb-1">{c.label}</p>
                                <h3 className={`text-xl font-bold ${c.c}`}>฿{c.val.toLocaleString()}</h3>
                            </div>
                        ))}
                    </div>

                    {/* ปุ่มแยกประเภทรายการบัญชี (แยกส่วนจำนำและขายต่อวัน) */}
                    <div className="flex bg-gray-200 p-1 rounded-xl w-fit">
                        <button 
                            onClick={() => setLedgerTab('all')}
                            className={`px-4 py-2 text-xs font-bold rounded-lg transition ${ledgerTab === 'all' ? 'bg-white text-blue-600 shadow-sm' : 'text-gray-600 hover:text-gray-900'}`}
                        >
                            <i className="fas fa-list mr-1.5"></i>รวมทุกรายการ
                        </button>
                        <button 
                            onClick={() => setLedgerTab('sales')}
                            className={`px-4 py-2 text-xs font-bold rounded-lg transition ${ledgerTab === 'sales' ? 'bg-white text-emerald-600 shadow-sm' : 'text-gray-600 hover:text-gray-900'}`}
                        >
                            <i className="fas fa-shopping-bag mr-1.5"></i>รายการขายหน้าร้าน / ซ่อม
                        </button>
                        <button 
                            onClick={() => setLedgerTab('pawns')}
                            className={`px-4 py-2 text-xs font-bold rounded-lg transition ${ledgerTab === 'pawns' ? 'bg-white text-purple-600 shadow-sm' : 'text-gray-600 hover:text-gray-900'}`}
                        >
                            <i className="fas fa-hand-holding-usd mr-1.5"></i>รายการรับจำนำ / ไถ่ถอน
                        </button>
                        <button 
                            onClick={() => setLedgerTab('stock')}
                            className={`px-4 py-2 text-xs font-bold rounded-lg transition ${ledgerTab === 'stock' ? 'bg-white text-amber-600 shadow-sm' : 'text-gray-600 hover:text-gray-900'}`}
                        >
                            <i className="fas fa-boxes mr-1.5"></i>รายการสต็อกสินค้า
                        </button>
                    </div>

                    {showAdd && (
                        <form onSubmit={addRow} className="bg-white p-4 rounded-2xl border border-blue-200 grid grid-cols-2 md:grid-cols-6 gap-3 items-end shadow-sm modal-enter">
                            <div><label className="text-xs text-gray-500">วันที่</label><input type="date" required value={nr.date} onChange={e => setNr({ ...nr, date: e.target.value })} className={inp} /></div>
                            <div><label className="text-xs text-gray-500">ประเภท</label><select value={nr.type} onChange={e => setNr({ ...nr, type: e.target.value })} className={inp}><option>รายรับ</option><option>รายจ่าย</option></select></div>
                            <div className="col-span-2"><label className="text-xs text-gray-500">รายการ (คำอธิบาย)</label><input required value={nr.detail} onChange={e => setNr({ ...nr, detail: e.target.value })} className={inp} /></div>
                            <div><label className="text-xs text-gray-500">เลขที่เอกสารอ้างอิง</label><input value={nr.ref} onChange={e => setNr({ ...nr, ref: e.target.value })} className={inp} /></div>
                            <div><label className="text-xs text-gray-500">จำนวนเงิน (บาท)</label><input type="number" required min="0" step="any" value={nr.amount} onChange={e => setNr({ ...nr, amount: e.target.value })} className={inp} /></div>
                            <div><label className="text-xs text-gray-500">กำไร (บาท) (ถ้ามี)</label><input type="number" step="any" placeholder="-" value={nr.profit} onChange={e => setNr({ ...nr, profit: e.target.value })} className={inp} /></div>
                            <div className="col-span-2 md:col-span-4"><label className="text-xs text-gray-500">หมายเหตุ</label><input value={nr.note} onChange={e => setNr({ ...nr, note: e.target.value })} className={inp} /></div>
                            <button type="submit" className="bg-green-600 text-white py-2.5 rounded-xl font-bold text-sm hover:bg-green-700 shadow">บันทึก</button>
                        </form>
                    )}

                    <div className="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
                        <div className="overflow-x-auto">
                            <table className="w-full text-left min-w-[960px]">
                                <thead className="bg-slate-50 text-slate-600 text-sm">
                                    <tr>
                                        <th className="p-3.5 border-b">วันที่</th><th className="p-3.5 border-b">รายการ (คำอธิบาย)</th><th className="p-3.5 border-b">เลขที่เอกสารอ้างอิง</th>
                                        <th className="p-3.5 border-b text-right">รายรับ (บาท)</th><th className="p-3.5 border-b text-right">รายจ่าย (บาท)</th><th className="p-3.5 border-b text-right">กำไร (บาท)</th>
                                        <th className="p-3.5 border-b">หมายเหตุ</th><th className="p-3.5 border-b text-center">จัดการ</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {days.length === 0 && <tr><td colSpan={8} className="p-8 text-center text-gray-400">ไม่มีรายการในส่วนนี้</td></tr>}
                                    {days.map(g => {
                                        const dInc = g.items.reduce((s, r) => s + r.inc, 0), dExp = g.items.reduce((s, r) => s + r.exp, 0);
                                        const dProfit = g.items.reduce((s, r) => s + (r.profit || 0), 0);
                                        return (
                                            <React.Fragment key={g.k}>
                                                <tr className="bg-blue-100 border-t-4 border-blue-300 text-sm font-bold text-blue-900">
                                                    <td colSpan={8} className="p-3">
                                                        <i className="fas fa-calendar-day mr-2"></i>{g.d.toLocaleDateString('th-TH', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' })}
                                                        <span className="ml-3 text-xs font-medium text-blue-700">({g.items.length} รายการ)</span>
                                                    </td>
                                                </tr>
                                                {g.items.map(r => editIdx === r._i ? (
                                                    <tr key={r._i} className="bg-yellow-50 border-b text-sm">
                                                        <td className="p-2"><input type="date" value={draft.date} onChange={e => setDraft({ ...draft, date: e.target.value })} className={inp} /></td>
                                                        <td className="p-2"><input value={draft.detail} onChange={e => setDraft({ ...draft, detail: e.target.value })} className={inp} /></td>
                                                        <td className="p-2"><input value={draft.ref} onChange={e => setDraft({ ...draft, ref: e.target.value })} className={inp} /></td>
                                                        <td className="p-2"><input type="number" min="0" step="any" value={draft.income} onChange={e => setDraft({ ...draft, income: e.target.value })} className={inp + ' text-right'} /></td>
                                                        <td className="p-2"><input type="number" min="0" step="any" value={draft.expense} onChange={e => setDraft({ ...draft, expense: e.target.value })} className={inp + ' text-right'} /></td>
                                                        <td className="p-2"><input type="number" step="any" placeholder="-" value={draft.profit} onChange={e => setDraft({ ...draft, profit: e.target.value })} className={inp + ' text-right'} /></td>
                                                        <td className="p-2"><input value={draft.note} onChange={e => setDraft({ ...draft, note: e.target.value })} className={inp} /></td>
                                                        <td className="p-2 text-center whitespace-nowrap">
                                                            <button onClick={() => saveEdit(r)} className="text-green-600 hover:bg-green-100 p-2 rounded-lg" title="บันทึก"><i className="fas fa-check"></i></button>
                                                            <button onClick={() => setEditIdx(null)} className="text-gray-500 hover:bg-gray-200 p-2 rounded-lg" title="ยกเลิก"><i className="fas fa-times"></i></button>
                                                        </td>
                                                    </tr>
                                                ) : (
                                                    <tr key={r._i} className="border-b hover:bg-gray-50 text-sm transition">
                                                        <td className="p-3.5 text-gray-500 whitespace-nowrap"><span className="text-gray-500">{r._d.toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' })} น.</span></td>
                                                        <td className="p-3.5 font-medium">
                                                            {r.detail}
                                                            {r.qty && r.qty !== '-' ? <span className="text-xs text-gray-400"> (x{r.qty})</span> : null}
                                                        </td>
                                                        <td className="p-3.5 text-gray-500 whitespace-nowrap">{r.ref || '-'}</td>
                                                        <td className="p-3.5 text-right font-bold text-green-600">{r.inc ? r.inc.toLocaleString() : ''}</td>
                                                        <td className="p-3.5 text-right font-bold text-red-600">{r.exp ? r.exp.toLocaleString() : ''}</td>
                                                        <td className="p-3.5 text-right font-bold text-purple-600">{(r.profit !== null && r.profit !== undefined) ? r.profit.toLocaleString() : '-'}</td>
                                                        <td className="p-3.5 text-gray-500">{r.note}</td>
                                                        <td className="p-3.5 text-center whitespace-nowrap">
                                                            <button onClick={() => startEdit(r)} className="text-blue-600 hover:bg-blue-100 p-2 rounded-lg" title="แก้ไข"><i className="fas fa-edit"></i></button>
                                                            <button onClick={() => removeRow(r)} className="text-red-500 hover:bg-red-100 p-2 rounded-lg" title="ลบ"><i className="fas fa-trash"></i></button>
                                                        </td>
                                                    </tr>
                                                ))}
                                                <tr className="bg-amber-100 border-b-2 border-amber-300 text-sm font-bold">
                                                    <td className="p-3.5 text-amber-800" colSpan={3}>สรุปวันที่ {g.d.toLocaleDateString('th-TH', { day: 'numeric', month: 'long', year: 'numeric' })} — รายรับ ฿{dInc.toLocaleString()} · รายจ่าย ฿{dExp.toLocaleString()}</td>
                                                    <td className="p-3.5 text-right text-green-700">{dInc.toLocaleString()}</td>
                                                    <td className="p-3.5 text-right text-red-700">{dExp.toLocaleString()}</td>
                                                    <td className="p-3.5 text-right text-purple-700">{dProfit.toLocaleString()}</td>
                                                    <td className="p-3.5 text-amber-800" colSpan={2}>สุทธิ ฿{(dInc - dExp).toLocaleString()}</td>
                                                </tr>
                                                <tr><td colSpan={8} className="h-3 bg-slate-50"></td></tr>
                                            </React.Fragment>
                                        );
                                    })}
                                    <tr className="bg-blue-50 text-sm font-extrabold">
                                        <td className="p-3.5 text-blue-800" colSpan={3}>รวมทั้งเดือน {TH_MONTHS[selectedMonth]} {selectedYear} — รายรับรวม ฿{totalIncome.toLocaleString()}</td>
                                        <td className="p-3.5 text-right text-green-700">{totalIncome.toLocaleString()}</td>
                                        <td className="p-3.5 text-right text-red-700"></td>
                                        <td className="p-3.5 text-right text-purple-700">{monthSalesProfit.toLocaleString()}</td>
                                        <td colSpan={2}></td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            );
        };

        // --- 3.7 ขายหน้าร้าน (POS) ---
        const POSTab = ({ inventory, setInventory, addTransaction, addSale, showToast, onPrint }) => {
            const [cat, setCat] = useState('อะไหล่');
            const cats = [
                { key: 'อะไหล่', icon: 'fa-microchip', match: c => c === 'อะไหล่' },
                { key: 'อุปกรณ์เสริม', icon: 'fa-headphones', match: c => c === 'อุปกรณ์เสริม' },
                { key: 'เครื่อง', icon: 'fa-mobile-alt', match: c => c === 'เครื่องใหม่' || c === 'เครื่องมือ2' }
            ];
            const shown = inventory.filter(i => cats.find(c => c.key === cat).match(i.category));
            const [cart, setCart] = useState([]);
            const [galleryItem, setGalleryItem] = useState(null);

            const addToCart = (item) => {
                if (item.qty <= 0) { alert('สินค้าหมด'); return; }
                const existing = cart.find(c => c.id === item.id);
                if (existing) {
                    if (existing.qty >= item.qty) { alert('จำนวนสินค้าในสต็อกไม่พอ'); return; }
                    setCart(cart.map(c => c.id === item.id ? { ...c, qty: c.qty + 1 } : c));
                } else {
                    const { images: _imgs, imageUrl: _img1, ...itemNoImg } = item;
                    setCart([...cart, { ...itemNoImg, price: item.price, qty: 1 }]);
                }
            };

            // แก้ไขราคาขายต่อหน่วยในตะกร้าสินค้าก่อนกดชำระเงิน
            const updateCartPrice = (id, newPrice) => {
                const price = parseFloat(newPrice) || 0;
                setCart(cart.map(c => c.id === id ? { ...c, price } : c));
            };

            const updateCartQty = (id, delta) => {
                const item = cart.find(c => c.id === id);
                if (!item) return;
                const invItem = inventory.find(i => i.id === id);
                const nextQty = item.qty + delta;
                
                if (nextQty <= 0) {
                    setCart(cart.filter(c => c.id !== id));
                } else {
                    if (invItem && nextQty > invItem.qty) { alert('จำนวนสินค้าในสต็อกไม่พอ'); return; }
                    setCart(cart.map(c => c.id === id ? { ...c, qty: nextQty } : c));
                }
            };

            const checkout = () => {
                if (cart.length === 0) return;
                const total = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
                const saleId = `INV-${Date.now()}`;
                
                cart.forEach(cartItem => {
                    setInventory(prev => prev.map(i => i.id === cartItem.id ? { ...i, qty: i.qty - cartItem.qty } : i));
                    const itemProfit = (cartItem.price - (cartItem.cost || 0)) * cartItem.qty; // ราคาขาย - ราคาทุน
                    addTransaction('รายรับ', `ขายสินค้า (POS): ${cartItem.name}`, cartItem.price * cartItem.qty, cartItem.qty, saleId, '', itemProfit);
                });

                const sale = { id: saleId, date: new Date().toISOString(), total, items: cart };
                addSale(sale);
                onPrint('sale', sale);
                setCart([]);
                showToast(`รับชำระเงิน ฿${total.toLocaleString()} สำเร็จ!`);
            };

            return (
                <div className="grid grid-cols-1 lg:grid-cols-3 gap-6 page-fade-in">
                    <div className="lg:col-span-2 space-y-4">
                        <h2 className="text-2xl font-bold text-gray-800">ขายหน้าร้าน (POS)</h2>
                        <div className="flex flex-wrap gap-2">
                            {cats.map(c => (
                                <button key={c.key} onClick={() => setCat(c.key)} className={`px-4 py-2.5 rounded-xl font-bold text-sm border transition ${cat === c.key ? 'bg-blue-600 text-white border-blue-600 shadow-sm' : 'bg-white text-gray-600 hover:bg-blue-50'}`}>
                                    <i className={`fas ${c.icon} mr-2`}></i>{c.key} ({inventory.filter(i => c.match(i.category)).length})
                                </button>
                            ))}
                        </div>
                        <div className="grid grid-cols-2 md:grid-cols-3 gap-4">
                            {shown.length === 0 && <p className="col-span-full text-center text-gray-400 py-10">ไม่มีสินค้าในหมวดนี้</p>}
                            {shown.map(item => (
                                <div key={item.id} onClick={() => addToCart(item)} className={`bg-white rounded-2xl border overflow-hidden cursor-pointer hover:shadow-md transition transform active:scale-95 ${item.qty <= 0 ? 'opacity-50' : 'border-blue-100 hover:border-blue-500'}`}>
                                    {(() => { const imgs = getItemImages(item); return (
                                        <div className="relative aspect-[4/3] bg-gray-100">
                                            <SafeImg src={imgs[0]} alt={item.name} className="w-full h-full object-cover" />
                                            {(item.category === 'เครื่องใหม่' || item.category === 'เครื่องมือ2') && (
                                                <span className={`absolute top-1.5 left-1.5 px-2 py-0.5 rounded-full text-[11px] font-bold ${catInfo(item.category).badge}`}>{catInfo(item.category).label}</span>
                                            )}
                                            {imgs.length > 1 && (
                                                <button type="button" onClick={e => { e.stopPropagation(); setGalleryItem(item); }} className="absolute bottom-1.5 right-1.5 bg-black/60 text-white text-[11px] font-bold px-2 py-0.5 rounded-full" title="ดูรูปทั้งหมด">
                                                    <i className="fas fa-images mr-1"></i>{imgs.length}
                                                </button>
                                            )}
                                        </div>
                                    ); })()}
                                    <div className="p-3">
                                        <div className="font-bold text-gray-800 line-clamp-2 h-10">{item.name}</div>
                                        <div className="text-xs text-gray-500 mt-1">คงเหลือ: {item.qty}</div>
                                        <div className="text-lg font-bold text-blue-600">฿{item.price.toLocaleString()}</div>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>

                    {/* ตะกร้าสินค้าแบบแก้ไขราคาขายได้ */}
                    <div className="bg-white rounded-2xl shadow-sm border border-gray-100 flex flex-col h-[calc(100vh-120px)] sticky top-4">
                        <div className="p-4 border-b bg-slate-50 font-bold text-lg text-gray-800 flex justify-between items-center rounded-t-2xl">
                            <span><i className="fas fa-shopping-cart text-blue-600 mr-2"></i>ตะกร้าสินค้า</span>
                            <span className="text-xs bg-blue-100 text-blue-700 px-2 py-1 rounded-full font-bold">{cart.length} รายการ</span>
                        </div>

                        body: JSON.stringify(dbData)
                    });

                    console.error(error);

                        showToast('ชีตยังว่างเปล่า เริ่มต้นใช้งานระบบใหม่');

                                    <i className="fas fa-bars text-xl"></i>
                                </button>
                                <span className="font-bold text-gray-800 ml-2">{menuItems.find(m => m.id === activeTab)?.label || 'GP Mobile shop'}</span>
                            </div>
                            <div className="flex-1 overflow-auto p-4 sm:p-6 lg:p-8">
                                <div className="max-w-7xl mx-auto h-full pb-20">
                                    {activeTab === 'dashboard' && <DashboardTab inventory={inventory} pawns={pawns} repairs={repairs} sales={sales} transactions={transactions} />}
                                    {activeTab === 'inventory' && <InventoryTab inventory={inventory} setInventory={setInventory} userRole={userRole} addTransaction={addTransaction} showToast={showToast} onPrint={handlePrint} />}
                                    {activeTab === 'repair' && <RepairTab repairs={repairs} setRepairs={setRepairs} inventory={inventory} setInventory={setInventory} addTransaction={addTransaction} showToast={showToast} onPrint={handlePrint} />}
                                    {activeTab === 'pawn' && <PawnTab pawns={pawns} setPawns={setPawns} setTransactions={setTransactions} showToast={showToast} addTransaction={addTransaction} />}
                                    {activeTab === 'crm' && <CRMTab repairs={repairs} pawns={pawns} onPrintRepair={handlePrint} />}
                                    {activeTab === 'transactions' && <TransactionTab transactions={transactions} setTransactions={setTransactions} showToast={showToast} onPrint={handlePrint} />}
                                    {activeTab === 'pos' && <POSTab inventory={inventory} setInventory={setInventory} addTransaction={addTransaction} addSale={s => setSales([...sales, s])} showToast={showToast} onPrint={handlePrint} />}
                                </div>
                            </div>
                        </main>
                    </div>
                </div>
            );
        }

        // Render Application
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
