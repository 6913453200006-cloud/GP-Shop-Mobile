        // --- 3.7 ขายหน้าร้าน (POS) ---
        const POSTab = ({ inventory, setInventory, addTransaction, addSale, showToast, onPrint }) => {
            const [cat, setCat] = useState('อะไหล่');
            const cats = [
                { key: 'อะไหล่', icon: 'fa-microchip', match: c => c === 'อะไหล่' },
                { key: 'อุปกรณ์เสริม', icon: 'fa-headphones', match: c => c === 'อุปกรณ์เสริม' },
                { key: 'เครื่อง', icon: 'fa-mobile-alt', match: c => c === 'เครื่องใหม่' || c === 'เครื่องมือ2' }
            ];
            const shown = inventory.filter(i => cats.find(c => c.key === cat).match(i.category));
            const [cart, setCart] = useState([]);
            const [galleryItem, setGalleryItem] = useState(null);

            const addToCart = (item) => {
                if (item.qty <= 0) { alert('สินค้าหมด'); return; }
                const existing = cart.find(c => c.id === item.id);
                if (existing) {
                    if (existing.qty >= item.qty) { alert('จำนวนสินค้าในสต็อกไม่พอ'); return; }
                    setCart(cart.map(c => c.id === item.id ? { ...c, qty: c.qty + 1 } : c));
                } else {
                    const { images: _imgs, imageUrl: _img1, ...itemNoImg } = item;
                    setCart([...cart, { ...itemNoImg, price: item.price, qty: 1 }]);
                }
            };

            // แก้ไขราคาขายต่อหน่วยในตะกร้าสินค้าก่อนกดชำระเงิน
            const updateCartPrice = (id, newPrice) => {
                const price = parseFloat(newPrice) || 0;
                setCart(cart.map(c => c.id === id ? { ...c, price } : c));
            };

            const updateCartQty = (id, delta) => {
                const item = cart.find(c => c.id === id);
                if (!item) return;
                const invItem = inventory.find(i => i.id === id);
                const nextQty = item.qty + delta;
                
                if (nextQty <= 0) {
                    setCart(cart.filter(c => c.id !== id));
                } else {
                    if (invItem && nextQty > invItem.qty) { alert('จำนวนสินค้าในสต็อกไม่พอ'); return; }
                    setCart(cart.map(c => c.id === id ? { ...c, qty: nextQty } : c));
                }
            };

            const checkout = () => {
                if (cart.length === 0) return;
                const total = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
                const saleId = `INV-${Date.now()}`;
                
                cart.forEach(cartItem => {
                    // ตัดสต็อก (เครื่องที่เหลือ 0 จะถูกลบพร้อมรูปโดยตัวกวาดใน App)
                    setInventory(prev => prev.map(i => i.id === cartItem.id ? { ...i, qty: i.qty - cartItem.qty } : i));
                    const itemProfit = (cartItem.price - (cartItem.cost || 0)) * cartItem.qty; // ราคาขาย - ราคาทุน
                    addTransaction('รายรับ', `ขายสินค้า (POS): ${cartItem.name}`, cartItem.price * cartItem.qty, cartItem.qty, saleId, '', itemProfit, cartItem.sku || '');
                });

                const sale = { id: saleId, date: new Date().toISOString(), total, items: cart };
                addSale(sale);
                onPrint('sale', sale);
                setCart([]);
                showToast(`รับชำระเงิน ฿${total.toLocaleString()} สำเร็จ!`);
            };

            return (
                <div className="grid grid-cols-1 lg:grid-cols-3 gap-6 page-fade-in">
                    <div className="lg:col-span-2 space-y-4">
                        <h2 className="text-2xl font-bold text-gray-800">ขายหน้าร้าน (POS)</h2>
                        <div className="flex flex-wrap gap-2">
                            {cats.map(c => (
                                <button key={c.key} onClick={() => setCat(c.key)} className={`px-4 py-2.5 rounded-xl font-bold text-sm border transition ${cat === c.key ? 'bg-blue-600 text-white border-blue-600 shadow-sm' : 'bg-white text-gray-600 hover:bg-blue-50'}`}>
                                    <i className={`fas ${c.icon} mr-2`}></i>{c.key} ({inventory.filter(i => c.match(i.category)).length})
                                </button>
                            ))}
                        </div>
                        <div className="grid grid-cols-2 md:grid-cols-3 gap-4">
                            {shown.length === 0 && <p className="col-span-full text-center text-gray-400 py-10">ไม่มีสินค้าในหมวดนี้</p>}
                            {shown.map(item => (
                                <div key={item.id} onClick={() => addToCart(item)} className={`bg-white rounded-2xl border overflow-hidden cursor-pointer hover:shadow-md transition transform active:scale-95 ${item.qty <= 0 ? 'opacity-50' : 'border-blue-100 hover:border-blue-500'}`}>
                                    {(() => { const imgs = getItemImages(item); return (
                                        <div className="relative aspect-[4/3] bg-gray-100">
                                            <SafeImg src={imgs[0]} alt={item.name} className="w-full h-full object-cover" />
                                            {(item.category === 'เครื่องใหม่' || item.category === 'เครื่องมือ2') && (
                                                <span className={`absolute top-1.5 left-1.5 px-2 py-0.5 rounded-full text-[11px] font-bold ${catInfo(item.category).badge}`}>{catInfo(item.category).label}</span>
                                            )}
                                            {imgs.length > 1 && (
                                                <button type="button" onClick={e => { e.stopPropagation(); setGalleryItem(item); }} className="absolute bottom-1.5 right-1.5 bg-black/60 text-white text-[11px] font-bold px-2 py-0.5 rounded-full" title="ดูรูปทั้งหมด">
                                                    <i className="fas fa-images mr-1"></i>{imgs.length}
                                                </button>
                                            )}
                                        </div>
                                    ); })()}
                                    <div className="p-3">
                                        <div className="font-bold text-gray-800 line-clamp-2 h-10">{item.name}</div>
                                        <div className="text-xs text-gray-500 mt-1">คงเหลือ: {item.qty}</div>
                                        <div className="text-lg font-bold text-blue-600">฿{item.price.toLocaleString()}</div>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>

                    {/* ตะกร้าสินค้าแบบแก้ไขราคาขายได้ */}
                    <div className="bg-white rounded-2xl shadow-sm border border-gray-100 flex flex-col h-[calc(100vh-120px)] sticky top-4">
                        <div className="p-4 border-b bg-slate-50 font-bold text-lg text-gray-800 flex justify-between items-center rounded-t-2xl">
                            <span><i className="fas fa-shopping-cart text-blue-600 mr-2"></i>ตะกร้าสินค้า</span>
                            <span className="text-xs bg-blue-100 text-blue-700 px-2 py-1 rounded-full font-bold">{cart.length} รายการ</span>
                        </div>

                        <div className="flex-1 p-4 overflow-y-auto space-y-3">
                            {cart.length === 0 ? (
                                <div className="text-center text-gray-400 mt-16 space-y-2">
                                    <i className="fas fa-basket-shopping text-4xl opacity-30"></i>
                                    <p className="text-sm">ยังไม่มีสินค้าในตะกร้า</p>
                                </div>
                            ) : cart.map(item => (
                                <div key={item.id} className="bg-slate-50 p-3 rounded-xl border border-gray-200 text-sm space-y-2">
                                    <div className="flex justify-between items-center font-bold text-gray-800">
                                        <span className="flex items-center gap-2 min-w-0">
                                            <SafeImg src={getItemImages(inventory.find(i => i.id === item.id))[0]} className="w-9 h-9 shrink-0 object-cover rounded-lg border" />
                                            <span className="truncate">{item.name}</span>
                                        </span>
                                        <button onClick={() => updateCartQty(item.id, -item.qty)} className="text-red-400 hover:text-red-600 text-xs">
                                            <i className="fas fa-trash"></i>
                                        </button>
                                    </div>
                                    
                                    <div className="flex justify-between items-center gap-2">
                                        {/* แก้ไขราคาขายต่อหน่วย */}
                                        <div className="flex items-center gap-1">
                                            <span className="text-xs text-gray-500">ราคา: ฿</span>
                                            <input 
                                                type="number" 
                                                value={item.price} 
                                                onChange={e => updateCartPrice(item.id, e.target.value)}
                                                className="w-20 border rounded-lg px-2 py-1 text-xs font-bold text-blue-700 bg-white"
                                                title="สามารถเปลี่ยนราคาขายได้"
                                            />
                                        </div>

                                        {/* จำนวน */}
                                        <div className="flex items-center border rounded-lg bg-white">
                                            <button onClick={() => updateCartQty(item.id, -1)} className="px-2 py-0.5 text-xs text-gray-600 hover:bg-gray-100 font-bold">-</button>
                                            <span className="px-2 text-xs font-bold">{item.qty}</span>
                                            <button onClick={() => updateCartQty(item.id, 1)} className="px-2 py-0.5 text-xs text-gray-600 hover:bg-gray-100 font-bold">+</button>
                                        </div>

                                        <div className="font-bold text-gray-800">฿{(item.price * item.qty).toLocaleString()}</div>
                                    </div>
                                </div>
                            ))}
                        </div>

                        <div className="p-4 border-t bg-slate-50 rounded-b-2xl">
                            <div className="flex justify-between text-xl font-bold mb-4">
                                <span>รวมทั้งหมด</span>
                                <span className="text-blue-600">฿{cart.reduce((sum, item) => sum + (item.price * item.qty), 0).toLocaleString()}</span>
                            </div>
                            <button onClick={checkout} disabled={cart.length === 0} className="w-full bg-blue-600 text-white font-bold py-3.5 rounded-xl hover:bg-blue-700 disabled:bg-gray-300 transition text-lg shadow-md transform active:scale-95">รับเงิน (Checkout)</button>
                        </div>
                    </div>
                    {galleryItem && <ImageGallery item={galleryItem} onClose={() => setGalleryItem(null)} />}
                </div>
            );
        };

        // ==========================================
        // 4. Main Application
        // ==========================================
        function App() {
            const [authState, setAuthState] = useState('login'); 
            const [userRole, setUserRole] = useState('');
            const [userName, setUserName] = useState('');
            const [activeTab, setActiveTab] = useState('dashboard');
            const [sidebarOpen, setSidebarOpen] = useState(false);
            const [toastMessage, setToastMessage] = useState('');
            
            const [printConfig, setPrintConfig] = useState(null);

            const [inventory, setInventory] = useState([]);
            const [transactions, setTransactions] = useState([]);
            const [repairs, setRepairs] = useState([]);
            const [pawns, setPawns] = useState([]);
            const [sales, setSales] = useState([]);

            const [isSyncing, setIsSyncing] = useState(false);
            const [dataLoaded, setDataLoaded] = useState(false);

            // ===== ระบบบันทึก/ดึงข้อมูล Google Sheets (แบบกันข้อมูลหาย) =====
            // ใช้โปรโตคอลเดิมกับ Apps Script (GET ดึงทั้งก้อน / POST ส่งทั้งก้อน) แต่เพิ่ม: สถานะการบันทึก, ลองใหม่อัตโนมัติ,
            // เก็บสำเนาที่ยังไม่ได้บันทึกไว้ในเครื่อง (กู้คืนได้หลังรีเฟรช), เตือนก่อนปิดหน้า, และดึงข้อมูลล่าสุดเมื่อกลับมาเปิดหน้า
            const [syncState, setSyncState] = useState('saved'); // saved | pending | saving | error
            const lastSyncedRef = useRef('');
            const savingRef = useRef(false);
            const failRef = useRef(0);
            const dbRef = useRef({});
            dbRef.current = { inventory, transactions, repairs, pawns, sales };
            const DRAFT_KEY = 'gp_unsaved_db_v1';
            const dbStr = (d) => JSON.stringify({ inventory: d.inventory, transactions: d.transactions, repairs: d.repairs, pawns: d.pawns, sales: d.sales });
            const isDirty = () => dbStr(dbRef.current) !== lastSyncedRef.current;

            const handleSyncToSheet = async () => {
                if (!dataLoaded || savingRef.current) return;
                const snapshot = dbStr(dbRef.current);
                if (snapshot === lastSyncedRef.current) { setSyncState('saved'); return; }
                savingRef.current = true; setIsSyncing(true); setSyncState('saving');
                let ok = false, why = '';
                try {
                    const res = await fetch(SHEET_API_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: snapshot
                    });
                    let result = null;
                    try { result = await res.json(); } catch (e) {}
                    if (result && result.status === 'success') ok = true;
                    else if (result && result.status === 'rejected') why = 'Google Sheets ไม่รับข้อมูล: ' + (result.reason || 'ไม่ทราบสาเหตุ');
                    else why = 'บันทึกขึ้น Google Sheets ไม่สำเร็จ (ข้อมูลอาจใหญ่เกิน 50,000 ตัวอักษรต่อช่อง)';
                } catch (error) { console.error(error); why = 'ส่งข้อมูลไม่สำเร็จ (อินเทอร์เน็ตหลุด หรือ Apps Script ผิดพลาด - ดูข้อความ error ที่เมนู "การดำเนินการ" ใน Apps Script)'; }
                savingRef.current = false; setIsSyncing(false);
                if (ok) {
                    failRef.current = 0; lastSyncedRef.current = snapshot;
                    if (!isDirty()) { try { localStorage.removeItem(DRAFT_KEY); } catch (e) {} setSyncState('saved'); showToast('สำรองข้อมูลขึ้น Google Sheets สำเร็จ!'); }
                    else { setSyncState('pending'); setTimeout(handleSyncToSheet, 300); }
                } else {
                    failRef.current += 1; setSyncState('error');
                    showToast('⚠️ ' + why + ' - ข้อมูลยังเก็บไว้ในเครื่องนี้ ระบบจะลองใหม่เอง');
                    setTimeout(handleSyncToSheet, Math.min(60000, 8000 * failRef.current));
                }
            };

            // silent = true: ดึงเงียบๆ เมื่อไม่มีข้อมูลค้างบันทึก (ใช้ให้เครื่องที่เปิดค้างไว้ได้ข้อมูลล่าสุด)
            const handleSyncFromSheet = async (silent) => {
                if (silent && (savingRef.current || isDirty())) return;
                if (!silent) setIsSyncing(true);
                try {
                    const response = await fetch(SHEET_API_URL, { cache: 'no-store' });
                    const data = await response.json();
                    if (data && data.inventory) {
                        const raw = { inventory: data.inventory || [], transactions: data.transactions || [], repairs: data.repairs || [], pawns: data.pawns || [], sales: data.sales || [] };
                        const rawStr = dbStr(raw);
                        if (silent && (savingRef.current || isDirty() || rawStr === lastSyncedRef.current)) return;
                        lastSyncedRef.current = rawStr;
                        let src = raw;
                        if (!silent) {
                            try {
                                const d = localStorage.getItem(DRAFT_KEY);
                                if (d && d !== rawStr && window.confirm('พบข้อมูลที่ยังไม่ได้บันทึกขึ้น Google Sheets จากครั้งก่อนในเครื่องนี้ (เช่น รูปสินค้าที่เพิ่งใส่)\n\nตกลง = กู้คืนและบันทึกขึ้น Sheets\nยกเลิก = ใช้ข้อมูลจาก Sheets')) {
                                    const dd = JSON.parse(d);
                                    src = { inventory: dd.inventory || [], transactions: dd.transactions || [], repairs: dd.repairs || [], pawns: dd.pawns || [], sales: dd.sales || [] };
                                } else if (d) { localStorage.removeItem(DRAFT_KEY); }
                            } catch (e) {}
                        }
                        setInventory(dedupeIds(src.inventory));
                        setTransactions(src.transactions);
                        setRepairs(src.repairs);
                        setPawns(src.pawns);
                        setSales(src.sales);
                        if (!silent) showToast('ดึงข้อมูลจาก Google Sheets สำเร็จ!');
                        setDataLoaded(true);
                    } else if (data && Object.keys(data).length === 0) {
                        lastSyncedRef.current = dbStr({ inventory: [], transactions: [], repairs: [], pawns: [], sales: [] });
                        if (!silent) showToast('ชีตยังว่างเปล่า เริ่มต้นใช้งานระบบใหม่');
                        setDataLoaded(true);
                    } else if (!silent) {
                        alert('⚠️ ข้อมูลในชีตผิดรูปแบบ ระบบจึงหยุดบันทึกอัตโนมัติเพื่อป้องกันข้อมูลเสียหาย\nโปรดแจ้งผู้ดูแลระบบก่อนใช้งานต่อ');
                    }
                } catch (error) {
                    console.error(error);
                    if (!silent) alert('⚠️ ดึงข้อมูลจาก Google Sheets ไม่สำเร็จ ระบบจึงหยุดบันทึกอัตโนมัติเพื่อป้องกันข้อมูลถูกเขียนทับ\nลองรีเฟรชหน้านี้อีกครั้ง');
                }
                if (!silent) setIsSyncing(false);
            };

            useEffect(() => {
                handleSyncFromSheet(false);
            }, []);

            useEffect(() => {
                if (!dataLoaded || !isDirty()) return;

                        <aside className={`fixed md:static inset-y-0 left-0 w-64 bg-slate-900 text-white flex flex-col shadow-xl z-30 shrink-0 transform transition-transform duration-300 ${sidebarOpen ? 'translate-x-0' : '-translate-x-full'} md:translate-x-0`}>
                            <div className="h-16 flex items-center justify-center px-4 border-b border-slate-800 bg-slate-950">
                                <div className="bg-white rounded-xl px-3 py-1 flex items-center justify-center"><img src={LOGO_SRC} alt="GP Mobile shop" className="h-11 w-auto object-contain" /></div>
                            </div>
                            <nav className="flex-1 p-4 space-y-1.5 overflow-y-auto">
                                {visibleMenus.map(menu => (
                                    <button key={menu.id} onClick={() => { setActiveTab(menu.id); setSidebarOpen(false); }} className={`w-full flex items-center px-4 py-3 rounded-xl transition transform active:scale-95 ${activeTab === menu.id ? 'bg-blue-600 text-white font-bold shadow-md' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}`}>
                                        <i className={`${menu.icon} text-xl w-6 text-center mr-3`}></i> {menu.label}
                                    </button>
                                ))}
                            </nav>
                            <div className="p-4 border-t border-slate-800 bg-slate-950">
                                <div className="flex items-center text-sm mb-4 px-2 text-slate-300">
                                    <div className="w-8 h-8 bg-slate-800 rounded-full flex items-center justify-center mr-3"><i className="fas fa-user"></i></div>
                                    <div><p className="font-bold capitalize text-white">{userName || userRole}</p><p className="text-xs opacity-70">ออนไลน์</p></div>
                                </div>
                                <button onClick={() => { if (syncState !== 'saving') handleSyncToSheet(); }} className={`w-full flex items-center px-3 py-2 mb-2 rounded-xl text-xs font-bold ${syncState === 'saved' ? 'bg-emerald-500/10 text-emerald-300' : syncState === 'error' ? 'bg-red-500/20 text-red-300' : 'bg-amber-500/10 text-amber-300'}`}><i className={`fas ${syncState === 'saved' ? 'fa-cloud-arrow-up' : syncState === 'error' ? 'fa-triangle-exclamation' : 'fa-spinner fa-spin'} mr-2`}></i>{syncState === 'saved' ? 'บันทึกลง Sheets แล้ว' : syncState === 'saving' ? 'กำลังบันทึก...' : syncState === 'error' ? 'บันทึกไม่สำเร็จ - แตะเพื่อลองใหม่' : 'รอบันทึก...'}</button>
                                <button onClick={() => {setAuthState('login'); setUserRole(''); setUserName('');}} className="w-full flex items-center px-4 py-2.5 text-red-400 hover:bg-red-500/10 rounded-xl transition text-sm font-medium">
                                    <i className="fas fa-sign-out-alt mr-3"></i> ออกจากระบบ
                                </button>
                            </div>
                        </aside>

                        {/* Main Content Area */}
                        <main className="flex-1 flex flex-col min-w-0 w-full">
                            <div className="md:hidden flex items-center h-14 px-4 bg-white border-b shadow-sm shrink-0">
                                <button onClick={() => setSidebarOpen(true)} className="text-gray-700 w-8 h-8 flex items-center justify-center -ml-1">
                                    <i className="fas fa-bars text-xl"></i>
                                </button>
                                <span className="font-bold text-gray-800 ml-2">{menuItems.find(m => m.id === activeTab)?.label || 'GP Mobile shop'}</span>
                            </div>
                            <div className="flex-1 overflow-auto p-4 sm:p-6 lg:p-8">
                                <div className="max-w-7xl mx-auto h-full pb-20">
                                    {activeTab === 'dashboard' && <DashboardTab inventory={inventory} pawns={pawns} repairs={repairs} sales={sales} transactions={transactions} />}
                                    {activeTab === 'inventory' && <InventoryTab sales={sales} inventory={inventory} setInventory={setInventory} userRole={userRole} addTransaction={addTransaction} showToast={showToast} onPrint={handlePrint} />}
                                    {activeTab === 'repair' && <RepairTab repairs={repairs} setRepairs={setRepairs} inventory={inventory} setInventory={setInventory} addTransaction={addTransaction} showToast={showToast} onPrint={handlePrint} />}
                                    {activeTab === 'pawn' && <PawnTab onPrint={handlePrint} pawns={pawns} setPawns={setPawns} setTransactions={setTransactions} showToast={showToast} addTransaction={addTransaction} />}
                                    {activeTab === 'crm' && <CRMTab repairs={repairs} pawns={pawns} onPrintRepair={handlePrint} />}
                                    {activeTab === 'transactions' && <TransactionTab inventory={inventory} sales={sales} transactions={transactions} setTransactions={setTransactions} showToast={showToast} onPrint={handlePrint} />}
                                    {activeTab === 'pos' && <POSTab inventory={inventory} setInventory={setInventory} addTransaction={addTransaction} addSale={s => setSales([...sales, s])} showToast={showToast} onPrint={handlePrint} />}
                                </div>
                            </div>
                        </main>
                    </div>
                </div>
            );
        }

        // Render Application
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
<script>
/* เอฟเฟกต์พื้นหลังขยับตามเมาส์ (ไม่กระทบการทำงานอื่น) */
(function(){ try { var r=document.documentElement; window.addEventListener('mousemove', function(e){ r.style.setProperty('--mx', (e.clientX/window.innerWidth-.5).toFixed(3)); r.style.setProperty('--my', (e.clientY/window.innerHeight-.5).toFixed(3)); }, {passive:true}); } catch(e) {} })();
</script>
</body>
</html>
