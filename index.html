                                    <button type="button" onClick={() => setShowOrderPanel(false)} className="flex-1 border py-2.5 rounded-xl font-bold text-gray-600 hover:bg-gray-50">ปิด</button>
                                    <button type="button" onClick={printOrderList} disabled={orderList.length === 0} className="flex-1 bg-orange-500 text-white py-2.5 rounded-xl font-bold hover:bg-orange-600 shadow-md disabled:opacity-40 disabled:cursor-not-allowed"><i className="fas fa-print mr-2"></i>พิมพ์ใบสั่งซื้อ (A4)</button>
                                </div>
                            </div>
                        </div>
                    )}

                {edit && (
                        <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4" onClick={() => setEdit(null)}>
                            <form onSubmit={saveEdit} onClick={e => e.stopPropagation()} className="bg-white rounded-2xl p-6 w-full max-w-xl max-h-[90vh] overflow-auto space-y-4 modal-enter">
                                <h3 className="text-lg font-bold text-gray-800">แก้ไขสินค้า</h3>
                                <div className="grid grid-cols-2 gap-3">
                                    {field('sku', 'รหัส SKU')}
                                    {field('name', 'ชื่อสินค้า')}
                                    <div>
                                        <label className="text-xs text-gray-500">หมวดหมู่</label>
                                        <select value={edit.category} onChange={e => setEdit({ ...edit, category: e.target.value })} className="w-full border p-2 rounded-lg text-sm">
                                            {INV_CATEGORIES.map(c => <option key={c.value} value={c.value}>{c.full}</option>)}
                                        </select>
                                    </div>
                                    {field('qty', 'จำนวน', 'number')}
                                    {userRole === 'admin' && field('cost', 'ต้นทุน (฿)', 'number')}
                                    {field('price', 'ราคาขาย (฿)', 'number')}
                                    {(edit.category === 'เครื่องใหม่' || edit.category === 'เครื่องมือ2') && (<>
                                        {field('battery', '% แบตเตอรี่', 'text', false)}
                                        {field('capacity', 'ความจุเครื่อง', 'text', false)}
                                        {field('color', 'สีของตัวเครื่อง', 'text', false)}
                                    </>)}
                                </div>
                                <ImageUrlsEditor urls={edit.imgs || []} onChange={imgs => setEdit({ ...edit, imgs })} onBusyChange={setImgBusy} />
                                <div className="flex gap-3">
                                    <button type="button" onClick={() => setEdit(null)} className="flex-1 border py-2.5 rounded-xl font-bold text-gray-600 hover:bg-gray-50">ยกเลิก</button>
                                    <button type="submit" disabled={imgBusy} className="flex-1 bg-blue-600 text-white py-2.5 rounded-xl font-bold hover:bg-blue-700 shadow-md disabled:opacity-50">{imgBusy ? 'กำลังอัปโหลดรูป...' : 'บันทึก'}</button>
                                </div>
                            </form>
                        </div>
                    )}

                {galleryItem && <ImageGallery item={galleryItem} onClose={() => setGalleryItem(null)} />}
                </div>
            );
        };

        // --- 3.3 งานซ่อม (Repair) ---
        const RepairTab = ({ repairs, setRepairs, inventory, setInventory, addTransaction, showToast, onPrint }) => {
            const [formData, setFormData] = useState({ name: '', phone: '', model: '', issue: '', partId: '', price: '' });

            const handleSubmit = (e) => {
                e.preventDefault();
                const part = inventory.find(i => i.id === formData.partId);
                const newRepair = {
                    id: uid('REP'),
                    date: new Date().toLocaleDateString('th-TH'),
                    ...formData,
                    partName: part ? part.name : 'ไม่ได้ใช้อะไหล่/ลูกค้านำมาเอง',
                    cost: part ? part.cost : 0,
                    price: parseFloat(formData.price),
                    status: 'รอคิวซ่อม'
                };
                setRepairs([...repairs, newRepair]);
                setFormData({ name: '', phone: '', model: '', issue: '', partId: '', price: '' });
                showToast(`รับงานซ่อม ${newRepair.id} สำเร็จ`);
            };

            const handleUpdateStatus = (id, currentStatus, partId) => {
                if (currentStatus === 'ซ่อมเสร็จสิ้น') return;
                const repair = repairs.find(r => r.id === id);
                if (!repair) return;
                const part = partId ? inventory.find(i => i.id === partId) : null;

                // 1) ตัดสต็อกอะไหล่ที่ใช้ในงานซ่อมออกจากคลังสินค้า
                if (part) {
                    if (part.qty <= 0) { alert('อะไหล่ชิ้นนี้หมดสต็อก ไม่สามารถตัดสต็อกได้!'); return; }
                    setInventory(prev => prev.map(i => i.id === partId ? { ...i, qty: i.qty - 1 } : i));
                }

                // 2) กำไรงานซ่อม = ค่าซ่อม - ต้นทุนอะไหล่ (ติดลบได้ถ้าค่าซ่อมต่ำกว่าทุนอะไหล่)
                const price = repair.price || 0;
                const partCost = part ? (part.cost || 0) : 0;
                const profit = price - partCost;

                setRepairs(repairs.map(r => r.id === id ? { ...r, status: 'ซ่อมเสร็จสิ้น', cost: partCost, profit } : r));

                // 3) ลงสมุดบัญชี: รายรับ = ค่าซ่อม, กำไร = ค่าซ่อม - ทุนอะไหล่
                const note = part
                    ? `ใช้อะไหล่: ${part.name} (ทุน ฿${partCost.toLocaleString()}) กำไร ฿${profit.toLocaleString()}`
                    : 'ไม่ใช้อะไหล่ (กำไรเต็มจำนวน)';
                addTransaction('รายรับ', `งานซ่อมบิล ${id} (${repair.model})`, price, 1, id, note, profit);
                showToast(part ? `จบงานซ่อม ตัดสต็อก ${part.name} และบันทึกกำไร ฿${profit.toLocaleString()} แล้ว` : `จบงานซ่อม บันทึกกำไร ฿${profit.toLocaleString()} แล้ว`);
            };

            return (
                <div className="space-y-6 page-fade-in">
                    <h2 className="text-2xl font-bold text-gray-800">จัดการงานซ่อม</h2>
                    <div className="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                        <form onSubmit={handleSubmit} className="grid grid-cols-1 md:grid-cols-6 gap-4">
                            <div><label className="text-xs text-gray-500">ชื่อลูกค้า</label><input required value={formData.name} onChange={e => setFormData({...formData, name: e.target.value})} className="w-full border p-2.5 rounded-xl text-sm" /></div>
                            <div><label className="text-xs text-gray-500">เบอร์โทร</label><input required value={formData.phone} onChange={e => setFormData({...formData, phone: e.target.value})} className="w-full border p-2.5 rounded-xl text-sm" /></div>
                            <div><label className="text-xs text-gray-500">รุ่นเครื่อง</label><input required value={formData.model} onChange={e => setFormData({...formData, model: e.target.value})} className="w-full border p-2.5 rounded-xl text-sm" /></div>
                            <div><label className="text-xs text-gray-500">อาการเสีย</label><input required value={formData.issue} onChange={e => setFormData({...formData, issue: e.target.value})} className="w-full border p-2.5 rounded-xl text-sm" /></div>
                            <div>
                                <label className="text-xs text-gray-500">เลือกอะไหล่ (ถ้ามี)</label>
                                <select value={formData.partId} onChange={e => setFormData({...formData, partId: e.target.value})} className="w-full border p-2.5 rounded-xl text-sm bg-white">
                                    <option value="">-- ไม่ใช้อะไหล่ --</option>
                                    {inventory.filter(i => i.category === 'อะไหล่').map(i => <option key={i.id} value={i.id} disabled={i.qty<=0}>{i.name} (เหลือ {i.qty})</option>)}
                                </select>
                            </div>
                            <div><label className="text-xs text-gray-500">ราคาประเมิน (฿)</label><input required type="number" value={formData.price} onChange={e => setFormData({...formData, price: e.target.value})} className="w-full border p-2.5 rounded-xl text-sm" /></div>
                            <button type="submit" className="bg-orange-500 text-white font-bold py-3 px-4 rounded-xl md:col-span-6 hover:bg-orange-600 shadow-md transition transform active:scale-[0.99]">รับงานซ่อม</button>
                        </form>
                    </div>

                    <div className="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
                        <div className="overflow-x-auto">
                        <table className="w-full text-left">
                            <thead className="bg-slate-50 text-slate-600 text-sm">
                                <tr><th className="p-4 border-b">เลขที่บิล</th><th className="p-4 border-b">ลูกค้า</th><th className="p-4 border-b">ข้อมูลเครื่อง/อาการ</th><th className="p-4 border-b">ราคา</th><th className="p-4 border-b">สถานะ</th><th className="p-4 border-b text-center">จัดการ</th></tr>
                            </thead>
                            <tbody>
                                {repairs.length === 0 ? <tr><td colSpan={6} className="p-8 text-center text-gray-400">ยังไม่มีงานซ่อม</td></tr> : repairs.map(r => (
                                    <tr key={r.id} className="hover:bg-gray-50 border-b text-sm transition">
                                        <td className="p-4"><div className="font-mono font-bold text-orange-600">{r.id}</div><div className="text-xs text-gray-400">{r.date}</div></td>
                                        <td className="p-4"><div className="font-medium">{r.name}</div><div className="text-xs text-gray-500">{r.phone}</div></td>
                                        <td className="p-4"><div className="font-medium">{r.model} - {r.issue}</div><div className="text-xs text-blue-500">อะไหล่: {r.partName}</div></td>
                                        <td className="p-4 font-bold text-gray-700">฿{r.price?.toLocaleString()}<div className="text-xs font-medium text-purple-600">กำไร ฿{((r.price || 0) - (r.cost || 0)).toLocaleString()}</div></td>
                                        <td className="p-4"><span className={`px-2.5 py-1 rounded-full text-xs font-bold ${r.status === 'ซ่อมเสร็จสิ้น' ? 'bg-green-100 text-green-700' : 'bg-yellow-100 text-yellow-700'}`}>{r.status}</span></td>
                                        <td className="p-4 text-center">
                                            {r.status !== 'ซ่อมเสร็จสิ้น' ? (
                                                <button onClick={() => handleUpdateStatus(r.id, r.status, r.partId)} className="bg-green-500 text-white px-3 py-1.5 rounded-lg text-xs font-bold hover:bg-green-600 shadow-sm">กดจบงาน/ตัดสต็อก</button>
                                            ) : (
                                                <div className="flex flex-col gap-2 items-center">
                                                    <button onClick={() => onPrint('repair', r)} className="text-xs bg-blue-100 text-blue-700 px-3 py-1.5 rounded-lg hover:bg-blue-200 font-bold flex items-center">
                                                        <i className="fas fa-print mr-1"></i> พิมพ์ A4
                                                    </button>
                                                </div>
                                            )}
                                        </td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                        </div>
                    </div>
                </div>
            );
        };

        // --- 3.4 รับจำนำ (Pawn) ---
        const PawnTab = ({ pawns, setPawns, setTransactions, showToast, addTransaction, onPrint }) => {
            const [formData, setFormData] = useState({ name: '', phone: '', idCard: '', model: '', imei: '', principal: '', startDate: '', dueDate: '', brand: '', modelSel: '' });

            const syncToCalendar = async (pawnData) => {
                showToast("กำลังซิงค์กับปฏิทิน...");
                try {
                    const response = await fetch(SHEET_API_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify({ action: 'syncCalendar', pawn: pawnData })
                    });
                    const result = await response.json();
                    if (!result.success) { showToast(result.message || 'ซิงค์ปฏิทินไม่สำเร็จ'); return; }
                    setPawns(prev => prev.map(p => p.id === pawnData.id ? { ...p, eventId: result.eventId } : p));
                    showToast(result.message || "ซิงค์ปฏิทินสำเร็จ");
                } catch (error) {
                    console.error("Calendar Sync Error:", error);
                    showToast("ไม่สามารถซิงค์ปฏิทินได้");
                }
            };

            const handleSubmit = (e) => {
                e.preventDefault();
                const principal = parseFloat(formData.principal);
                const newPawn = {
                    id: nextPawnId(pawns),
                    ...formData,
                    principal,
                    interest: principal * 0.10,
                    status: 'อยู่ในระหว่างจำนำ',
                    eventId: null
                };
                
                setPawns([...pawns, newPawn]);
                addTransaction('รายจ่าย', `ปล่อยเงินรับจำนำ: ${newPawn.model}`, principal, 1, newPawn.id);
                syncToCalendar(newPawn);

                setFormData({ name: '', phone: '', idCard: '', model: '', imei: '', principal: '', startDate: '', dueDate: '', brand: '', modelSel: '' });
                showToast(`รับจำนำสำเร็จ (ดอกเบี้ย 10%)`);
            };

            // --- ต่อดอก: เก็บดอกเบี้ย 10% ของยอดจำนำเป็นกำไร และเลื่อนวันครบกำหนด ---
            const [renewTarget, setRenewTarget] = useState(null);
            const [historyTarget, setHistoryTarget] = useState(null);
            const [renewDate, setRenewDate] = useState('');
            const addDaysYmd = (ymd, n) => {
                const base = ymd && !isNaN(new Date(ymd)) ? new Date(ymd + 'T00:00:00') : new Date();
                base.setDate(base.getDate() + n);
                return dayKey(base);
            };
            const openRenew = (p) => { setRenewTarget(p); setRenewDate(addDaysYmd(p.dueDate, 10)); };
            const confirmRenew = () => {
                const p = renewTarget;
                if (!p || !renewDate) { showToast('กรุณาเลือกวันครบกำหนดใหม่'); return; }
                const profit = (p.principal || 0) * 0.10;
                const lateNow = p.dueDate ? Math.max(0, Math.round((new Date(dayKey(new Date())) - new Date(p.dueDate)) / 86400000)) : 0;
                const updated = {
                    ...p,
                    dueDate: renewDate,
                    status: 'อยู่ในระหว่างจำนำ',
                    renewCount: (p.renewCount || 0) + 1,
                    renewTotal: (p.renewTotal || 0) + profit,
                    lastRenewDate: dayKey(new Date()),
                    renewLog: [...(p.renewLog || []), { date: dayKey(new Date()), amount: profit, fromDue: p.dueDate || '', toDue: renewDate, lateDays: lateNow }]
                };
                setPawns(pawns.map(x => x.id === p.id ? updated : x));
                addTransaction('รายรับ', `ต่อดอกจำนำ: ${p.model}`, profit, 1, p.id, `ต่อดอกครั้งที่ ${updated.renewCount} (10% ของ ฿${(p.principal || 0).toLocaleString()}) เลื่อนครบกำหนด ${p.dueDate || '-'} → ${renewDate}`);
                syncToCalendar(updated);
                setRenewTarget(null);
                showToast(`ต่อดอกสำเร็จ กำไร ฿${profit.toLocaleString()}`);
            };
            const totalRenewProfit = pawns.reduce((sum, x) => sum + (x.renewTotal || 0), 0);

            const handleExtendDueDate = (pawnId, newDueDate) => {
                const pawn = pawns.find(p => p.id === pawnId);
                const updatedPawn = { ...pawn, dueDate: newDueDate };
                setPawns(pawns.map(p => p.id === pawnId ? updatedPawn : p));
                syncToCalendar(updatedPawn);
            };

            const ACTIVE_STATUS = ['อยู่ในระหว่างจำนำ', 'อยู่ในระหว่างหลุดจำนำ'];
            const syncAllToCalendar = async () => {
                const todo = pawns.filter(x => ACTIVE_STATUS.includes(x.status) && !x.eventId && x.dueDate);
                if (todo.length === 0) { showToast('ไม่มีรายการที่ต้องส่งเข้าปฏิทิน'); return; }
                for (const p of todo) { await syncToCalendar(p); }
                showToast(`ส่งนัดเข้าปฏิทินแล้ว ${todo.length} รายการ`);
            };

            const handleUpdateStatus = (id, newStatus) => {
                const p = pawns.find(x => x.id === id);
                setPawns(pawns.map(pwn => pwn.id === id ? { ...pwn, status: newStatus } : pwn));
                if (newStatus === 'ไถ่เครื่องออก') {
                    addTransaction('รายรับ', `ลูกค้าไถ่เครื่องจำนำ: ${p.model}`, p.principal + p.interest, 1, p.id);
                } else if (newStatus === 'ออกก่อนกำหนด') {
                    addTransaction('รายรับ', `ออกก่อนกำหนด: ${p.model}`, p.principal, 1, p.id);
                }
                showToast(`อัปเดตสถานะเป็น ${newStatus}`);
                syncToCalendar({ ...p, status: newStatus });
            };

            // --- แก้ไขข้อมูลรายการจำนำ (ชื่อ / เบอร์ / บัตร / รุ่น / IMEI / ยอดจำนำ / วันที่) ---
            const [editTarget, setEditTarget] = useState(null);
            const [editForm, setEditForm] = useState({});
            const openEdit = (p) => {
                setEditTarget(p);
                setEditForm({
                    name: p.name || '', phone: p.phone || '', idCard: p.idCard || '',
                    brand: p.brand || '', modelSel: p.modelSel || '', model: p.model || '',
                    imei: p.imei || '', principal: String(p.principal ?? ''),
                    startDate: p.startDate || '', dueDate: p.dueDate || ''
                });
            };
            const saveEdit = (e) => {
                e.preventDefault();
                const p = editTarget;
                const principal = parseFloat(editForm.principal);
                if (!editForm.name.trim()) { showToast('กรุณากรอกชื่อลูกค้า'); return; }
                if (!editForm.model.trim()) { showToast('กรุณาระบุรุ่นเครื่อง'); return; }
                if (isNaN(principal) || principal <= 0) { showToast('ยอดเงินจำนำไม่ถูกต้อง'); return; }
                const updated = {
                    ...p,
                    name: editForm.name.trim(), phone: editForm.phone.trim(), idCard: editForm.idCard.trim(),
                    brand: editForm.brand, modelSel: editForm.modelSel, model: editForm.model.trim(),
                    imei: editForm.imei.trim(), principal, interest: principal * 0.10,
                    startDate: editForm.startDate, dueDate: editForm.dueDate
                };
                setPawns(pawns.map(x => x.id === p.id ? updated : x));
                // ถ้าแก้ยอดจำนำ/รุ่น ให้แก้รายการ "ปล่อยเงินรับจำนำ" ในสมุดบัญชีให้ตรงกัน
                if (principal !== p.principal || updated.model !== p.model) {
                    setTransactions(prev => prev.map(t => (t.ref === p.id && typeof t.detail === 'string' && t.detail.startsWith('ปล่อยเงินรับจำนำ'))
                        ? { ...t, detail: `ปล่อยเงินรับจำนำ: ${updated.model}`, amount: principal } : t));
                }
                if (ACTIVE_STATUS.includes(p.status) && updated.dueDate && (updated.dueDate !== p.dueDate || updated.model !== p.model || updated.name !== p.name)) {
                    syncToCalendar(updated);
                }
                setEditTarget(null);
                showToast(`แก้ไขรายการ ${p.id} เรียบร้อย`);
            };

            return (
                <div className="space-y-6 page-fade-in">
                    <div className="flex flex-wrap items-center justify-between gap-3">
                        <h2 className="text-2xl font-bold text-gray-800">ระบบรับจำนำ</h2>
                        {totalRenewProfit > 0 && <span className="bg-green-50 text-green-700 border border-green-200 px-3 py-1.5 rounded-xl text-sm font-bold"><i className="fas fa-sync-alt mr-1.5"></i>กำไรจากต่อดอกสะสม ฿{totalRenewProfit.toLocaleString()}</span>}
                        <button onClick={syncAllToCalendar} className="bg-white border border-blue-200 text-blue-600 px-4 py-2 rounded-xl text-sm font-bold hover:bg-blue-50 shadow-sm transition"><i className="fas fa-calendar-plus mr-2"></i>ส่งนัดครบกำหนดทั้งหมดเข้าปฏิทิน</button>
                    </div>
                    
                    <div className="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                        <form onSubmit={handleSubmit} className="grid grid-cols-1 md:grid-cols-4 gap-4">
                            <div><label className="text-xs text-gray-500">ชื่อลูกค้าผู้จำนำ</label><input required value={formData.name} onChange={e => setFormData({...formData, name: e.target.value})} className="w-full border p-2.5 rounded-xl text-sm" placeholder="นายสมชาย ใจดี" /></div>
                            <div><label className="text-xs text-gray-500">เบอร์โทรศัพท์</label><input required value={formData.phone} onChange={e => setFormData({...formData, phone: e.target.value})} className="w-full border p-2.5 rounded-xl text-sm" placeholder="0812345678" /></div>
                            <div><label className="text-xs text-gray-500">เลขบัตรประชาชน</label><input required value={formData.idCard} onChange={e => setFormData({...formData, idCard: e.target.value})} className="w-full border p-2.5 rounded-xl text-sm" placeholder="1-xxxx-xxxxx-xx-x" /></div>
                            <BrandModelPicker brand={formData.brand} model={formData.modelSel} onChange={({ brand, model, resolved }) => setFormData({ ...formData, brand, modelSel: model, model: resolved })} />
                            {needsCustomName(formData.brand, formData.modelSel) && (
                                <div><label className="text-xs text-gray-500">ชื่อ/รุ่นเครื่อง (พิมพ์เอง)</label><input required value={formData.model} onChange={e => setFormData({...formData, model: e.target.value})} className="w-full border p-2.5 rounded-xl text-sm" placeholder="เช่น iPhone 14 Pro 128GB" /></div>
                            )}
                            <div><label className="text-xs text-gray-500">หมายเลข IMEI / Serial</label><input required value={formData.imei} onChange={e => setFormData({...formData, imei: e.target.value})} className="w-full border p-2.5 rounded-xl text-sm" placeholder="35xxxxxxxxxxxxx" /></div>
                            <div><label className="text-xs text-gray-500">ยอดเงินจำนำ (฿)</label><input required type="number" value={formData.principal} onChange={e => setFormData({...formData, principal: e.target.value})} className="w-full border p-2.5 rounded-xl text-sm" placeholder="10000" /></div>
                            <div><label className="text-xs text-gray-500">วันที่รับจำนำ</label><input required type="date" value={formData.startDate} onChange={e => setFormData({...formData, startDate: e.target.value})} className="w-full border p-2.5 rounded-xl text-sm" /></div>
                            <div><label className="text-xs text-gray-500">วันที่ครบกำหนด</label><input required type="date" value={formData.dueDate} onChange={e => setFormData({...formData, dueDate: e.target.value})} className="w-full border p-2.5 rounded-xl text-sm" /></div>
                            <button type="submit" className="bg-purple-600 text-white font-bold py-3 px-4 rounded-xl md:col-span-4 hover:bg-purple-700 shadow-md transition transform active:scale-[0.99]">บันทึกรับจำนำ</button>
                        </form>
                    </div>

                    <div className="flex flex-wrap items-center gap-4 text-xs text-gray-600 px-1">
                        <span className="flex items-center gap-1.5"><span className="inline-block w-3 h-3 rounded bg-yellow-300"></span>แถวสีเหลือง = ถึงวันครบกำหนด / เกินกำหนดจำนำ</span>
                        <span className="flex items-center gap-1.5"><span className="inline-block w-3 h-3 rounded bg-red-500"></span>แถวสีแดง = หลุดจำนำ / หยุดจำนำ</span>
                    </div>
                    {/* ตารางแสดงข้อมูลจำนำครบถ้วนทุกรายละเอียด */}
                    <div className="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
                        <div className="overflow-x-auto">
                        <table className="w-full text-left border-collapse min-w-[1000px]">
                            <thead className="bg-slate-50 text-slate-600 text-xs uppercase font-bold">
                                <tr>
                                    <th className="p-4 border-b">เลขที่</th>
                                    <th className="p-4 border-b">ข้อมูลผู้จำนำ</th>
                                    <th className="p-4 border-b">ข้อมูลตัวเครื่อง & IMEI</th>
                                    <th className="p-4 border-b text-right">ยอดเงินจำนำ</th>
                                    <th className="p-4 border-b text-right">ดอกเบี้ย (10%)</th>
                                    <th className="p-4 border-b text-center">วันที่รับ / ครบกำหนด</th>
                                    <th className="p-4 border-b text-center">สถานะ</th>
                                    <th className="p-4 border-b text-center">จัดการ</th>
                                </tr>
                            </thead>
                            <tbody>
                                {pawns.length === 0 ? <tr><td colSpan={8} className="p-8 text-center text-gray-400">ยังไม่มีรายการรับจำนำ</td></tr> : pawns.map(p => {
                                    const today = new Date(); today.setHours(0,0,0,0);
                                    const todayStr = dayKey(new Date());
                                    const isOverdue = ACTIVE_STATUS.includes(p.status) && ((p.dueDate && p.dueDate < todayStr) || p.status === 'อยู่ในระหว่างหลุดจำนำ');
                                    const isForfeit = p.status === 'หลุดจำนำ';
                                    const isDueToday = ACTIVE_STATUS.includes(p.status) && p.dueDate === todayStr;
                                    const isYellow = isOverdue || isDueToday;
                                    const overdueDays = (isOverdue && p.dueDate) ? Math.max(0, Math.round((new Date(todayStr) - new Date(p.dueDate)) / 86400000)) : 0;
                                    const displayStatus = isOverdue ? ('เกินกำหนด' + (overdueDays > 0 ? ' ' + overdueDays + ' วัน' : '')) : (isDueToday ? 'ครบกำหนดวันนี้' : p.status);
                                    
                                    return (
                                    <tr key={p.id} className={`border-b text-sm transition ${isForfeit ? 'bg-red-50 hover:bg-red-100' : isYellow ? 'bg-yellow-100 hover:bg-yellow-200' : 'hover:bg-gray-50'}`}>
                                        <td className={`p-4 font-mono font-bold text-purple-600 whitespace-nowrap border-l-4 ${isForfeit ? 'border-red-500' : isYellow ? 'border-yellow-400' : 'border-transparent'}`}>{p.id}</td>
                                        <td className="p-4">
                                            <div className="font-bold text-gray-800">{p.name}</div>
                                            <div className="text-xs text-gray-500">โทร: {p.phone}</div>
                                            <div className="text-[11px] text-gray-400">ปปช: {p.idCard || '-'}</div>
                                        </td>
                                        <td className="p-4">
                                            <div className="font-semibold text-gray-800">{p.model}</div>
                                            <div className="text-xs font-mono text-gray-500">IMEI: {p.imei || '-'}</div>
                                        </td>
                                        <td className="p-4 text-right font-bold text-gray-800">฿{(p.principal || 0).toLocaleString()}</td>
                                        <td className="p-4 text-right font-medium text-purple-600">
                                            ฿{(p.interest || (p.principal * 0.1)).toLocaleString()}
                                            {p.renewCount > 0 && <div className="text-[11px] text-green-600 font-bold">ต่อดอก {p.renewCount} ครั้ง (+฿{(p.renewTotal || 0).toLocaleString()})</div>}
                                        </td>
                                        <td className="p-4 text-center text-xs whitespace-nowrap">
                                            <div className="text-gray-500">เริ่ม: {p.startDate || '-'}</div>
                                            <div className={`font-bold mt-1 ${isForfeit ? 'text-red-600' : isYellow ? 'text-yellow-700' : 'text-gray-800'}`}>
                                                {ACTIVE_STATUS.includes(p.status)
                                                    ? <input key={p.id + p.dueDate} type="date" defaultValue={p.dueDate} title="เปลี่ยนวันครบกำหนด (ปฏิทินจะอัปเดตตาม)" onBlur={e => { if (e.target.value && e.target.value !== p.dueDate) handleExtendDueDate(p.id, e.target.value); }} className={`border rounded p-1 text-xs font-bold bg-white ${isOverdue ? 'text-yellow-700 border-yellow-400' : 'text-gray-800'}`} />
                                                    : p.dueDate}
                                            </div>
                                        </td>
                                        <td className="p-4 text-center whitespace-nowrap">
                                            <span className={`px-2.5 py-1 rounded-full text-xs font-bold ${isForfeit ? 'bg-red-500 text-white' : isYellow ? 'bg-yellow-300 text-yellow-900' : p.status === 'อยู่ในระหว่างจำนำ' ? 'bg-blue-100 text-blue-700' : 'bg-green-100 text-green-700'}`}>
                                                {displayStatus}
                                            </span>
                                        </td>
                                        <td className="p-4 text-center whitespace-nowrap">
                                            <button onClick={() => setHistoryTarget(p)} className="text-purple-600 hover:bg-purple-100 p-2 rounded-lg mr-1" title="ประวัติ / พิมพ์ใบเสร็จ"><i className="fas fa-receipt"></i></button>
                                            <button onClick={() => openEdit(p)} className="text-blue-600 hover:bg-blue-100 p-2 rounded-lg mr-1" title="แก้ไขรายการ"><i className="fas fa-edit"></i></button>
                                            <select className="border rounded-lg text-xs p-1.5 bg-white cursor-pointer font-medium" value={p.status} onChange={(e) => { if (e.target.value === '__renew') openRenew(p); else handleUpdateStatus(p.id, e.target.value); }}>
                                                <option value="อยู่ในระหว่างจำนำ">อยู่ในระหว่างจำนำ</option>
                                                {ACTIVE_STATUS.includes(p.status) && <option value="__renew">ต่อดอก (เลื่อนวันครบกำหนด)</option>}
                                                <option value="ไถ่เครื่องออก">ไถ่เครื่องออก</option>
                                                <option value="ออกก่อนกำหนด">ออกก่อนกำหนด</option>
                                                <option value="หลุดจำนำ">หลุดจำนำ / หยุดจำนำ (ยึดเครื่อง)</option>
                                            </select>
                                        </td>
                                    </tr>
                                )})}
                            </tbody>
                        </table>
                        </div>
                    </div>

                    {historyTarget && (() => {
                        const hp = pawns.find(x => x.id === historyTarget.id) || historyTarget;
                        const sm = pawnSummary(hp);
                        const baht = (n) => '฿' + (Number(n) || 0).toLocaleString();
                        return ReactDOM.createPortal(
                            <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-[70] p-4" onClick={() => setHistoryTarget(null)}>
                                <div onClick={e => e.stopPropagation()} className="bg-white rounded-2xl shadow-xl w-full max-w-2xl max-h-[90vh] overflow-y-auto p-6 space-y-4 modal-enter">
                                    <div className="flex justify-between items-center">
                                        <h3 className="text-lg font-bold text-gray-800"><i className="fas fa-receipt text-purple-600 mr-2"></i>ประวัติรายการจำนำ <span className="font-mono text-purple-600">{hp.id}</span></h3>
                                        <button onClick={() => setHistoryTarget(null)} className="text-gray-400 hover:text-gray-600"><i className="fas fa-times text-lg"></i></button>
                                    </div>
                                    <div className="grid grid-cols-2 gap-x-4 gap-y-1 text-sm">
                                        <div><span className="text-gray-500">ผู้จำนำ:</span> <b>{hp.name}</b></div><div><span className="text-gray-500">โทร:</span> {hp.phone || '-'}</div>
                                        <div><span className="text-gray-500">เครื่อง:</span> <b>{hp.model}</b></div><div><span className="text-gray-500">IMEI:</span> <span className="font-mono">{hp.imei || '-'}</span></div>
                                        <div><span className="text-gray-500">เงินต้น:</span> <b>{baht(sm.principal)}</b></div><div><span className="text-gray-500">ดอกเบี้ย/รอบ (10%):</span> <b>{baht(sm.interest)}</b></div>
                                        <div><span className="text-gray-500">สถานะ:</span> <b>{hp.status}</b></div><div><span className="text-gray-500">ครบกำหนดล่าสุด:</span> <b>{hp.dueDate || '-'}</b></div>
                                    </div>
                                    <div className="grid grid-cols-2 md:grid-cols-4 gap-2 text-center text-xs">
                                        <div className="bg-green-50 border border-green-200 rounded-xl p-2"><div className="text-gray-500">ต่อดอก</div><div className="font-bold text-green-700 text-base">{sm.renewCount} ครั้ง</div></div>
                                        <div className="bg-purple-50 border border-purple-200 rounded-xl p-2"><div className="text-gray-500">รวมดอกเบี้ยที่รับแล้ว</div><div className="font-bold text-purple-700 text-base">{baht(sm.renewTotal)}</div></div>
                                        <div className="bg-yellow-50 border border-yellow-200 rounded-xl p-2"><div className="text-gray-500">เกินกำหนด</div><div className="font-bold text-yellow-700 text-base">{sm.lateTimes} ครั้ง / {sm.lateDays} วัน</div></div>
                                        <div className="bg-blue-50 border border-blue-200 rounded-xl p-2"><div className="text-gray-500">ยอดไถ่ถอนตอนนี้</div><div className="font-bold text-blue-700 text-base">{baht(sm.redeem)}</div></div>
                                    </div>
                                    <div className="space-y-2 text-sm">
                                        <div className="p-3 rounded-xl bg-gray-50 border"><b>รับจำนำ</b> วันที่ {hp.startDate || '-'} · เงินต้น {baht(sm.principal)}</div>
                                        {sm.log.map((x, i) => (
                                            <div key={i} className="p-3 rounded-xl bg-green-50 border border-green-200"><b>ต่อดอกครั้งที่ {i + 1}</b> วันที่ {x.date} · รับดอก {baht(x.amount)} · ครบกำหนด {x.fromDue || '-'} → {x.toDue}{x.lateDays > 0 ? <span className="text-yellow-700 font-bold"> · เกินกำหนด {x.lateDays} วัน</span> : null}</div>
                                        ))}
                                        {sm.renewCount > sm.log.length && <div className="p-3 rounded-xl bg-green-50 border border-green-200 text-gray-600">ต่อดอกก่อนระบบบันทึกประวัติรายครั้ง {sm.renewCount - sm.log.length} ครั้ง{hp.lastRenewDate ? ` (ล่าสุดวันที่ ${hp.lastRenewDate})` : ''}</div>}
                                        <div className={`p-3 rounded-xl border ${sm.curLate > 0 ? 'bg-yellow-50 border-yellow-300' : 'bg-gray-50'}`}><b>สถานะตอนนี้:</b> {hp.status}{sm.curLate > 0 ? ` · เกินกำหนดแล้ว ${sm.curLate} วัน` : ''} · ครบกำหนด {hp.dueDate || '-'}</div>
                                    </div>
                                    <div className="flex gap-2">
                                        <button onClick={() => onPrint('pawn', hp)} className="flex-1 bg-purple-600 text-white font-bold py-2.5 rounded-xl hover:bg-purple-700 shadow-md"><i className="fas fa-print mr-2"></i>พิมพ์ใบเสร็จ</button>
                                        <button onClick={() => setHistoryTarget(null)} className="px-5 bg-gray-100 text-gray-700 font-bold rounded-xl hover:bg-gray-200">ปิด</button>
                                    </div>
                                </div>
                            </div>, document.body);
                    })()}

                    {editTarget && (
                        <div className="fixed inset-0 z-50 bg-black/50 flex items-center justify-center p-4" onClick={() => setEditTarget(null)}>
                            <form onSubmit={saveEdit} className="bg-white rounded-2xl shadow-xl w-full max-w-2xl max-h-[90vh] overflow-y-auto p-6 space-y-4" onClick={e => e.stopPropagation()}>
                                <h3 className="text-lg font-bold text-gray-800"><i className="fas fa-edit text-blue-600 mr-2"></i>แก้ไขรายการจำนำ <span className="font-mono text-purple-600">{editTarget.id}</span></h3>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    <div><label className="text-xs text-gray-500">ชื่อลูกค้าผู้จำนำ</label><input required value={editForm.name} onChange={e => setEditForm({...editForm, name: e.target.value})} className="w-full border p-2.5 rounded-xl text-sm" /></div>
                                    <div><label className="text-xs text-gray-500">เบอร์โทรศัพท์</label><input value={editForm.phone} onChange={e => setEditForm({...editForm, phone: e.target.value})} className="w-full border p-2.5 rounded-xl text-sm" /></div>
                                    <div className="md:col-span-2"><label className="text-xs text-gray-500">เลขบัตรประชาชน</label><input value={editForm.idCard} onChange={e => setEditForm({...editForm, idCard: e.target.value})} className="w-full border p-2.5 rounded-xl text-sm" /></div>
                                    <BrandModelPicker brand={editForm.brand} model={editForm.modelSel} onChange={({ brand, model, resolved }) => setEditForm({ ...editForm, brand, modelSel: model, model: resolved || editForm.model })} />
                                    <div className="md:col-span-2"><label className="text-xs text-gray-500">ชื่อ/รุ่นเครื่อง (เลือกจากรายการด้านบน หรือพิมพ์แก้เองได้)</label><input required value={editForm.model} onChange={e => setEditForm({...editForm, model: e.target.value})} className="w-full border p-2.5 rounded-xl text-sm" /></div>
                                    <div><label className="text-xs text-gray-500">หมายเลข IMEI / Serial</label><input value={editForm.imei} onChange={e => setEditForm({...editForm, imei: e.target.value})} className="w-full border p-2.5 rounded-xl text-sm" /></div>
                                    <div><label className="text-xs text-gray-500">ยอดเงินจำนำ (฿)</label><input required type="number" min="0" step="any" value={editForm.principal} onChange={e => setEditForm({...editForm, principal: e.target.value})} className="w-full border p-2.5 rounded-xl text-sm" /></div>
                                    <div><label className="text-xs text-gray-500">วันที่รับจำนำ</label><input type="date" value={editForm.startDate} onChange={e => setEditForm({...editForm, startDate: e.target.value})} className="w-full border p-2.5 rounded-xl text-sm" /></div>
                                    <div><label className="text-xs text-gray-500">วันที่ครบกำหนด</label><input type="date" value={editForm.dueDate} onChange={e => setEditForm({...editForm, dueDate: e.target.value})} className="w-full border p-2.5 rounded-xl text-sm" /></div>
                                </div>
                                <div className="text-xs text-gray-500 bg-slate-50 border rounded-xl p-3">ดอกเบี้ย 10% จะคำนวณใหม่จากยอดจำนำ และถ้าแก้ยอด/รุ่น รายการ "ปล่อยเงินรับจำนำ" ในสมุดบัญชีจะถูกแก้ให้ตรงกัน</div>
                                <div className="flex gap-3">
                                    <button type="button" onClick={() => setEditTarget(null)} className="flex-1 border border-gray-300 text-gray-600 font-bold py-2.5 rounded-xl hover:bg-gray-50">ยกเลิก</button>
                                    <button type="submit" className="flex-1 bg-blue-600 text-white font-bold py-2.5 rounded-xl hover:bg-blue-700 shadow-md">บันทึกการแก้ไข</button>
                                </div>
                            </form>
                        </div>
                    )}

                    {renewTarget && (
                        <div className="fixed inset-0 z-50 bg-black/50 flex items-center justify-center p-4" onClick={() => setRenewTarget(null)}>
                            <div className="bg-white rounded-2xl shadow-xl w-full max-w-md p-6 space-y-4" onClick={e => e.stopPropagation()}>
                                <h3 className="text-lg font-bold text-gray-800"><i className="fas fa-sync-alt text-purple-600 mr-2"></i>ต่อดอก {renewTarget.id}</h3>
                                <div className="text-sm text-gray-600 space-y-1">
                                    <div>ลูกค้า: <b>{renewTarget.name}</b> · {renewTarget.model}</div>
                                    <div>ยอดจำนำ: <b>฿{(renewTarget.principal || 0).toLocaleString()}</b></div>
                                    <div>ครบกำหนดเดิม: <b className="text-red-500">{renewTarget.dueDate || '-'}</b></div>
                                </div>
                                <div className="bg-green-50 border border-green-200 rounded-xl p-3 text-sm text-green-700 font-bold">
                                    ดอกเบี้ยที่รับ (กำไร 10%): ฿{((renewTarget.principal || 0) * 0.10).toLocaleString()}
                                </div>
                                <div>
                                    <label className="text-xs text-gray-500">วันครบกำหนดใหม่ (เปลี่ยนวันได้)</label>
                                    <input type="date" value={renewDate} onChange={e => setRenewDate(e.target.value)} className="w-full border p-2.5 rounded-xl text-sm" />
                                </div>
                                <div className="flex gap-3">
                                    <button onClick={() => setRenewTarget(null)} className="flex-1 border border-gray-300 text-gray-600 font-bold py-2.5 rounded-xl hover:bg-gray-50">ยกเลิก</button>
                                    <button onClick={confirmRenew} className="flex-1 bg-purple-600 text-white font-bold py-2.5 rounded-xl hover:bg-purple-700 shadow-md">ยืนยันต่อดอก</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        // --- 3.5 ลูกค้าสัมพันธ์ (CRM) ---
        const CRMTab = ({ repairs, pawns, onPrintRepair }) => {
            const [searchPhone, setSearchPhone] = useState('');
            const q = searchPhone.trim().toLowerCase();
            const matchRecord = (rec) => q && [rec.phone, rec.id, rec.model, rec.imei].some(f => f && String(f).toLowerCase().includes(q));
            const customerRepairs = repairs.filter(matchRecord);
            const customerPawns = pawns.filter(matchRecord);

            return (
                <div className="space-y-6 page-fade-in">
                    <h2 className="text-2xl font-bold text-gray-800">ค้นหาประวัติลูกค้า (CRM)</h2>
                    <div className="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                        <div className="relative max-w-md mb-6">
                            <input type="text" placeholder="ค้นหาด้วย เบอร์โทร / รหัสเครื่อง / เลขเครื่อง (IMEI) / โมเดลเครื่อง..." value={searchPhone} onChange={e => setSearchPhone(e.target.value)} className="w-full pl-10 pr-4 py-3 border rounded-xl bg-gray-50 focus:bg-white transition" />
                            <i className="fas fa-search text-gray-400 absolute left-3 top-4"></i>
                        </div>

                        {searchPhone && (
                            <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                                <div className="border rounded-xl p-4 bg-gray-50">
                                    <h3 className="font-bold text-gray-800 mb-3 border-b pb-2 flex items-center">
                                        <i className="fas fa-wrench mr-2 text-gray-600"></i> ประวัติงานซ่อม
                                    </h3>
                                    <div className="space-y-2">
                                        {customerRepairs.map(r => (
                                            <div key={r.id} className="p-3 bg-white border rounded-xl shadow-sm text-sm">
                                                <div className="flex justify-between">
                                                    <span className="font-bold">{r.id} ({r.model})</span>
                                                    {r.status === 'ซ่อมเสร็จสิ้น' && 
                                                        <button onClick={() => onPrintRepair('repair', r)} className="text-blue-600 underline text-xs">
                                                            <i className="fas fa-print mr-1"></i> พิมพ์
                                                        </button>
                                                    }
                                                </div>
                                                <div className="text-gray-500">อาการ: {r.issue} | ฿{r.price}</div>
                                            </div>
                                        ))}
                                        {customerRepairs.length === 0 && <p className="text-sm text-gray-400">ไม่พบประวัติซ่อม</p>}
                                    </div>
                                </div>
                                
                                <div className="border rounded-xl p-4 bg-gray-50">
                                    <h3 className="font-bold text-gray-800 mb-3 border-b pb-2 flex items-center">
                                        <i className="fas fa-exclamation-circle mr-2 text-gray-600"></i> ประวัติจำนำ
                                    </h3>
                                    <div className="space-y-2">
                                        {customerPawns.map(p => (
                                            <div key={p.id} className="p-3 bg-white border rounded-xl shadow-sm text-sm">
                                                <div className="flex justify-between"><span className="font-bold">{p.id} ({p.model})</span><span className="text-red-500 font-bold">฿{p.principal}</span></div>
                                                <div className="text-gray-500">สถานะ: {p.status}</div>
                                            </div>
                                        ))}
                                        {customerPawns.length === 0 && <p className="text-sm text-gray-400">ไม่พบประวัติจำนำ</p>}
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        // --- 3.6 สมุดบัญชีรายรับ-รายจ่าย (Ledger) ---
        const TransactionTab = ({ transactions, setTransactions, onPrint, showToast, inventory, sales }) => {
            const now = new Date();
            const [selectedMonth, setSelectedMonth] = useState(now.getMonth());
            const [selectedYear, setSelectedYear] = useState(now.getFullYear());
            const [ledgerTab, setLedgerTab] = useState('all'); // 'all', 'sales', 'pawns' (แยกส่วนรายการจำนำและขายต่อวัน)
            
            const [editIdx, setEditIdx] = useState(null);
            const [draft, setDraft] = useState({});
            const [showAdd, setShowAdd] = useState(false);
            const blank = () => ({ date: dayKey(new Date()), type: 'รายรับ', detail: '', ref: '', amount: '', note: '', profit: '' });
            const [nr, setNr] = useState(blank());
            const inp = 'w-full border rounded-lg p-2 text-sm';
            const setDate = (ymd, base) => { const [y, m, d] = ymd.split('-').map(Number); const nd = new Date(base || new Date()); nd.setFullYear(y, m - 1, d); return nd; };

            // รหัสสินค้าของรายการ: ใช้ที่บันทึกไว้ ถ้าไม่มี (รายการเก่า) ค้นจากสต็อก/บิลขาย
            const skuOf = (r) => {
                if (r.sku) return r.sku;
                const it = (inventory || []).find(i => i.id === r.ref); if (it) return it.sku || '';
                const sl = (sales || []).find(x => x.id === r.ref);
                if (sl) { const m = (sl.items || []).find(i => r.detail && r.detail.includes(i.name)); return m ? (m.sku || '') : ''; }
                return '';
            };
            const ledger = buildLedger(transactions);
            const monthRows = ledger.filter(r => r._d.getMonth() === selectedMonth && r._d.getFullYear() === selectedYear);
            
            // กรองตามประเภท Tab เพื่อแยกรายการจำนำออกจากขายหน้าร้าน/งานซ่อม
            const filteredRows = useMemo(() => {
                if (ledgerTab === 'sales') {
                    return monthRows.filter(r => !r.detail.includes('จำนำ') && !r.detail.includes('ไถ่เครื่อง') && !r.detail.includes('ซื้อสินค้าเข้าสต็อก'));
                } else if (ledgerTab === 'pawns') {
                    return monthRows.filter(r => r.detail.includes('จำนำ') || r.detail.includes('ไถ่เครื่อง'));
                } else if (ledgerTab === 'stock') {
                    return monthRows.filter(r => r.detail.includes('ซื้อสินค้าเข้าสต็อก'));
                }
                return monthRows;
            }, [monthRows, ledgerTab]);

            const totalIncome = monthRows.reduce((s, r) => s + r.inc, 0);
            const totalExpense = monthRows.reduce((s, r) => s + r.exp, 0);
            const netProfit = totalIncome - totalExpense;
            const monthSalesProfit = monthRows.reduce((s, r) => s + (r.profit || 0), 0); // กำไรจากรายการซื้อขายสินค้า (ราคาขาย-ต้นทุน) เดือนนี้
            const todayIncome = ledger.filter(r => dayKey(r._d) === dayKey(now)).reduce((s, r) => s + r.inc, 0);

            const days = [];
            filteredRows.forEach(r => {
                const k = dayKey(r._d);
                let g = days[days.length - 1];
                if (!g || g.k !== k) { g = { k, d: r._d, items: [] }; days.push(g); }
                g.items.push(r);
            });
            days.reverse(); days.forEach(g => g.items.reverse()); // รายการล่าสุดอยู่บนสุด (วันล่าสุด -> เก่า)

            const startEdit = (r) => { setEditIdx(r._i); setDraft({ date: dayKey(r._d), detail: r.detail || '', ref: r.ref || '', income: r.inc || '', expense: r.exp || '', note: r.note || '', profit: (r.profit !== null && r.profit !== undefined) ? r.profit : '' }); };
            const saveEdit = (r) => {
                const inc = parseFloat(draft.income) || 0, exp = parseFloat(draft.expense) || 0;
                if ((inc > 0) === (exp > 0)) { showToast('กรอกยอดรายรับ หรือ รายจ่าย อย่างใดอย่างหนึ่งเท่านั้น'); return; }
                const nd = setDate(draft.date, r._d);
                setTransactions(prev => prev.map((t, i) => i === r._i ? { ...t, date: nd.toLocaleString('th-TH'), rawDate: nd.toISOString(), type: inc > 0 ? 'รายรับ' : 'รายจ่าย', amount: inc > 0 ? inc : exp, detail: draft.detail, ref: draft.ref, note: draft.note, profit: draft.profit !== '' ? (parseFloat(draft.profit) || 0) : null } : t));
                setEditIdx(null);
                showToast('บันทึกการแก้ไขแล้ว');
            };

            const removeRow = (r) => {
                if (!confirm(`ลบรายการ "${r.detail}" ?`)) return;
                setTransactions(prev => prev.filter((_, i) => i !== r._i));
                showToast('ลบรายการแล้ว');
            };

            const addRow = (e) => {
                e.preventDefault();
                const amount = parseFloat(nr.amount) || 0;
                if (amount <= 0) { showToast('กรุณากรอกจำนวนเงิน'); return; }
                const nd = setDate(nr.date);
                setTransactions(prev => [{ id: nextTs(), date: nd.toLocaleString('th-TH'), rawDate: nd.toISOString(), type: nr.type, detail: nr.detail, amount, qty: '-', ref: nr.ref, note: nr.note, profit: nr.profit !== '' ? (parseFloat(nr.profit) || 0) : null }, ...prev]);
                setNr(blank());
                setShowAdd(false);
                showToast('เพิ่มรายการเรียบร้อย');
            };

            const handlePrintSummary = () => onPrint('transaction', { monthStr: `${TH_MONTHS[selectedMonth]} ${selectedYear}`, totalIncome, totalExpense, netProfit, transactions: filteredRows.map(r => ({ ...r, _sku: skuOf(r) })), tabLabel: ({ all: 'รวมทุกรายการ', sales: 'ขายหน้าร้าน / ซ่อม', pawns: 'รับจำนำ / ไถ่ถอน', stock: 'สต็อกสินค้า' })[ledgerTab] || '' });

            const cards = [
                { label: 'วันนี้ขายได้', val: todayIncome, c: 'text-green-600', b: 'border-green-100' },
                { label: `รายรับรวมเดือน${TH_MONTHS[selectedMonth]}`, val: totalIncome, c: 'text-green-600', b: 'border-green-100' },
                { label: 'รายจ่ายรวมเดือนนี้', val: totalExpense, c: 'text-red-600', b: 'border-red-100' },
                { label: 'กำไรสุทธิเดือนนี้', val: netProfit, c: 'text-blue-600', b: 'border-blue-100' },
                { label: 'กำไรจากการขายสินค้าเดือนนี้', val: monthSalesProfit, c: 'text-purple-600', b: 'border-purple-100' },
            ];

            return (
                <div className="space-y-6 page-fade-in">
                    <div className="flex flex-wrap justify-between items-end gap-3">
                        <h2 className="text-2xl font-bold text-gray-800">สมุดบัญชีรายรับ-รายจ่าย</h2>
                        <div className="flex flex-wrap gap-2">
                            <select value={selectedMonth} onChange={e => setSelectedMonth(Number(e.target.value))} className="border p-2 rounded-xl bg-white shadow-sm font-medium">
                                {TH_MONTHS.map((m, i) => <option key={i} value={i}>{m}</option>)}
                            </select>
                            <select value={selectedYear} onChange={e => setSelectedYear(Number(e.target.value))} className="border p-2 rounded-xl bg-white shadow-sm font-medium">
                                {[...Array(5)].map((_, i) => { const y = now.getFullYear() - i; return <option key={y} value={y}>{y}</option>; })}
                            </select>
                            <button onClick={() => setShowAdd(!showAdd)} className="bg-blue-600 text-white px-4 py-2 rounded-xl font-bold text-sm hover:bg-blue-700 shadow-sm transition"><i className="fas fa-plus mr-1"></i>เพิ่มรายการ</button>
                            <button onClick={handlePrintSummary} className="bg-blue-100 text-blue-600 px-3 py-2 rounded-xl hover:bg-blue-200 shadow-sm transition" title="พิมพ์สรุปยอด"><i className="fas fa-print"></i></button>
                        </div>
                    </div>

                    <div className="grid grid-cols-2 lg:grid-cols-5 gap-4">
                        {cards.map(c => (
                            <div key={c.label} className={`bg-white p-4 rounded-2xl shadow-sm border ${c.b}`}>
                                <p className="text-xs text-gray-500 font-medium mb-1">{c.label}</p>
                                <h3 className={`text-xl font-bold ${c.c}`}>฿{c.val.toLocaleString()}</h3>
                            </div>
                        ))}
                    </div>

                    {/* ปุ่มแยกประเภทรายการบัญชี (แยกส่วนจำนำและขายต่อวัน) */}
                    <div className="flex bg-gray-200 p-1 rounded-xl w-fit">
                        <button 
                            onClick={() => setLedgerTab('all')}
                            className={`px-4 py-2 text-xs font-bold rounded-lg transition ${ledgerTab === 'all' ? 'bg-white text-blue-600 shadow-sm' : 'text-gray-600 hover:text-gray-900'}`}
                        >
                            <i className="fas fa-list mr-1.5"></i>รวมทุกรายการ
                        </button>
                        <button 
                            onClick={() => setLedgerTab('sales')}
                            className={`px-4 py-2 text-xs font-bold rounded-lg transition ${ledgerTab === 'sales' ? 'bg-white text-emerald-600 shadow-sm' : 'text-gray-600 hover:text-gray-900'}`}
                        >
                            <i className="fas fa-shopping-bag mr-1.5"></i>รายการขายหน้าร้าน / ซ่อม
                        </button>
                        <button 
                            onClick={() => setLedgerTab('pawns')}
                            className={`px-4 py-2 text-xs font-bold rounded-lg transition ${ledgerTab === 'pawns' ? 'bg-white text-purple-600 shadow-sm' : 'text-gray-600 hover:text-gray-900'}`}
                        >
                            <i className="fas fa-hand-holding-usd mr-1.5"></i>รายการรับจำนำ / ไถ่ถอน
                        </button>
                        <button 
                            onClick={() => setLedgerTab('stock')}
                            className={`px-4 py-2 text-xs font-bold rounded-lg transition ${ledgerTab === 'stock' ? 'bg-white text-amber-600 shadow-sm' : 'text-gray-600 hover:text-gray-900'}`}
                        >
                            <i className="fas fa-boxes mr-1.5"></i>รายการสต็อกสินค้า
                        </button>
                    </div>

                    {showAdd && (
                        <form onSubmit={addRow} className="bg-white p-4 rounded-2xl border border-blue-200 grid grid-cols-2 md:grid-cols-6 gap-3 items-end shadow-sm modal-enter">
                            <div><label className="text-xs text-gray-500">วันที่</label><input type="date" required value={nr.date} onChange={e => setNr({ ...nr, date: e.target.value })} className={inp} /></div>
                            <div><label className="text-xs text-gray-500">ประเภท</label><select value={nr.type} onChange={e => setNr({ ...nr, type: e.target.value })} className={inp}><option>รายรับ</option><option>รายจ่าย</option></select></div>
                            <div className="col-span-2"><label className="text-xs text-gray-500">รายการ (คำอธิบาย)</label><input required value={nr.detail} onChange={e => setNr({ ...nr, detail: e.target.value })} className={inp} /></div>
                            <div><label className="text-xs text-gray-500">เลขที่เอกสารอ้างอิง</label><input value={nr.ref} onChange={e => setNr({ ...nr, ref: e.target.value })} className={inp} /></div>
                            <div><label className="text-xs text-gray-500">จำนวนเงิน (บาท)</label><input type="number" required min="0" step="any" value={nr.amount} onChange={e => setNr({ ...nr, amount: e.target.value })} className={inp} /></div>
                            <div><label className="text-xs text-gray-500">กำไร (บาท) (ถ้ามี)</label><input type="number" step="any" placeholder="-" value={nr.profit} onChange={e => setNr({ ...nr, profit: e.target.value })} className={inp} /></div>
                            <div className="col-span-2 md:col-span-4"><label className="text-xs text-gray-500">หมายเหตุ</label><input value={nr.note} onChange={e => setNr({ ...nr, note: e.target.value })} className={inp} /></div>
                            <button type="submit" className="bg-green-600 text-white py-2.5 rounded-xl font-bold text-sm hover:bg-green-700 shadow">บันทึก</button>
                        </form>
                    )}

                    <div className="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
                        <div className="overflow-x-auto">
                            <table className="w-full text-left min-w-[960px]">
                                <thead className="bg-slate-50 text-slate-600 text-sm">
                                    <tr>
                                        <th className="p-3.5 border-b">วันที่</th><th className="p-3.5 border-b">รหัสสินค้า / เลขอ้างอิง</th><th className="p-3.5 border-b">รายการ (คำอธิบาย)</th>
                                        <th className="p-3.5 border-b text-right">รายรับ (บาท)</th><th className="p-3.5 border-b text-right">รายจ่าย (บาท)</th><th className="p-3.5 border-b text-right">กำไร (บาท)</th>
                                        <th className="p-3.5 border-b">หมายเหตุ</th><th className="p-3.5 border-b text-center">จัดการ</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {days.length === 0 && <tr><td colSpan={8} className="p-8 text-center text-gray-400">ไม่มีรายการในส่วนนี้</td></tr>}
                                    {days.map(g => {
                                        const dInc = g.items.reduce((s, r) => s + r.inc, 0), dExp = g.items.reduce((s, r) => s + r.exp, 0);
                                        const dProfit = g.items.reduce((s, r) => s + (r.profit || 0), 0);
                                        return (
                                            <React.Fragment key={g.k}>
                                                <tr className="bg-blue-100 border-t-4 border-blue-300 text-sm font-bold text-blue-900">
                                                    <td colSpan={8} className="p-3">
                                                        <i className="fas fa-calendar-day mr-2"></i>{g.d.toLocaleDateString('th-TH', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' })}
                                                        <span className="ml-3 text-xs font-medium text-blue-700">({g.items.length} รายการ)</span>
                                                    </td>
                                                </tr>
                                                {g.items.map(r => editIdx === r._i ? (

                                                        <td className="p-2"><input type="date" value={draft.date} onChange={e => setDraft({ ...draft, date: e.target.value })} className={inp} /></td>
                                                        <td className="p-2"><input value={draft.ref} onChange={e => setDraft({ ...draft, ref: e.target.value })} className={inp} /></td>
                                                        <td className="p-2"><input value={draft.detail} onChange={e => setDraft({ ...draft, detail: e.target.value })} className={inp} /></td>

                                                        <td className="p-2"><input type="number" min="0" step="any" value={draft.expense} onChange={e => setDraft({ ...draft, expense: e.target.value })} className={inp + ' text-right'} /></td>
                                                        <td className="p-2"><input type="number" step="any" placeholder="-" value={draft.profit} onChange={e => setDraft({ ...draft, profit: e.target.value })} className={inp + ' text-right'} /></td>

                                                        <td className="p-3.5 text-gray-500 whitespace-nowrap"><div className="font-bold text-gray-700">{r._d.toLocaleDateString('th-TH', { day: '2-digit', month: '2-digit', year: 'numeric' })}</div><div className="text-xs text-gray-400">{r._d.toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' })} น.</div></td>
                                                        <td className="p-3.5 whitespace-nowrap font-mono text-xs">{skuOf(r) && <div className="font-bold text-gray-800">{skuOf(r)}</div>}<div className="text-gray-400">{r.ref || (skuOf(r) ? '' : '-')}</div></td>
                                                        <td className="p-3.5 font-medium">
                                                            {r.detail}
                                                            {r.qty && r.qty !== '-' ? <span className="text-xs text-gray-400"> (x{r.qty})</span> : null}
