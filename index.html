<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GP Mobile shop - ระบบจัดการร้านมือถือ</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Babel for in-browser JSX compilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        /* สไตล์สำหรับการพิมพ์ (A4 Print) */
        @media print {
            .print\:hidden { display: none !important; }
            .print\:block { display: block !important; }
            .print\:overflow-visible { overflow: visible !important; }
            .print\:h-auto { height: auto !important; }
            .print\:bg-white { background-color: white !important; }
            body { background-color: white !important; margin: 0; padding: 0; }
            @page { size: A4; margin: 20mm; }
        }
        html, body { overflow-x: hidden; max-width: 100vw; }
    </style>
</head>
<body class="bg-slate-50 text-gray-900 font-sans">
    
    <div id="root"></div>

    <!-- React Application Code -->
    <script type="text/babel">
        const { useState, useEffect } = React;

        // URL ของ Google Apps Script (Web App) สำหรับบันทึก/ดึงข้อมูลอัตโนมัติ
        const SHEET_API_URL = "https://script.google.com/macros/s/AKfycbztVk2WQOCnl-80_XDUt0ubcPBjuFW8VXSortl3hb1zJGQbgPzuSlBkkAkryiGggJI/exec";

        // ==========================================
        // 1. UI Components (Toast)
        // ==========================================
        const Toast = ({ message, onClose }) => {
            useEffect(() => {
                if (message) {
                    const timer = setTimeout(onClose, 3000);
                    return () => clearTimeout(timer);
                }
            }, [message, onClose]);

            if (!message) return null;
            return (
                <div className="fixed bottom-4 right-4 bg-gray-800 text-white px-6 py-3 rounded-xl shadow-2xl flex items-center gap-3 z-50 animate-bounce">
                    <i className="fas fa-check-circle text-green-400 text-xl"></i>
                    <span className="font-medium">{message}</span>
                </div>
            );
        };

        // ==========================================
        // 2. หน้าต่างเข้าสู่ระบบ (LoginView)
        // ==========================================
        const LoginView = ({ onLogin }) => {
            const [username, setUsername] = useState('');
            const [password, setPassword] = useState('');
            const [error, setError] = useState('');

            const handleLoginSubmit = (e) => {
                e.preventDefault();
                if (username === 'Navapich' && password === 'Nf190448') {
                    setError('');
                    onLogin('admin');
                } else {
                    setError('ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง');
                }
            };

            return (
                <div className="min-h-screen bg-slate-100 flex items-center justify-center p-4">
                    <div className="max-w-md w-full bg-white rounded-2xl shadow-xl p-8 border border-gray-100">
                        <div className="text-center mb-8">
                            <div className="w-16 h-16 bg-blue-600 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-md">
                                <span className="text-white font-bold text-3xl leading-none">GP</span>
                            </div>
                            <h1 className="text-2xl font-bold text-gray-800">เข้าสู่ระบบ GP Mobile shop</h1>
                        </div>
                        
                        <form onSubmit={handleLoginSubmit} className="space-y-4">
                            {error && (
                                <div className="bg-red-50 text-red-500 p-3 rounded-xl text-sm font-medium text-center border border-red-200">
                                    {error}
                                </div>
                            )}
                            <div>
                                <label className="block text-xs font-semibold text-gray-600 mb-1">Username (ชื่อผู้ใช้งาน)</label>
                                <input 
                                    type="text" 
                                    required 
                                    value={username} 
                                    onChange={(e) => setUsername(e.target.value)} 
                                    placeholder="กรอก Username" 
                                    className="w-full p-3 border rounded-xl text-sm focus:outline-blue-500" 
                                />
                            </div>
                            <div>
                                <label className="block text-xs font-semibold text-gray-600 mb-1">Password (รหัสผ่าน)</label>
                                <input 
                                    type="password" 
                                    required 
                                    value={password} 
                                    onChange={(e) => setPassword(e.target.value)} 
                                    placeholder="กรอก Password" 
                                    className="w-full p-3 border rounded-xl text-sm focus:outline-blue-500" 
                                />
                            </div>
                            <button type="submit" className="w-full bg-blue-600 text-white font-bold py-3 rounded-xl hover:bg-blue-700 transition flex items-center justify-center gap-2 mt-4 shadow-lg">
                                <i className="fas fa-sign-in-alt text-xl"></i> เข้าสู่ระบบ
                            </button>
                        </form>
                    </div>
                </div>
            );
        };

        // ==========================================
        // 3. Tab Components
        // ==========================================

        // --- 3.1 แดชบอร์ด (Dashboard) ---
        const DashboardTab = ({ inventory, pawns, repairs, sales }) => {
            const currentMonth = new Date().getMonth();
            const currentYear = new Date().getFullYear();

            const totalInventoryValue = inventory.reduce((sum, item) => sum + (item.cost * item.qty), 0);
            const totalPawnValue = pawns.reduce((sum, p) => ['อยู่ในระหว่างจำนำ', 'อยู่ในระหว่างหลุดจำนำ'].includes(p.status) ? sum + p.principal : sum, 0);
            const totalRepairValue = repairs.reduce((sum, r) => sum + (r.price || 0), 0);
            
            const currentMonthSales = sales
                .filter(s => {
                    const d = s.date ? new Date(s.date) : new Date();
                    return d.getMonth() === currentMonth && d.getFullYear() === currentYear;
                })
                .reduce((sum, sale) => sum + sale.total, 0);
            
            const pendingPawns = pawns.filter(p => ['อยู่ในระหว่างจำนำ', 'อยู่ในระหว่างหลุดจำนำ'].includes(p.status)).length;
            const pendingRepairs = repairs.filter(r => r.status !== 'ซ่อมเสร็จสิ้น').length;

            // ยอดรวมสุทธิ
            const totalNetBalance = currentMonthSales + totalRepairValue + totalPawnValue + totalInventoryValue;

            return (
                <div className="space-y-6">
                    <h2 className="text-2xl font-bold text-gray-800">ภาพรวมธุรกิจ (Dashboard)</h2>
                    
                    {/* ยอดรวมสุทธิ */}
                    <div className="bg-gradient-to-r from-blue-600 to-indigo-700 text-white p-6 rounded-2xl shadow-lg flex items-center justify-between">
                        <div>
                            <p className="text-sm font-medium opacity-80 mb-1">ยอดรวมสุทธิทั้งหมด (มูลค่าธุรกิจรวม)</p>
                            <h3 className="text-3xl font-extrabold">฿{totalNetBalance.toLocaleString()}</h3>
                        </div>
                        <div className="w-14 h-14 bg-white/20 rounded-2xl flex items-center justify-center backdrop-blur-sm">
                            <i className="fas fa-coins text-3xl"></i>
                        </div>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                        <div className="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 flex items-center justify-between">
                            <div>
                                <p className="text-sm text-gray-500 font-medium mb-1">ยอดขายเดือนนี้</p>
                                <h3 className="text-2xl font-bold text-gray-800">฿{currentMonthSales.toLocaleString()}</h3>
                            </div>
                            <div className="w-12 h-12 bg-green-100 text-green-600 rounded-xl flex items-center justify-center">
                                <i className="fas fa-wallet text-2xl"></i>
                            </div>
                        </div>
                        <div className="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 flex items-center justify-between">
                            <div>
                                <p className="text-sm text-gray-500 font-medium mb-1">มูลค่ารวมงานซ่อม ({repairs.length} รายการ)</p>
                                <h3 className="text-2xl font-bold text-gray-800">฿{totalRepairValue.toLocaleString()}</h3>
                                <p className="text-xs text-orange-500 font-semibold mt-1">ค้างซ่อม: {pendingRepairs} รายการ</p>
                            </div>
                            <div className="w-12 h-12 bg-orange-100 text-orange-600 rounded-xl flex items-center justify-center">
                                <i className="fas fa-wrench text-2xl"></i>
                            </div>
                        </div>
                        <div className="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 flex items-center justify-between">
                            <div>
                                <p className="text-sm text-gray-500 font-medium mb-1">มูลค่ารับจำนำ ({pawns.length} รายการ)</p>
                                <h3 className="text-2xl font-bold text-gray-800">฿{totalPawnValue.toLocaleString()}</h3>
                                <p className="text-xs text-purple-500 font-semibold mt-1">อยู่ในจำนำ: {pendingPawns} เครื่อง</p>
                            </div>
                            <div className="w-12 h-12 bg-purple-100 text-purple-600 rounded-xl flex items-center justify-center">
                                <i className="fas fa-hand-holding-usd text-2xl"></i>
                            </div>
                        </div>
                        <div className="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 flex items-center justify-between">
                            <div>
                                <p className="text-sm text-gray-500 font-medium mb-1">มูลค่าคลังสินค้า</p>
                                <h3 className="text-2xl font-bold text-gray-800">฿{totalInventoryValue.toLocaleString()}</h3>
                            </div>
                            <div className="w-12 h-12 bg-blue-100 text-blue-600 rounded-xl flex items-center justify-center">
                                <i className="fas fa-box text-2xl"></i>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // --- 3.2 สต็อกสินค้า (Inventory) ---
        const InventoryTab = ({ inventory, setInventory, userRole, addTransaction, showToast }) => {
            const [formData, setFormData] = useState({ 
                sku: '', 
                name: '', 
                category: 'อะไหล่', 
                cost: '', 
                price: '', 
                qty: '',
                battery: '',
                capacity: '',
                color: '',
                imageUrl: ''
            });

            const isPhoneCategory = formData.category === 'เครื่องใหม่' || formData.category === 'เครื่องมือ2';
            const [edit, setEdit] = useState(null);
            const adjustQty = (id, d) => setInventory(prev => prev.map(i => i.id === id ? { ...i, qty: Math.max(0, i.qty + d) } : i));
            const saveEdit = (e) => {
                e.preventDefault();
                setInventory(prev => prev.map(i => i.id === edit.id ? { ...edit, cost: parseFloat(edit.cost) || 0, price: parseFloat(edit.price) || 0, qty: Math.max(0, parseInt(edit.qty) || 0) } : i));
                showToast(`บันทึกการแก้ไข ${edit.name} แล้ว`);
                setEdit(null);
            };
            const field = (k, label, type = 'text', req = true) => (
                <div key={k}>
                    <label className="text-xs text-gray-500">{label}</label>
                    <input required={req} type={type} value={edit[k] ?? ''} onChange={e => setEdit({ ...edit, [k]: e.target.value })} className="w-full border p-2 rounded text-sm" />
                </div>
            );

            const handleSubmit = (e) => {
                e.preventDefault();
                const cost = parseFloat(formData.cost) || 0;
                const qty = parseInt(formData.qty) || 0;
                const newItem = {
                    id: `INV${Math.floor(Math.random()*1000)}`,
                    sku: formData.sku, 
                    name: formData.name, 
                    category: formData.category,
                    cost, 
                    price: parseFloat(formData.price) || 0, 
                    qty,
                    battery: isPhoneCategory ? formData.battery : '',
                    capacity: isPhoneCategory ? formData.capacity : '',
                    color: isPhoneCategory ? formData.color : '',
                    imageUrl: isPhoneCategory ? formData.imageUrl : ''
                };
                setInventory([...inventory, newItem]);
                addTransaction('รายจ่าย', `ซื้อสินค้าเข้าสต็อก: ${newItem.name}`, cost * qty, qty);
                setFormData({ 
                    sku: '', name: '', category: 'อะไหล่', cost: '', price: '', qty: '', 
                    battery: '', capacity: '', color: '', imageUrl: '' 
                });
                showToast(`เพิ่ม ${newItem.name} ลงสต็อกแล้ว`);
            };

            return (
                <div className="space-y-6">
                    <div className="flex justify-between items-end">
                        <h2 className="text-2xl font-bold text-gray-800">จัดการสต็อกสินค้า</h2>
                    </div>

                    <div className="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                        <form onSubmit={handleSubmit} className="space-y-4">
                            <div className="grid grid-cols-1 md:grid-cols-6 gap-4">
                                <div><label className="text-xs text-gray-500">รหัส SKU</label><input required value={formData.sku} onChange={e => setFormData({...formData, sku: e.target.value})} className="w-full border p-2 rounded text-sm" placeholder="SKU-001" /></div>
                                <div><label className="text-xs text-gray-500">ชื่อสินค้า</label><input required value={formData.name} onChange={e => setFormData({...formData, name: e.target.value})} className="w-full border p-2 rounded text-sm" placeholder="เช่น iPhone 13" /></div>
                                <div>
                                    <label className="text-xs text-gray-500">หมวดหมู่</label>
                                    <select value={formData.category} onChange={e => setFormData({...formData, category: e.target.value})} className="w-full border p-2 rounded text-sm">
                                        <option value="อะไหล่">อะไหล่</option>
                                        <option value="อุปกรณ์เสริม">อุปกรณ์เสริม</option>
                                        <option value="เครื่องใหม่">เครื่องใหม่</option>
                                        <option value="เครื่องมือ2">เครื่องมือ2</option>
                                    </select>
                                </div>
                                {userRole === 'admin' && <div><label className="text-xs text-gray-500">ต้นทุน (฿)</label><input required type="number" value={formData.cost} onChange={e => setFormData({...formData, cost: e.target.value})} className="w-full border p-2 rounded text-sm" placeholder="0" /></div>}
                                <div><label className="text-xs text-gray-500">ราคาขาย (฿)</label><input required type="number" value={formData.price} onChange={e => setFormData({...formData, price: e.target.value})} className="w-full border p-2 rounded text-sm" placeholder="0" /></div>
                                <div><label className="text-xs text-gray-500">จำนวน</label><input required type="number" value={formData.qty} onChange={e => setFormData({...formData, qty: e.target.value})} className="w-full border p-2 rounded text-sm" placeholder="0" /></div>
                            </div>

                            {/* รายละเอียดเพิ่มเติมเฉพาะ เครื่องใหม่ และ เครื่องมือ2 */}
                            {isPhoneCategory && (
                                <div className="p-4 bg-blue-50/50 rounded-xl border border-blue-100 space-y-3">
                                    <div className="text-xs font-bold text-blue-700">รายละเอียดเฉพาะตัวเครื่อง ({formData.category})</div>
                                    <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
                                        <div><label className="text-xs text-gray-500">% แบตเตอรี่</label><input value={formData.battery} onChange={e => setFormData({...formData, battery: e.target.value})} className="w-full border p-2 rounded text-sm bg-white" placeholder="เช่น 95%" /></div>
                                        <div><label className="text-xs text-gray-500">ความจุเครื่อง</label><input value={formData.capacity} onChange={e => setFormData({...formData, capacity: e.target.value})} className="w-full border p-2 rounded text-sm bg-white" placeholder="เช่น 128GB" /></div>
                                        <div><label className="text-xs text-gray-500">สีของตัวเครื่อง</label><input value={formData.color} onChange={e => setFormData({...formData, color: e.target.value})} className="w-full border p-2 rounded text-sm bg-white" placeholder="เช่น Midnight" /></div>
                                        <div><label className="text-xs text-gray-500">URL รูปภาพ</label><input value={formData.imageUrl} onChange={e => setFormData({...formData, imageUrl: e.target.value})} className="w-full border p-2 rounded text-sm bg-white" placeholder="https://..." /></div>
                                    </div>
                                </div>
                            )}

                            <button type="submit" className="w-full bg-blue-600 text-white font-bold py-2 px-4 rounded hover:bg-blue-700 shadow">เพิ่มสินค้าใหม่</button>
                        </form>
                    </div>

                    <div className="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
                        <div className="overflow-x-auto">
                        <table className="w-full text-left">
                            <thead className="bg-slate-50 text-slate-600 text-sm">
                                <tr>
                                    <th className="p-4 border-b">รูปภาพ</th>
                                    <th className="p-4 border-b">รหัส / SKU</th>
                                    <th className="p-4 border-b">ชื่อสินค้า</th>
                                    <th className="p-4 border-b">หมวดหมู่</th>
                                    <th className="p-4 border-b">สเปค / รายละเอียด</th>
                                    <th className="p-4 border-b">คงเหลือ</th>
                                    {userRole === 'admin' && <th className="p-4 border-b">ต้นทุน</th>}
                                    <th className="p-4 border-b">ราคาขาย</th>
                                    <th className="p-4 border-b">จัดการ</th>
                                </tr>
                            </thead>
                            <tbody>
                                {inventory.length === 0 ? <tr><td colSpan={9} className="p-8 text-center text-gray-400">ยังไม่มีสินค้าในสต็อก</td></tr> : inventory.map(item => (
                                    <tr key={item.id} className="border-b hover:bg-gray-50 text-sm">
                                        <td className="p-4">
                                            {item.imageUrl ? (
                                                <img src={item.imageUrl} alt={item.name} className="w-12 h-12 object-cover rounded-lg border" />
                                            ) : (
                                                <div className="w-12 h-12 bg-gray-100 rounded-lg flex items-center justify-center text-gray-400"><i className="fas fa-image"></i></div>
                                            )}
                                        </td>
                                        <td className="p-4 font-mono">{item.sku}</td>
                                        <td className="p-4 font-medium">{item.name}</td>
                                        <td className="p-4">
                                            <span className={`px-2 py-1 rounded text-xs font-semibold ${item.category === 'เครื่องมือ2' ? 'bg-orange-100 text-orange-700' : 'bg-gray-100 text-gray-700'}`}>
                                                {item.category}
                                            </span>
                                        </td>
                                        <td className="p-4 text-xs text-gray-600">
                                            {(item.capacity || item.color || item.battery) ? (
                                                <div>
                                                    {item.capacity && <span className="mr-2">💾 {item.capacity}</span>}
                                                    {item.color && <span className="mr-2">🎨 {item.color}</span>}
                                                    {item.battery && <span>🔋 {item.battery}</span>}
                                                </div>
                                            ) : '-'}
                                        </td>
                                        <td className="p-4">
                                            <div className="flex items-center gap-2">
                                                <button onClick={() => adjustQty(item.id, -1)} className="w-7 h-7 rounded bg-gray-100 hover:bg-gray-200 font-bold">−</button>
                                                <span className={`font-bold w-8 text-center ${item.qty < 5 ? 'text-red-500' : 'text-green-600'}`}>{item.qty}</span>
                                                <button onClick={() => adjustQty(item.id, 1)} className="w-7 h-7 rounded bg-gray-100 hover:bg-gray-200 font-bold">+</button>
                                            </div>
                                        </td>
                                        {userRole === 'admin' && <td className="p-4 text-gray-500">฿{item.cost.toLocaleString()}</td>}
                                        <td className="p-4 font-bold">฿{item.price.toLocaleString()}</td>
                                        <td className="p-4"><button onClick={() => setEdit({ ...item })} className="text-xs bg-blue-100 text-blue-700 px-3 py-1 rounded hover:bg-blue-200 font-bold"><i className="fas fa-pen mr-1"></i>แก้ไข</button></td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                        </div>
                    </div>
                {edit && (
                        <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4" onClick={() => setEdit(null)}>
                            <form onSubmit={saveEdit} onClick={e => e.stopPropagation()} className="bg-white rounded-xl p-6 w-full max-w-lg max-h-[90vh] overflow-auto space-y-4">
                                <h3 className="text-lg font-bold text-gray-800">แก้ไขสินค้า</h3>
                                <div className="grid grid-cols-2 gap-3">
                                    {field('sku', 'รหัส SKU')}
                                    {field('name', 'ชื่อสินค้า')}
                                    <div>
                                        <label className="text-xs text-gray-500">หมวดหมู่</label>
                                        <select value={edit.category} onChange={e => setEdit({ ...edit, category: e.target.value })} className="w-full border p-2 rounded text-sm">
                                            {['อะไหล่', 'อุปกรณ์เสริม', 'เครื่องใหม่', 'เครื่องมือ2'].map(c => <option key={c} value={c}>{c}</option>)}
                                        </select>
                                    </div>
                                    {field('qty', 'จำนวน', 'number')}
                                    {userRole === 'admin' && field('cost', 'ต้นทุน (฿)', 'number')}
                                    {field('price', 'ราคาขาย (฿)', 'number')}
                                    {(edit.category === 'เครื่องใหม่' || edit.category === 'เครื่องมือ2') && (<>
                                        {field('battery', '% แบตเตอรี่', 'text', false)}
                                        {field('capacity', 'ความจุเครื่อง', 'text', false)}
                                        {field('color', 'สีของตัวเครื่อง', 'text', false)}
                                        {field('imageUrl', 'URL รูปภาพ', 'text', false)}
                                    </>)}
                                </div>
                                <div className="flex gap-3">
                                    <button type="button" onClick={() => setEdit(null)} className="flex-1 border py-2 rounded font-bold text-gray-600 hover:bg-gray-50">ยกเลิก</button>
                                    <button type="submit" className="flex-1 bg-blue-600 text-white py-2 rounded font-bold hover:bg-blue-700">บันทึก</button>
                                </div>
                            </form>
                        </div>
                    )}
                </div>
            );
        };

        // --- 3.3 งานซ่อม (Repair) ---
        const RepairTab = ({ repairs, setRepairs, inventory, setInventory, addTransaction, showToast, onPrint }) => {
            const [formData, setFormData] = useState({ name: '', phone: '', model: '', issue: '', partId: '', price: '' });

            const handleSubmit = (e) => {
                e.preventDefault();
                const part = inventory.find(i => i.id === formData.partId);
                const newRepair = {
                    id: `REP${Math.floor(Math.random()*10000)}`,
                    date: new Date().toLocaleDateString('th-TH'),
                    ...formData,
                    partName: part ? part.name : 'ไม่ได้ใช้อะไหล่/ลูกค้านำมาเอง',
                    cost: part ? part.cost : 0,
                    price: parseFloat(formData.price),
                    status: 'รอคิวซ่อม'
                };
                setRepairs([...repairs, newRepair]);
                setFormData({ name: '', phone: '', model: '', issue: '', partId: '', price: '' });
                showToast(`รับงานซ่อม ${newRepair.id} สำเร็จ`);
            };

            const handleUpdateStatus = (id, currentStatus, partId) => {
                if (currentStatus !== 'ซ่อมเสร็จสิ้น') {
                    const repair = repairs.find(r => r.id === id);
                    const part = inventory.find(i => i.id === partId);
                    if (part) {
                        if (part.qty <= 0) { alert('อะไหล่ชิ้นนี้หมดสต็อก ไม่สามารถตัดสต็อกได้!'); return; }
                        setInventory(inventory.map(i => i.id === partId ? { ...i, qty: i.qty - 1 } : i));
                    }
                    setRepairs(repairs.map(r => r.id === id ? { ...r, status: 'ซ่อมเสร็จสิ้น' } : r));
                    addTransaction('รายรับ', `งานซ่อมบิล ${id} (${repair.model})`, repair.price, 1);
                    showToast(`อัปเดตสถานะและตัดสต็อกอะไหล่เรียบร้อย`);
                }
            };

            return (
                <div className="space-y-6">
                    <h2 className="text-2xl font-bold text-gray-800">จัดการงานซ่อม</h2>
                    <div className="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                        <form onSubmit={handleSubmit} className="grid grid-cols-1 md:grid-cols-6 gap-4">
                            <div><label className="text-xs text-gray-500">ชื่อลูกค้า</label><input required value={formData.name} onChange={e => setFormData({...formData, name: e.target.value})} className="w-full border p-2 rounded text-sm" /></div>
                            <div><label className="text-xs text-gray-500">เบอร์โทร</label><input required value={formData.phone} onChange={e => setFormData({...formData, phone: e.target.value})} className="w-full border p-2 rounded text-sm" /></div>
                            <div><label className="text-xs text-gray-500">รุ่นเครื่อง</label><input required value={formData.model} onChange={e => setFormData({...formData, model: e.target.value})} className="w-full border p-2 rounded text-sm" /></div>
                            <div><label className="text-xs text-gray-500">อาการเสีย</label><input required value={formData.issue} onChange={e => setFormData({...formData, issue: e.target.value})} className="w-full border p-2 rounded text-sm" /></div>
                            <div>
                                <label className="text-xs text-gray-500">เลือกอะไหล่ (ถ้ามี)</label>
                                <select value={formData.partId} onChange={e => setFormData({...formData, partId: e.target.value})} className="w-full border p-2 rounded text-sm bg-white">
                                    <option value="">-- ไม่ใช้อะไหล่ --</option>
                                    {inventory.map(i => <option key={i.id} value={i.id} disabled={i.qty<=0}>{i.name} (เหลือ {i.qty})</option>)}
                                </select>
                            </div>
                            <div><label className="text-xs text-gray-500">ราคาประเมิน (฿)</label><input required type="number" value={formData.price} onChange={e => setFormData({...formData, price: e.target.value})} className="w-full border p-2 rounded text-sm" /></div>
                            <button type="submit" className="bg-orange-500 text-white font-bold py-2 px-4 rounded md:col-span-6 hover:bg-orange-600">รับงานซ่อม</button>
                        </form>
                    </div>

                    <div className="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
                        <div className="overflow-x-auto">
                        <table className="w-full text-left">
                            <thead className="bg-slate-50 text-slate-600 text-sm">
                                <tr><th className="p-4 border-b">เลขที่บิล</th><th className="p-4 border-b">ลูกค้า</th><th className="p-4 border-b">ข้อมูลเครื่อง/อาการ</th><th className="p-4 border-b">ราคา</th><th className="p-4 border-b">สถานะ</th><th className="p-4 border-b text-center">จัดการ</th></tr>
                            </thead>
                            <tbody>
                                {repairs.length === 0 ? <tr><td colSpan={6} className="p-8 text-center text-gray-400">ยังไม่มีงานซ่อม</td></tr> : repairs.map(r => (
                                    <tr key={r.id} className="hover:bg-gray-50 border-b text-sm">
                                        <td className="p-4"><div className="font-mono font-bold text-orange-600">{r.id}</div><div className="text-xs text-gray-400">{r.date}</div></td>
                                        <td className="p-4"><div className="font-medium">{r.name}</div><div className="text-xs text-gray-500">{r.phone}</div></td>
                                        <td className="p-4"><div className="font-medium">{r.model} - {r.issue}</div><div className="text-xs text-blue-500">อะไหล่: {r.partName}</div></td>
                                        <td className="p-4 font-bold text-gray-700">฿{r.price?.toLocaleString()}</td>
                                        <td className="p-4"><span className={`px-2 py-1 rounded-md text-xs font-bold ${r.status === 'ซ่อมเสร็จสิ้น' ? 'bg-green-100 text-green-700' : 'bg-yellow-100 text-yellow-700'}`}>{r.status}</span></td>
                                        <td className="p-4 text-center">
                                            {r.status !== 'ซ่อมเสร็จสิ้น' ? (
                                                <button onClick={() => handleUpdateStatus(r.id, r.status, r.partId)} className="bg-green-500 text-white px-3 py-1 rounded text-xs font-bold hover:bg-green-600">กดจบงาน/ตัดสต็อก</button>
                                            ) : (
                                                <div className="flex flex-col gap-2 items-center">
                                                    <button onClick={() => onPrint('repair', r)} className="text-xs bg-blue-100 text-blue-700 px-2 py-1 rounded hover:bg-blue-200 font-bold flex items-center">
                                                        <i className="fas fa-print mr-1"></i> พิมพ์ A4
                                                    </button>
                                                </div>
                                            )}
                                        </td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                        </div>
                    </div>
                </div>
            );
        };

        // --- 3.4 รับจำนำ (Pawn) ---
        const PawnTab = ({ pawns, setPawns, showToast, addTransaction }) => {
            const [formData, setFormData] = useState({ name: '', phone: '', idCard: '', model: '', imei: '', principal: '', startDate: '', dueDate: '' });

            const handleSubmit = (e) => {
                e.preventDefault();
                const principal = parseFloat(formData.principal);
                const newPawn = {
                    id: `PWN${Math.floor(Math.random()*10000)}`,
                    ...formData,
                    principal,
                    interest: principal * 0.10,
                    status: 'อยู่ในระหว่างจำนำ'
                };
                setPawns([...pawns, newPawn]);
                addTransaction('รายจ่าย', `ปล่อยเงินรับจำนำ: ${newPawn.model}`, principal, 1);
                setFormData({ name: '', phone: '', idCard: '', model: '', imei: '', principal: '', startDate: '', dueDate: '' });
                showToast(`รับจำนำสำเร็จ (ดอกเบี้ย 10%)`);
            };

            const handleUpdateStatus = (id, newStatus) => {
                const p = pawns.find(x => x.id === id);
                setPawns(pawns.map(pwn => pwn.id === id ? { ...pwn, status: newStatus } : pwn));
                if (newStatus === 'ไถ่เครื่องออก') {
                    addTransaction('รายรับ', `ลูกค้าไถ่เครื่องจำนำ: ${p.model}`, p.principal + p.interest, 1);
                } else if (newStatus === 'ออกก่อนกำหนด') {
                    addTransaction('รายรับ', `ออกก่อนกำหนด: ${p.model}`, p.principal, 1);
                }
                showToast(`อัปเดตสถานะเป็น ${newStatus}`);
            };

            return (
                <div className="space-y-6">
                    <h2 className="text-2xl font-bold text-gray-800">ระบบรับจำนำ</h2>
                    <div className="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                        <form onSubmit={handleSubmit} className="grid grid-cols-1 md:grid-cols-4 gap-4">
                            <div><label className="text-xs text-gray-500">ชื่อลูกค้า</label><input required value={formData.name} onChange={e => setFormData({...formData, name: e.target.value})} className="w-full border p-2 rounded text-sm" /></div>
                            <div><label className="text-xs text-gray-500">เบอร์โทร</label><input required value={formData.phone} onChange={e => setFormData({...formData, phone: e.target.value})} className="w-full border p-2 rounded text-sm" /></div>
                            <div><label className="text-xs text-gray-500">รุ่นเครื่อง</label><input required value={formData.model} onChange={e => setFormData({...formData, model: e.target.value})} className="w-full border p-2 rounded text-sm" /></div>
                            <div><label className="text-xs text-gray-500">ยอดเงิน (฿)</label><input required type="number" value={formData.principal} onChange={e => setFormData({...formData, principal: e.target.value})} className="w-full border p-2 rounded text-sm" /></div>
                            <div><label className="text-xs text-gray-500">วันที่รับจำนำ</label><input required type="date" value={formData.startDate} onChange={e => setFormData({...formData, startDate: e.target.value})} className="w-full border p-2 rounded text-sm" /></div>
                            <div><label className="text-xs text-gray-500">วันที่ครบกำหนด</label><input required type="date" value={formData.dueDate} onChange={e => setFormData({...formData, dueDate: e.target.value})} className="w-full border p-2 rounded text-sm" /></div>
                            <button type="submit" className="bg-purple-600 text-white font-bold py-2 px-4 rounded md:col-span-4 hover:bg-purple-700">บันทึกรับจำนำ</button>
                        </form>
                    </div>

                    <div className="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
                        <div className="overflow-x-auto">
                        <table className="w-full text-left">
                            <thead className="bg-slate-50 text-slate-600 text-sm">
                                <tr>
                                    <th className="p-4 border-b">เลขที่</th>
                                    <th className="p-4 border-b">ลูกค้า</th>
                                    <th className="p-4 border-b text-right">ยอดจำนำ</th>
                                    <th className="p-4 border-b text-center">ครบกำหนด</th>
                                    <th className="p-4 border-b text-center">สถานะ</th>
                                    <th className="p-4 border-b text-center">จัดการ</th>
                                </tr>
                            </thead>
                            <tbody>
                                {pawns.length === 0 ? <tr><td colSpan={6} className="p-8 text-center text-gray-400">ยังไม่มีรายการรับจำนำ</td></tr> : pawns.map(p => {
                                    const today = new Date(); today.setHours(0,0,0,0);
                                    const isOverdue = new Date(p.dueDate) < today;
                                    const displayStatus = (p.status === 'อยู่ในระหว่างจำนำ' && isOverdue) ? 'อยู่ในระหว่างหลุดจำนำ' : p.status;
                                    
                                    return (
                                    <tr key={p.id} className="hover:bg-gray-50 border-b text-sm">
                                        <td className="p-4 font-mono font-bold text-purple-600">{p.id}</td>
                                        <td className="p-4"><div className="font-medium">{p.name}</div><div className="text-xs text-gray-500">{p.phone}</div></td>
                                        <td className="p-4 text-right font-bold text-gray-700">฿{p.principal.toLocaleString()}</td>
                                        <td className="p-4 text-center text-red-500">{p.dueDate}</td>
                                        <td className="p-4 text-center">
                                            <span className={`px-2 py-1 rounded-md text-xs font-bold ${displayStatus.includes('หลุด') ? 'bg-red-100 text-red-700' : displayStatus === 'อยู่ในระหว่างจำนำ' ? 'bg-yellow-100 text-yellow-700' : 'bg-gray-100 text-gray-700'}`}>
                                                {displayStatus}
                                            </span>
                                        </td>
                                        <td className="p-4 text-center">
                                            <select className="border rounded text-xs p-1 bg-white cursor-pointer" value={p.status} onChange={(e) => handleUpdateStatus(p.id, e.target.value)}>
                                                <option value="อยู่ในระหว่างจำนำ">อยู่ในระหว่างจำนำ</option>
                                                <option value="ไถ่เครื่องออก">ไถ่เครื่องออก</option>
                                                <option value="ออกก่อนกำหนด">ออกก่อนกำหนด</option>
                                                <option value="หลุดจำนำ">หลุดจำนำ (ยึดเครื่อง)</option>
                                            </select>
                                        </td>
                                    </tr>
                                )})}
                            </tbody>
                        </table>
                        </div>
                    </div>
                </div>
            );
        };

        // --- 3.5 ลูกค้าสัมพันธ์ (CRM) ---
        const CRMTab = ({ repairs, pawns, onPrintRepair }) => {
            const [searchPhone, setSearchPhone] = useState('');
            const customerRepairs = repairs.filter(r => searchPhone && r.phone.includes(searchPhone));
            const customerPawns = pawns.filter(p => searchPhone && p.phone.includes(searchPhone));

            return (
                <div className="space-y-6">
                    <h2 className="text-2xl font-bold text-gray-800">ค้นหาประวัติลูกค้า (CRM)</h2>
                    <div className="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                        <div className="relative max-w-md mb-6">
                            <input type="text" placeholder="พิมพ์เบอร์โทรศัพท์..." value={searchPhone} onChange={e => setSearchPhone(e.target.value)} className="w-full pl-10 pr-4 py-3 border rounded-xl bg-gray-50 focus:bg-white transition" />
                            <i className="fas fa-search text-gray-400 absolute left-3 top-4"></i>
                        </div>

                        {searchPhone && (
                            <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                                <div className="border rounded-xl p-4 bg-gray-50">
                                    <h3 className="font-bold text-gray-800 mb-3 border-b pb-2 flex items-center">
                                        <i className="fas fa-wrench mr-2 text-gray-600"></i> ประวัติงานซ่อม
                                    </h3>
                                    <div className="space-y-2">
                                        {customerRepairs.map(r => (
                                            <div key={r.id} className="p-3 bg-white border rounded shadow-sm text-sm">
                                                <div className="flex justify-between">
                                                    <span className="font-bold">{r.id} ({r.model})</span>
                                                    {r.status === 'ซ่อมเสร็จสิ้น' && 
                                                        <button onClick={() => onPrintRepair('repair', r)} className="text-blue-600 underline text-xs">
                                                            <i className="fas fa-print mr-1"></i> พิมพ์
                                                        </button>
                                                    }
                                                </div>
                                                <div className="text-gray-500">อาการ: {r.issue} | ฿{r.price}</div>
                                            </div>
                                        ))}
                                        {customerRepairs.length === 0 && <p className="text-sm text-gray-400">ไม่พบประวัติซ่อม</p>}
                                    </div>
                                </div>
                                
                                <div className="border rounded-xl p-4 bg-gray-50">
                                    <h3 className="font-bold text-gray-800 mb-3 border-b pb-2 flex items-center">
                                        <i className="fas fa-exclamation-circle mr-2 text-gray-600"></i> ประวัติจำนำ
                                    </h3>
                                    <div className="space-y-2">
                                        {customerPawns.map(p => (
                                            <div key={p.id} className="p-3 bg-white border rounded shadow-sm text-sm">
                                                <div className="flex justify-between"><span className="font-bold">{p.id} ({p.model})</span><span className="text-red-500 font-bold">฿{p.principal}</span></div>
                                                <div className="text-gray-500">สถานะ: {p.status}</div>
                                            </div>
                                        ))}
                                        {customerPawns.length === 0 && <p className="text-sm text-gray-400">ไม่พบประวัติจำนำ</p>}
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        // --- 3.6 บัญชีรายรับ-รายจ่าย (Transactions) ---
        const TransactionTab = ({ transactions, onPrint }) => {
            const [selectedMonth, setSelectedMonth] = useState(new Date().getMonth());
            const [selectedYear, setSelectedYear] = useState(new Date().getFullYear());

            const months = ['มกราคม', 'กุมภาพันธ์', 'มีนาคม', 'เมษายน', 'พฤษภาคม', 'มิถุนายน', 'กรกฎาคม', 'สิงหาคม', 'กันยายน', 'ตุลาคม', 'พฤศจิกายน', 'ธันวาคม'];

            const filteredTransactions = transactions.filter(t => {
                if (!t.rawDate) return true;
                const d = new Date(t.rawDate);
                return d.getMonth() === selectedMonth && d.getFullYear() === selectedYear;
            });

            const totalIncome = filteredTransactions.filter(t => t.type === 'รายรับ').reduce((sum, t) => sum + (t.amount || 0), 0);
            const totalExpense = filteredTransactions.filter(t => t.type === 'รายจ่าย').reduce((sum, t) => sum + (t.amount || 0), 0);
            const netProfit = totalIncome - totalExpense;

            const handlePrintSummary = () => {
                onPrint('transaction', {
                    monthStr: `${months[selectedMonth]} ${selectedYear}`,
                    totalIncome,
                    totalExpense,
                    netProfit,
                    transactions: filteredTransactions
                });
            };

            return (
                <div className="space-y-6">
                    <div className="flex justify-between items-end">
                        <h2 className="text-2xl font-bold text-gray-800">บัญชีรายรับ-รายจ่าย (ตัดรอบเดือน)</h2>
                        <div className="flex gap-2">
                            <select value={selectedMonth} onChange={e => setSelectedMonth(Number(e.target.value))} className="border p-2 rounded-lg bg-white shadow-sm font-medium">
                                {months.map((m, i) => <option key={i} value={i}>{m}</option>)}
                            </select>
                            <select value={selectedYear} onChange={e => setSelectedYear(Number(e.target.value))} className="border p-2 rounded-lg bg-white shadow-sm font-medium">
                                {[...Array(5)].map((_, i) => {
                                    const y = new Date().getFullYear() - i;
                                    return <option key={y} value={y}>{y}</option>;
                                })}
                            </select>
                        </div>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div className="bg-white p-6 rounded-xl shadow-sm border border-green-100 flex items-center justify-between">
                            <div><p className="text-sm text-gray-500 font-medium mb-1">รายรับรวม</p><h3 className="text-2xl font-bold text-green-600">฿{totalIncome.toLocaleString()}</h3></div>
                        </div>
                        <div className="bg-white p-6 rounded-xl shadow-sm border border-red-100 flex items-center justify-between">
                            <div><p className="text-sm text-gray-500 font-medium mb-1">รายจ่ายรวม</p><h3 className="text-2xl font-bold text-red-600">฿{totalExpense.toLocaleString()}</h3></div>
                        </div>
                        <div className="bg-white p-6 rounded-xl shadow-sm border border-blue-100 flex items-center justify-between">
                            <div><p className="text-sm text-gray-500 font-medium mb-1">ยอดสุทธิ (กำไร)</p><h3 className="text-2xl font-bold text-blue-600">฿{netProfit.toLocaleString()}</h3></div>
                            <button onClick={handlePrintSummary} className="bg-blue-100 text-blue-600 p-3 rounded-xl hover:bg-blue-200 transition" title="พิมพ์สรุปยอด">
                                <i className="fas fa-print text-2xl"></i>
                            </button>
                        </div>
                    </div>

                    <div className="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
                        <div className="overflow-x-auto">
                        <table className="w-full text-left">
                            <thead className="bg-slate-50 text-slate-600 text-sm">
                                <tr><th className="p-4 border-b">วันที่/เวลา</th><th className="p-4 border-b">ประเภท</th><th className="p-4 border-b">รายละเอียด</th><th className="p-4 border-b text-center">จำนวน</th><th className="p-4 border-b text-right">ยอดเงิน (฿)</th></tr>
                            </thead>
                            <tbody>
                                {filteredTransactions.length === 0 ? <tr><td colSpan={5} className="p-8 text-center text-gray-400">ไม่มีรายการในรอบเดือนนี้</td></tr> : filteredTransactions.map(t => (
                                    <tr key={t.id} className="border-b hover:bg-gray-50 text-sm">
                                        <td className="p-4 text-gray-500">{t.date}</td>
                                        <td className="p-4"><span className={`px-2 py-1 rounded text-xs font-bold ${t.type === 'รายรับ' ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'}`}>{t.type}</span></td>
                                        <td className="p-4 font-medium">{t.detail}</td><td className="p-4 text-center">{t.qty}</td>
                                        <td className={`p-4 text-right font-bold ${t.type === 'รายรับ' ? 'text-green-600' : 'text-red-600'}`}>฿{(t.amount || 0).toLocaleString()}</td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                        </div>
                    </div>
                </div>
            );
        };

        // --- 3.7 ขายหน้าร้าน (POS) ---
        const POSTab = ({ inventory, setInventory, addTransaction, addSale, showToast, onPrint }) => {
            const [cat, setCat] = useState('อะไหล่');
            const cats = [
                { key: 'อะไหล่', icon: 'fa-microchip', match: c => c === 'อะไหล่' },
                { key: 'อุปกรณ์เสริม', icon: 'fa-headphones', match: c => c === 'อุปกรณ์เสริม' },
                { key: 'เครื่อง', icon: 'fa-mobile-alt', match: c => c === 'เครื่องใหม่' || c === 'เครื่องมือ2' }
            ];
            const shown = inventory.filter(i => cats.find(c => c.key === cat).match(i.category));
            const [cart, setCart] = useState([]);
            const addToCart = (item) => {
                if (item.qty <= 0) { alert('สินค้าหมด'); return; }
                const existing = cart.find(c => c.id === item.id);
                if (existing) {
                    if (existing.qty >= item.qty) { alert('จำนวนสินค้าในสต็อกไม่พอ'); return; }
                    setCart(cart.map(c => c.id === item.id ? { ...c, qty: c.qty + 1 } : c));
                } else {
                    setCart([...cart, { ...item, qty: 1 }]);
                }
            };

            const checkout = () => {
                if (cart.length === 0) return;
                const total = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
                cart.forEach(cartItem => {
                    setInventory(prev => prev.map(i => i.id === cartItem.id ? { ...i, qty: i.qty - cartItem.qty } : i));
                    addTransaction('รายรับ', `ขายสินค้า (POS): ${cartItem.name}`, cartItem.price * cartItem.qty, cartItem.qty);
                });
                const sale = { id: `INV-${Date.now()}`, date: new Date().toISOString(), total, items: cart };
                addSale(sale);
                onPrint('sale', sale);
                setCart([]);
                showToast(`รับชำระเงิน ฿${total.toLocaleString()} สำเร็จ!`);
            };

            return (
                <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                    <div className="lg:col-span-2 space-y-4">
                        <h2 className="text-2xl font-bold text-gray-800">ขายหน้าร้าน (POS)</h2>
                        <div className="flex flex-wrap gap-2">
                            {cats.map(c => (
                                <button key={c.key} onClick={() => setCat(c.key)} className={`px-4 py-2 rounded-lg font-bold text-sm border transition ${cat === c.key ? 'bg-blue-600 text-white border-blue-600' : 'bg-white text-gray-600 hover:bg-blue-50'}`}>
                                    <i className={`fas ${c.icon} mr-2`}></i>{c.key} ({inventory.filter(i => c.match(i.category)).length})
                                </button>
                            ))}
                        </div>
                        <div className="grid grid-cols-2 md:grid-cols-3 gap-4">
                            {shown.length === 0 && <p className="col-span-full text-center text-gray-400 py-10">ไม่มีสินค้าในหมวดนี้</p>}
                            {shown.map(item => (
                                <div key={item.id} onClick={() => addToCart(item)} className={`bg-white p-4 rounded-xl border cursor-pointer hover:shadow-md transition ${item.qty <= 0 ? 'opacity-50' : 'border-blue-100 hover:border-blue-500'}`}>
                                    <div className="font-bold text-gray-800 line-clamp-2 h-10">{item.name}</div>
                                    <div className="text-sm text-gray-500 mt-2">คงเหลือ: {item.qty}</div>
                                    <div className="text-lg font-bold text-blue-600 mt-1">฿{item.price.toLocaleString()}</div>
                                </div>
                            ))}
                        </div>
                    </div>
                    <div className="bg-white rounded-xl shadow-sm border border-gray-100 flex flex-col h-[calc(100vh-120px)]">
                        <div className="p-4 border-b bg-slate-50 font-bold text-lg text-gray-800">ตะกร้าสินค้า</div>
                        <div className="flex-1 p-4 overflow-auto space-y-3">
                            {cart.length === 0 ? <p className="text-center text-gray-400 mt-10">ยังไม่มีสินค้าในตะกร้า</p> : cart.map(item => (
                                <div key={item.id} className="flex justify-between items-center bg-gray-50 p-3 rounded border text-sm">
                                    <div className="font-medium truncate w-32">{item.name}</div>
                                    <div className="text-gray-500">x{item.qty}</div>
                                    <div className="font-bold text-gray-800">฿{(item.price * item.qty).toLocaleString()}</div>
                                </div>
                            ))}
                        </div>
                        <div className="p-4 border-t bg-slate-50">
                            <div className="flex justify-between text-xl font-bold mb-4"><span>รวมทั้งหมด</span><span className="text-blue-600">฿{cart.reduce((sum, item) => sum + (item.price * item.qty), 0).toLocaleString()}</span></div>
                            <button onClick={checkout} disabled={cart.length === 0} className="w-full bg-blue-600 text-white font-bold py-4 rounded-xl hover:bg-blue-700 disabled:bg-gray-300 transition text-lg shadow-lg">รับเงิน (Checkout)</button>
                        </div>
                    </div>
                </div>
            );
        };

        // ==========================================
        // 4. Main Application
        // ==========================================
        function App() {
            const [authState, setAuthState] = useState('login'); 
            const [userRole, setUserRole] = useState('');
            const [activeTab, setActiveTab] = useState('dashboard');
            const [sidebarOpen, setSidebarOpen] = useState(false);
            const [toastMessage, setToastMessage] = useState('');
            
            // State ควบคุมการพิมพ์ทั้งหมด
            const [printConfig, setPrintConfig] = useState(null);

            const [inventory, setInventory] = useState([]);
            const [transactions, setTransactions] = useState([]);
            const [repairs, setRepairs] = useState([]);
            const [pawns, setPawns] = useState([]);
            const [sales, setSales] = useState([]);

            const [isSyncing, setIsSyncing] = useState(false);
            const [dataLoaded, setDataLoaded] = useState(false);

            // ฟังก์ชันส่งข้อมูลขึ้น Google Sheets
            const handleSyncToSheet = async () => {
                setIsSyncing(true);
                try {
                    const dbData = { inventory, transactions, repairs, pawns, sales };
                    await fetch(SHEET_API_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify(dbData)
                    });
                    showToast('สำรองข้อมูลขึ้น Google Sheets สำเร็จ!');
                } catch (error) {
                    console.error(error);
                    showToast('เกิดข้อผิดพลาดในการสำรองข้อมูล');
                }
                setIsSyncing(false);
            };

            // ฟังก์ชันดึงข้อมูลจาก Google Sheets
            const handleSyncFromSheet = async () => {
                setIsSyncing(true);
                try {
                    const response = await fetch(SHEET_API_URL);
                    const data = await response.json();
                    if (data && data.inventory) {
                        setInventory(data.inventory || []);
                        setTransactions(data.transactions || []);
                        setRepairs(data.repairs || []);
                        setPawns(data.pawns || []);
                        setSales(data.sales || []);
                        showToast('ดึงข้อมูลจาก Google Sheets สำเร็จ!');
                    } else {
                        showToast('ไม่พบข้อมูล หรือข้อมูลว่างเปล่า');
                    }
                } catch (error) {
                    console.error(error);
                    showToast('เกิดข้อผิดพลาดในการดึงข้อมูล');
                }
                setIsSyncing(false);
                setDataLoaded(true);
            };

            // ดึงข้อมูลจาก Google Sheets อัตโนมัติทันทีที่เปิดแอป (ครั้งเดียวตอนโหลด)
            useEffect(() => {
                handleSyncFromSheet();
            }, []);

            // บันทึกข้อมูลขึ้น Google Sheets อัตโนมัติทุกครั้งที่ข้อมูลเปลี่ยนแปลง (ดีเลย์เล็กน้อยกันยิงถี่เกินไป)
            useEffect(() => {
                if (!dataLoaded) return;
                const t = setTimeout(() => { handleSyncToSheet(); }, 1500);
                return () => clearTimeout(t);
            }, [inventory, transactions, repairs, pawns, sales]);

            // แก้ปัญหาการพิมพ์ - เมื่อปิดหน้าต่างพิมพ์ ให้ล้างค่าอัตโนมัติ
            useEffect(() => {
                const handleAfterPrint = () => setPrintConfig(null);
                window.addEventListener('afterprint', handleAfterPrint);
                return () => window.removeEventListener('afterprint', handleAfterPrint);
            }, []);

            const showToast = (msg) => setToastMessage(msg);
            
            // ระบบบันทึกรายรับ-รายจ่ายกลาง
            const addTransaction = (type, detail, amount = 0, qty = '-') => {
                setTransactions(prev => [{ 
                    id: Date.now(), 
                    date: new Date().toLocaleString('th-TH'), 
                    rawDate: new Date().toISOString(),
                    type, 
                    detail, 
                    amount,
                    qty 
                }, ...prev]);
            };

            const handlePrint = (type, data) => {
                setPrintConfig({ type, data });
                setTimeout(() => window.print(), 300);
            };

            if (authState === 'login') return <LoginView onLogin={(role) => { setUserRole(role); setAuthState('authenticated'); setActiveTab('dashboard'); }} />;

            const menuItems = [
                { id: 'dashboard', label: 'แดชบอร์ดสรุป', icon: 'fas fa-chart-bar', role: 'all' },
                { id: 'pos', label: 'ขายหน้าร้าน POS', icon: 'fas fa-wallet', role: 'all' },
                { id: 'inventory', label: 'สต็อกและอะไหล่', icon: 'fas fa-box', role: 'all' },
                { id: 'repair', label: 'ระบบงานซ่อม', icon: 'fas fa-wrench', role: 'all' },
                { id: 'pawn', label: 'ระบบรับจำนำ', icon: 'fas fa-exclamation-circle', role: 'all' },
                { id: 'crm', label: 'ประวัติลูกค้า', icon: 'fas fa-users', role: 'all' },
                { id: 'transactions', label: 'บัญชีรายรับ-รายจ่าย', icon: 'fas fa-history', role: 'admin' },
            ];
            const visibleMenus = menuItems.filter(m => m.role === 'all' || m.role === userRole);

            return (
                <div className="flex h-screen bg-slate-50 overflow-hidden print:overflow-visible print:h-auto print:bg-white">
                    
                    {/* ส่วนสำหรับการสั่งพิมพ์ (Print Template A4) */}
                    {printConfig && (
                        <div className="hidden print:block absolute top-0 left-0 w-full bg-white text-black p-8 z-50 min-h-screen">
                            
                            {/* พิมพ์ใบบิลงานซ่อม */}
                            {printConfig.type === 'repair' && (
                                <div className="max-w-3xl mx-auto border p-8 rounded-xl shadow-none">
                                    <div className="text-center border-b pb-4 mb-6">
                                        <h1 className="text-3xl font-bold">ใบเสร็จรับเงิน / ใบส่งมอบงานซ่อม</h1>
                                        <h2 className="text-xl font-bold mt-2">GP Mobile shop PRO</h2>
                                        <p className="text-gray-600 mt-1">เบอร์โทร: 093-014-5788 | Line: @372ipazw</p>
                                    </div>
                                    
                                    <div className="flex justify-between mb-8">
                                        <div>
                                            <p className="mb-1"><strong>ชื่อลูกค้า:</strong> {printConfig.data.name}</p>
                                            <p className="mb-1"><strong>เบอร์โทร:</strong> {printConfig.data.phone}</p>
                                            <p><strong>วันที่ทำรายการ:</strong> {printConfig.data.date}</p>
                                        </div>
                                        <div className="text-right">
                                            <p className="text-lg"><strong>เลขที่บิล:</strong> {printConfig.data.id}</p>
                                        </div>
                                    </div>

                                    <table className="w-full text-left border-collapse mb-8">
                                        <thead>
                                            <tr className="border-b-2 border-black"><th className="py-2">รายการ</th><th className="py-2">รุ่นเครื่อง</th><th className="py-2 text-right">ราคา (บาท)</th></tr>
                                        </thead>
                                        <tbody>
                                            <tr className="border-b">
                                                <td className="py-4">
                                                    ซ่อมมือถือ - อาการ: {printConfig.data.issue}
                                                    <br/><span className="text-sm text-gray-500">อะไหล่ที่ใช้: {printConfig.data.partName}</span>
                                                </td>
                                                <td className="py-4">{printConfig.data.model}</td><td className="py-4 text-right font-bold">฿{printConfig.data.price.toLocaleString()}</td>
                                            </tr>
                                        </tbody>
                                    </table>

                                    <div className="flex justify-between items-end mt-32">
                                        <div className="text-center w-48 border-t border-black pt-2"><p className="text-sm">ผู้รับเงิน / ผู้ส่งมอบงาน</p></div>
                                        <div className="text-center w-48 border-t border-black pt-2"><p className="text-sm">ลูกค้าผู้รับมอบเครื่อง</p></div>
                                    </div>
                                </div>
                            )}

                            {/* พิมพ์ใบเสร็จขายหน้าร้าน (POS) */}
                            {printConfig.type === 'sale' && (
                                <div className="max-w-3xl mx-auto p-8">
                                    <div className="text-center border-b pb-4 mb-6">
                                        <h1 className="text-3xl font-bold">ใบเสร็จรับเงิน</h1>
                                        <h2 className="text-xl font-bold mt-2">GP Mobile shop</h2>
                                        <p className="text-gray-600 mt-1">เบอร์โทร: 093-014-5788 | Line: @372ipazw</p>
                                    </div>
                                    <div className="flex justify-between mb-6">
                                        <p><strong>วันที่:</strong> {new Date(printConfig.data.date).toLocaleString('th-TH')}</p>
                                        <p><strong>เลขที่บิล:</strong> {printConfig.data.id}</p>
                                    </div>
                                    <table className="w-full text-left border-collapse mb-6">
                                        <thead>
                                            <tr className="border-b-2 border-black"><th className="py-2">#</th><th className="py-2">รายการ</th><th className="py-2 text-right">จำนวน</th><th className="py-2 text-right">ราคา/หน่วย</th><th className="py-2 text-right">รวม (บาท)</th></tr>
                                        </thead>
                                        <tbody>
                                            {printConfig.data.items.map((it, i) => (
                                                <tr key={it.id} className="border-b">
                                                    <td className="py-3">{i + 1}</td>
                                                    <td className="py-3">{it.name}<div className="text-xs text-gray-500">{it.sku}</div></td>
                                                    <td className="py-3 text-right">{it.qty}</td>
                                                    <td className="py-3 text-right">฿{it.price.toLocaleString()}</td>
                                                    <td className="py-3 text-right font-bold">฿{(it.price * it.qty).toLocaleString()}</td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                    <div className="flex justify-end text-2xl font-bold mb-24"><span className="mr-8">รวมทั้งสิ้น</span><span>฿{printConfig.data.total.toLocaleString()}</span></div>
                                    <div className="flex justify-between">
                                        <div className="text-center w-48 border-t border-black pt-2 text-sm">ผู้รับเงิน</div>
                                        <div className="text-center w-48 border-t border-black pt-2 text-sm">ลูกค้า</div>
                                    </div>
                                </div>
                            )}

                            {/* พิมพ์สรุปรายรับ-รายจ่าย */}
                            {printConfig.type === 'transaction' && (
                                <div className="max-w-4xl mx-auto p-8 shadow-none">
                                    <div className="text-center border-b pb-4 mb-6">
                                        <h1 className="text-3xl font-bold">รายงานสรุปบัญชีรายรับ-รายจ่าย</h1>
                                        <h2 className="text-xl font-bold mt-2">GP Mobile shop</h2>
                                        <p className="text-gray-600 mt-1">ประจำรอบเดือน: {printConfig.data.monthStr}</p>
                                    </div>

                                    <div className="grid grid-cols-3 gap-4 mb-8 text-center">
                                        <div className="border p-4 rounded-xl"><p className="text-gray-500">รายรับรวม</p><h3 className="text-2xl font-bold text-green-600">฿{printConfig.data.totalIncome.toLocaleString()}</h3></div>
                                        <div className="border p-4 rounded-xl"><p className="text-gray-500">รายจ่ายรวม</p><h3 className="text-2xl font-bold text-red-600">฿{printConfig.data.totalExpense.toLocaleString()}</h3></div>
                                        <div className="border p-4 rounded-xl"><p className="text-gray-500">ยอดสุทธิ (กำไร)</p><h3 className="text-2xl font-bold text-blue-600">฿{printConfig.data.netProfit.toLocaleString()}</h3></div>
                                    </div>

                                    <table className="w-full text-left border-collapse">
                                        <thead>
                                            <tr className="border-b-2 border-black">
                                                <th className="py-2">วันที่/เวลา</th><th className="py-2">ประเภท</th><th className="py-2">รายละเอียด</th><th className="py-2 text-right">ยอดเงิน (บาท)</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {printConfig.data.transactions.map((t, i) => (
                                                <tr key={i} className="border-b">
                                                    <td className="py-3 text-sm">{t.date}</td>
                                                    <td className="py-3 text-sm">{t.type}</td>
                                                    <td className="py-3 text-sm">{t.detail}</td>
                                                    <td className="py-3 text-sm text-right font-bold">฿{(t.amount || 0).toLocaleString()}</td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            )}

                        </div>
                    )}

                    {/* Main App */}
                    <div className="print:hidden flex w-full h-full">
                        <Toast message={toastMessage} onClose={() => setToastMessage('')} />

                        {/* พื้นหลังคลิกปิดเมนู (เฉพาะมือถือ) */}
                        {sidebarOpen && <div className="fixed inset-0 bg-black/50 z-20 md:hidden" onClick={() => setSidebarOpen(false)}></div>}

                        {/* Sidebar */}
                        <aside className={`fixed md:static inset-y-0 left-0 w-64 bg-slate-900 text-white flex flex-col shadow-xl z-30 shrink-0 transform transition-transform duration-300 ${sidebarOpen ? 'translate-x-0' : '-translate-x-full'} md:translate-x-0`}>
                            <div className="h-16 flex items-center px-6 border-b border-slate-800 bg-slate-950">
                                <div className="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center mr-3 font-bold">GP</div>
                                <span className="font-bold text-lg">GP Mobile shop</span>
                            </div>
                            <nav className="flex-1 p-4 space-y-2 overflow-y-auto">
                                {visibleMenus.map(menu => (
                                    <button key={menu.id} onClick={() => { setActiveTab(menu.id); setSidebarOpen(false); }} className={`w-full flex items-center px-4 py-3 rounded-xl transition ${activeTab === menu.id ? 'bg-blue-600 text-white font-bold shadow-md' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}`}>
                                        <i className={`${menu.icon} text-xl w-6 text-center mr-2`}></i> {menu.label}
                                    </button>
                                ))}
                            </nav>
                            <div className="p-4 border-t border-slate-800 bg-slate-950">
                                <div className="flex items-center text-sm mb-4 px-2 text-slate-300">
                                    <div className="w-8 h-8 bg-slate-800 rounded-full flex items-center justify-center mr-3"><i className="fas fa-user"></i></div>
                                    <div><p className="font-bold capitalize text-white">{userRole}</p><p className="text-xs opacity-70">ออนไลน์</p></div>
                                </div>
                                <button onClick={() => {setAuthState('login'); setUserRole('');}} className="w-full flex items-center px-4 py-2 text-red-400 hover:bg-red-500/10 rounded-lg transition text-sm font-medium">
                                    <i className="fas fa-sign-out-alt mr-2"></i> ออกจากระบบ
                                </button>
                            </div>
                        </aside>

                        {/* Main Content */}
                        <main className="flex-1 flex flex-col min-w-0 w-full">
                            <div className="md:hidden flex items-center h-14 px-4 bg-white border-b shadow-sm shrink-0">
                                <button onClick={() => setSidebarOpen(true)} className="text-gray-700 w-8 h-8 flex items-center justify-center -ml-1">
                                    <i className="fas fa-bars text-xl"></i>
                                </button>
                                <span className="font-bold text-gray-800 ml-2">{menuItems.find(m => m.id === activeTab)?.label || 'GP Mobile shop'}</span>
                            </div>
                            <div className="flex-1 overflow-auto p-4 sm:p-6 lg:p-8">
                                <div className="max-w-7xl mx-auto h-full pb-20">
                                    {activeTab === 'dashboard' && <DashboardTab inventory={inventory} pawns={pawns} repairs={repairs} sales={sales} />}
                                    {activeTab === 'inventory' && <InventoryTab inventory={inventory} setInventory={setInventory} userRole={userRole} addTransaction={addTransaction} showToast={showToast} />}
                                    {activeTab === 'repair' && <RepairTab repairs={repairs} setRepairs={setRepairs} inventory={inventory} setInventory={setInventory} addTransaction={addTransaction} showToast={showToast} onPrint={handlePrint} />}
                                    {activeTab === 'pawn' && <PawnTab pawns={pawns} setPawns={setPawns} showToast={showToast} addTransaction={addTransaction} />}
                                    {activeTab === 'crm' && <CRMTab repairs={repairs} pawns={pawns} onPrintRepair={handlePrint} />}
                                    {activeTab === 'transactions' && <TransactionTab transactions={transactions} onPrint={handlePrint} />}
                                    {activeTab === 'pos' && <POSTab inventory={inventory} setInventory={setInventory} addTransaction={addTransaction} addSale={s => setSales([...sales, s])} showToast={showToast} onPrint={handlePrint} />}
                                </div>
                            </div>
                        </main>
                    </div>
                </div>
            );
        }

        // Render React Application
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
