    <script>
        // iOS Safari ไม่ยอมทำตาม user-scalable=no จึงต้องดักท่าทางถ่างนิ้ว (pinch) เพิ่มอีกชั้น
        ['gesturestart', 'gesturechange', 'gestureend'].forEach(function (ev) {
            document.addEventListener(ev, function (e) { e.preventDefault(); }, { passive: false });
        });
        document.addEventListener('touchmove', function (e) {
            if ((e.touches && e.touches.length > 1) || (e.scale && e.scale !== 1)) e.preventDefault();
        }, { passive: false });
    </script>

    <style>
        /* สไตล์สำหรับการพิมพ์ (A4 Print) */
        @media print {
            .print\:hidden { display: none !important; }
            .print\:block { display: block !important; }
            .print\:overflow-visible { overflow: visible !important; }
            .print\:h-auto { height: auto !important; }
            .print\:bg-white { background-color: white !important; }
            body { background-color: white !important; margin: 0; padding: 0; }
            @page { size: A4; margin: 20mm; }
            @page ledger { size: A4 landscape; margin: 10mm 12mm; }
            .ledger-print { page: ledger; font-size: 11px; color: #000; }
            .ledger-print table { width: 100%; border-collapse: collapse; }
            .ledger-print th, .ledger-print td { border: 1px solid #333; padding: 3px 6px; vertical-align: top; }
            .ledger-print thead { display: table-header-group; }
            .ledger-print tr { page-break-inside: avoid; break-inside: avoid; }
            .ledger-print .num { text-align: right; white-space: nowrap; }
        }
        html, body { overflow-x: hidden; max-width: 100vw; font-family: 'Inter', system-ui, -apple-system, sans-serif; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }

        /* ล็อกขนาดหน้าจอบนมือถือ/แท็บเล็ต: ห้ามซูมด้วยการถ่างนิ้ว / แตะสองครั้ง (ยังเลื่อนหน้าขึ้นลง-ซ้ายขวาได้ปกติ) */
        *, *::before, *::after { touch-action: pan-x pan-y; }
        /* กัน iOS ซูมเองตอนแตะช่องกรอกข้อมูล (iOS จะซูมถ้าตัวอักษรในช่องเล็กกว่า 16px) - ใช้เฉพาะหน้าจอสัมผัส */
        @media (pointer: coarse) {
            input, select, textarea { font-size: 16px !important; }
        }

        /* Animation เคลื่อนไหวในการเปลี่ยนหน้า */
        .page-fade-in {
            animation: fadeInSlide 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fadeInSlide {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: none; /* ห้ามค้าง translate/scale ไว้ ไม่งั้นป๊อปอัป (fixed) จะไม่อยู่กลางหน้าจอ */
            }
        }

        /* Modal scale transition */
        .modal-enter {
            animation: modalScale 0.25s ease-out forwards;
        }

        @keyframes modalScale {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: none;
            }
        }

        /* อนิเมชั่นหน้าเข้าสู่ระบบ (Intro หลังล็อกอิน) */
        .gp-intro { position: fixed; inset: 0; z-index: 9999; overflow: hidden; display: flex; align-items: center; justify-content: center;
            background: radial-gradient(120% 90% at 50% 40%, #1e3a8a 0%, #0f172a 55%, #05070f 100%); color: #fff;
            animation: gpIntroOut 0.5s ease-in 4.1s forwards; }
        .gp-intro-rays { position: absolute; left: -50%; top: -50%; width: 200%; height: 200%;
            background: repeating-conic-gradient(from 0deg, rgba(147,197,253,.18) 0deg 4deg, transparent 4deg 15deg);
            -webkit-mask-image: radial-gradient(closest-side, #000 15%, transparent 100%); mask-image: radial-gradient(closest-side, #000 15%, transparent 100%);
            animation: gpIntroSpin 20s linear infinite, gpIntroFade 1.2s ease 0.1s both; }
        .gp-intro-flash { position: absolute; inset: 0; pointer-events: none; opacity: 0;
            background: radial-gradient(circle at 50% 42%, #ffffff 0%, rgba(191,219,254,.9) 30%, transparent 68%);
            animation: gpIntroFlash 1.1s ease-out 0.25s forwards; }
        .gp-intro-shard { position: absolute; left: var(--x); top: var(--y); width: var(--s); height: calc(var(--s) * 1.6); opacity: 0;
            clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
            background: linear-gradient(160deg, rgba(255,255,255,.9), rgba(96,165,250,.45) 45%, rgba(244,114,182,.35));
            animation: gpIntroShard 4.2s ease-in-out var(--d) infinite alternate both; }
        .gp-intro-content { position: relative; display: flex; flex-direction: column; align-items: center; padding: 0 24px; text-align: center; }
        .gp-intro-card { width: min(78vw, 300px); padding: 22px; border-radius: 28px; background: rgba(255,255,255,.93); opacity: 0;
            box-shadow: 0 0 0 1px rgba(255,255,255,.7), 0 0 60px rgba(96,165,250,.6), 0 24px 50px rgba(0,0,0,.45);
            animation: gpIntroLogo 1.1s cubic-bezier(.16,1,.3,1) 0.35s forwards; }
        .gp-intro-card img { display: block; width: 100%; height: auto; object-fit: contain; }
        .gp-intro-title { margin-top: 26px; font-size: clamp(1.6rem, 7vw, 3rem); font-weight: 800; letter-spacing: .04em; white-space: nowrap;
            text-shadow: 0 0 18px rgba(96,165,250,.9), 0 2px 6px rgba(0,0,0,.4); }
        .gp-intro-letter { display: inline-block; opacity: 0; transform: translateY(24px) scale(.6); filter: blur(6px);
            animation: gpIntroLetter .45s cubic-bezier(.2,.8,.2,1) forwards; }
        .gp-intro-sub { margin-top: 10px; font-size: .95rem; color: #bfdbfe; letter-spacing: .02em; opacity: 0;
            animation: gpIntroUp .8s ease 2.1s forwards; }
        .gp-intro-bar-wrap { position: absolute; left: 50%; bottom: 12%; transform: translateX(-50%); width: min(70vw, 260px); height: 4px;
            border-radius: 999px; background: rgba(255,255,255,.18); overflow: hidden; }
        .gp-intro-bar { height: 100%; width: 0; border-radius: 999px; background: linear-gradient(90deg, #60a5fa, #f472b6, #34d399);
            animation: gpIntroBar 4.1s linear forwards; }
        .gp-intro-skip { position: absolute; top: 16px; right: 16px; padding: 8px 14px; border-radius: 999px; cursor: pointer;

        // ===== หมวดหมู่สินค้า + รูปภาพสินค้า =====
        // ค่า value ใช้ค่าเดิมทั้งหมด เพื่อให้ข้อมูลเก่าใน Google Sheets ยังใช้ได้ ('เครื่องใหม่' = "เครื่องมือ1")
        const INV_CATEGORIES = [
            { value: 'เครื่องใหม่', label: 'เครื่องมือ1', full: 'เครื่องมือ1 (เครื่องใหม่)', icon: 'fa-mobile-screen', badge: 'bg-green-100 text-green-700' },
            { value: 'เครื่องมือ2', label: 'เครื่องมือ2', full: 'เครื่องมือ2 (มือสอง)', icon: 'fa-mobile-alt', badge: 'bg-orange-100 text-orange-700' },
            { value: 'อะไหล่', label: 'อะไหล่', full: 'อะไหล่', icon: 'fa-microchip', badge: 'bg-slate-100 text-slate-700' },
            { value: 'อุปกรณ์เสริม', label: 'อุปกรณ์เสริม', full: 'อุปกรณ์เสริม', icon: 'fa-headphones', badge: 'bg-purple-100 text-purple-700' },
        ];
        const catInfo = (v) => INV_CATEGORIES.find(c => c.value === v) || { value: v, label: v, full: v, icon: 'fa-box', badge: 'bg-gray-100 text-gray-700' };

        // รูปสินค้า: เก็บเป็นข้อความเดียวคั่นด้วย | ในช่อง images (และเก็บรูปแรกไว้ที่ imageUrl เหมือนเดิม เพื่อให้ข้อมูลเก่าใช้ได้)
        const MIN_IMAGE_SLOTS = 4;
        const MAX_IMAGE_SLOTS = 8;
        const getItemImages = (item) => {
            if (!item) return [];
            let list = [];
            if (Array.isArray(item.images)) list = item.images;
            else if (typeof item.images === 'string' && item.images.trim()) list = item.images.split('|');
            list = list.map(s => String(s).trim()).filter(Boolean);
            if (list.length === 0 && item.imageUrl) list = [String(item.imageUrl).trim()];
            return list.filter(Boolean);
        };
        const padImages = (list) => { const a = [...list]; while (a.length < MIN_IMAGE_SLOTS) a.push(''); return a; };
        const packImages = (list) => {
            const clean = list.map(s => (s || '').trim()).filter(s => s && !s.startsWith('data:')); // ไม่เก็บรูปแบบฝังไฟล์ลงข้อมูล
            // imageUrl เก็บเฉพาะรูปที่เป็นลิงก์ (ไม่เก็บรูปไฟล์ซ้ำ เพื่อประหยัดพื้นที่) - ใช้ images เป็นหลัก
            return { images: clean.join('|'), imageUrl: clean.find(s => !s.startsWith('data:')) || '' };
        };

        // รูปที่โหลดไม่ได้ / ยังไม่มีรูป จะแสดงไอคอนแทน
        // รูปจาก Google Drive: ลองลิงก์หลายรูปแบบตามลำดับ (Google จำกัดการโหลดบางรูปแบบเป็นช่วงๆ) ถ้าไม่ได้จริงแสดงไอคอน แตะเพื่อลองใหม่
        const driveId = (u) => { u = String(u || ''); if (u.startsWith('data:')) return ''; const m = /(?:[?&]id=|\/d\/)([\w-]{20,})/.exec(u); return m ? m[1] : ''; };
        const imgCandidates = (u) => { const id = driveId(u); return id ? [`https://lh3.googleusercontent.com/d/${id}=w1000`, `https://drive.google.com/thumbnail?id=${id}&sz=w1000`, u] : [u]; };
        const SafeImg = ({ src, alt, className }) => {
            const [n, setN] = useState(0);
            const [tries, setTries] = useState(0);
            const list = useMemo(() => imgCandidates(src), [src]);
            useEffect(() => { setN(0); setTries(0); }, [src]);
            if (!src || n >= list.length) {
                return <div onClick={src ? (e) => { e.stopPropagation(); setN(0); setTries(t => t + 1); } : undefined} title={src ? 'โหลดรูปไม่ได้ - แตะเพื่อลองใหม่' : ''} className={`${className} bg-gray-100 flex items-center justify-center text-gray-300 ${src ? 'cursor-pointer' : ''}`}><i className={src ? 'fas fa-rotate-right' : 'fas fa-image'}></i></div>;
            }
            return <img key={`${n}-${tries}`} src={list[n]} alt={alt || ''} loading="lazy" referrerPolicy="no-referrer" onError={() => setN(k => k + 1)} className={className} />;
        };

        // ===== อัปโหลดรูปจากเครื่อง / ถ่ายรูป ขึ้น Google Drive =====
        // รูปจะถูกย่อ (ด้านยาวสุด 1000px) แล้วส่งขึ้นโฟลเดอร์ GP_Images ใน Google Drive ผ่าน Apps Script (คำสั่ง uploadImage)
        // ในข้อมูลสินค้าเก็บเฉพาะ "ลิงก์รูป" จึงไม่กินพื้นที่ในชีต
        const isDataUrl = (s) => typeof s === 'string' && s.startsWith('data:');

        const loadImageFromFile = (file) => new Promise((resolve, reject) => {
            const url = URL.createObjectURL(file);
            const img = new Image();
            img.onload = () => { URL.revokeObjectURL(url); resolve(img); };
            img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('อ่านไฟล์รูปไม่ได้ (รองรับ JPG / PNG / WebP)')); };
            img.src = url;
        });
        // ย่อรูปแล้วแปลงเป็น JPEG (data URL)
        const resizeToDataUrl = async (file, maxSide = 1000, quality = 0.82) => {
            const img = await loadImageFromFile(file);
            const w0 = img.naturalWidth || img.width, h0 = img.naturalHeight || img.height;
            const scale = Math.min(1, maxSide / Math.max(w0, h0));
            const w = Math.max(1, Math.round(w0 * scale)), h = Math.max(1, Math.round(h0 * scale));
            const canvas = document.createElement('canvas');
            canvas.width = w; canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, w, h); // พื้นขาวสำหรับรูป PNG โปร่งใส
            ctx.drawImage(img, 0, 0, w, h);
            return canvas.toDataURL('image/jpeg', quality);
        };
        // ส่งรูปขึ้น Google Drive แล้วได้ลิงก์กลับมา
        const uploadToDrive = async (dataUrl, name) => {
            const m = /^data:([^;]+);base64,(.*)$/.exec(dataUrl);
            if (!m) throw new Error('ข้อมูลรูปไม่ถูกต้อง');
            const response = await fetch(SHEET_API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ action: 'uploadImage', data: m[2], mime: m[1], name })
            });
            const result = await response.json();
            if (!result.success) throw new Error(result.message || 'อัปโหลดรูปไม่สำเร็จ');
            return result.url;
        };

        // ช่องรูปสินค้า (ขั้นต่ำ 4 ช่อง เพิ่มได้ถึง 8): เลือกไฟล์ / ถ่ายรูป / วางลิงก์ก็ได้
        const ImageUrlsEditor = ({ urls, onChange, onBusyChange }) => {
            const list = padImages(urls);
            const listRef = useRef(list); listRef.current = list;
            const onChangeRef = useRef(onChange); onChangeRef.current = onChange;
            const fileRef = useRef(null);
            const camRef = useRef(null);
            const [busy, setBusy] = useState(false);
            const [progress, setProgress] = useState('');
            const [msg, setMsg] = useState('');
            const canCapture = typeof window !== 'undefined' && !!window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
            const setAt = (i, v) => { const a = [...list]; a[i] = v; onChange(a); };
            const filled = list.filter(s => s.trim()).length;
            const startBusy = () => { setBusy(true); setMsg(''); if (onBusyChange) onBusyChange(true); };
            const endBusy = () => { setBusy(false); setProgress(''); if (onBusyChange) onBusyChange(false); };
            const putUrl = (url, preferIndex) => {
                const next = [...listRef.current];
                let i = (preferIndex !== undefined && preferIndex < next.length) ? preferIndex : next.findIndex(s => !s.trim());
                if (i === -1) { if (next.length < MAX_IMAGE_SLOTS) { next.push(url); } else return false; }
                else next[i] = url;
                listRef.current = next;
                onChangeRef.current(next);
                return true;
            };

            const handleFiles = async (fileList) => {
                let files = Array.from(fileList || []).filter(f => (f.type || '').startsWith('image/') || /\.(jpe?g|png|webp|gif|heic|heif)$/i.test(f.name || ''));
                if (files.length === 0) return;
                const cur = listRef.current;
                const free = cur.filter(s => !s.trim()).length + (MAX_IMAGE_SLOTS - cur.length);
                const skipped = Math.max(0, files.length - free);
                files = files.slice(0, free);
                if (files.length === 0) { setMsg(`ช่องรูปเต็ม ${MAX_IMAGE_SLOTS} รูปแล้ว ลบรูปเดิมก่อนเพิ่มใหม่`); return; }
                startBusy();
                let failed = 0, lastErr = '';
                for (let k = 0; k < files.length; k++) {
                    setProgress(`กำลังอัปโหลดรูป ${k + 1}/${files.length}...`);
                    try {
                        const dataUrl = await resizeToDataUrl(files[k]);
                        const url = await uploadToDrive(dataUrl, `gp_${Date.now()}_${k}.jpg`);
                        putUrl(url);
                    } catch (err) {
                        failed++; lastErr = (err && err.message) ? err.message : 'ไม่ทราบสาเหตุ';
                    }
                }
                const notes = [];
                if (failed) notes.push(`⚠️ อัปโหลดไม่สำเร็จ ${failed} รูป (${lastErr}) - ตรวจอินเทอร์เน็ต และว่า Apps Script ถูก Deploy เวอร์ชันล่าสุดแล้ว`);
                if (skipped) notes.push(`ช่องรูปเต็ม ข้ามไป ${skipped} รูป`);
                setMsg(notes.join(' · '));
                endBusy();
            };
            const onPick = (e) => { const fl = Array.from(e.target.files || []); e.target.value = ''; handleFiles(fl); };

            // รูปค้างแบบฝังไฟล์ (จากเวอร์ชันก่อนหน้า) - อัปโหลดขึ้น Drive ทีละช่อง
            const uploadLegacy = async (i) => {
                startBusy(); setProgress('กำลังอัปโหลดรูป...');
                try {
                    const url = await uploadToDrive(listRef.current[i], `gp_${Date.now()}_${i}.jpg`);
                    putUrl(url, i);
                } catch (err) { setMsg('⚠️ ' + ((err && err.message) || 'อัปโหลดไม่สำเร็จ')); }
                endBusy();
            };

            return (
                <div className="p-4 bg-slate-50 rounded-xl border border-slate-200 space-y-3">
                    <div className="flex justify-between items-center gap-2">
                        <div className="text-xs font-bold text-slate-700"><i className="fas fa-images mr-1.5"></i>รูปสินค้า (อย่างน้อย {MIN_IMAGE_SLOTS} รูป)</div>
                        <div className={`text-xs font-bold ${filled >= MIN_IMAGE_SLOTS ? 'text-green-600' : 'text-gray-400'}`}>ใส่แล้ว {filled}/{MIN_IMAGE_SLOTS}</div>
                    </div>

                    <div className="flex flex-wrap gap-2">
                        <button type="button" disabled={busy} onClick={() => fileRef.current && fileRef.current.click()} className="px-3 py-2 rounded-lg bg-blue-600 text-white text-sm font-bold hover:bg-blue-700 disabled:opacity-50">
                            <i className="fas fa-folder-open mr-1.5"></i>เลือกรูปจากเครื่อง
                        </button>
                        {canCapture && (
                            <button type="button" disabled={busy} onClick={() => camRef.current && camRef.current.click()} className="px-3 py-2 rounded-lg bg-emerald-600 text-white text-sm font-bold hover:bg-emerald-700 disabled:opacity-50">
                                <i className="fas fa-camera mr-1.5"></i>ถ่ายรูป
                            </button>
                        )}
                        {busy && <span className="text-sm text-gray-500 self-center"><i className="fas fa-spinner fa-spin mr-1.5"></i>{progress || 'กำลังทำงาน...'}</span>}
                        <input ref={fileRef} type="file" accept="image/*" multiple className="hidden" onChange={onPick} />
                        <input ref={camRef} type="file" accept="image/*" capture="environment" className="hidden" onChange={onPick} />
                    </div>
                    <div className="text-[11px] text-gray-400">เลือกได้หลายรูปพร้อมกัน รูปจะถูกย่อและอัปโหลดขึ้น Google Drive อัตโนมัติ (รอสักครู่ต่อรูป) หรือจะวางลิงก์รูป (https://...) ในช่องด้านล่างก็ได้</div>
                    {msg && <div className="text-xs text-red-500 font-medium">{msg}</div>}

                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        {list.map((u, i) => (
                            <div key={i} className="flex items-center gap-2">
                                <SafeImg src={u.trim()} className="w-12 h-12 shrink-0 object-cover rounded-lg border bg-white" />
                                <div className="flex-1 min-w-0">
                                    <label className="text-xs text-gray-500">{i === 0 ? 'รูปที่ 1 (รูปหลัก)' : `รูปที่ ${i + 1}`}</label>
                                    {isDataUrl(u) ? (
                                        <button type="button" disabled={busy} onClick={() => uploadLegacy(i)} className="w-full border border-amber-300 p-2 rounded-lg text-sm bg-amber-50 text-amber-700 text-left truncate disabled:opacity-50"><i className="fas fa-cloud-arrow-up mr-1.5"></i>ยังไม่ได้อัปโหลด - กดเพื่ออัปโหลด</button>
                                    ) : (
                                        <input value={u} onChange={e => setAt(i, e.target.value)} className="w-full border p-2 rounded-lg text-sm bg-white" placeholder="วางลิงก์ https://..." />
                                    )}
                                </div>
                                {u.trim() && (
                                    <button type="button" onClick={() => setAt(i, '')} className="shrink-0 w-8 h-8 mt-4 rounded-lg text-red-400 hover:bg-red-50" title="ลบรูปนี้"><i className="fas fa-trash text-sm"></i></button>
                                )}
                            </div>
                        ))}
                    </div>
                    {list.length < MAX_IMAGE_SLOTS && (
                        <button type="button" onClick={() => onChange([...list, ''])} className="text-xs font-bold text-blue-600 hover:text-blue-800"><i className="fas fa-plus mr-1"></i>เพิ่มช่องรูป</button>
                    )}
                </div>
            );
        };

        // หน้าต่างดูรูปทั้งหมดของสินค้า
        const ImageGallery = ({ item, onClose }) => {
            const imgs = getItemImages(item);
            const [idx, setIdx] = useState(0);
            const go = (d) => setIdx(i => (i + d + imgs.length) % imgs.length);
            return (
                <div className="fixed inset-0 bg-black/70 flex items-center justify-center z-[60] p-4" onClick={onClose}>
                    <div onClick={e => e.stopPropagation()} className="bg-white rounded-2xl w-full max-w-lg max-h-[92vh] overflow-auto modal-enter">
                        <div className="flex justify-between items-center p-4 border-b">
                            <div className="font-bold text-gray-800 truncate pr-3">{item.name}</div>
                            <button onClick={onClose} className="text-gray-400 hover:text-gray-600"><i className="fas fa-times text-lg"></i></button>
                        </div>
                        <div className="p-4 space-y-3">
                            <div className="relative bg-gray-100 rounded-xl overflow-hidden aspect-square flex items-center justify-center">
                                {imgs.length === 0 ? (
                                    <div className="text-gray-400 text-sm text-center"><i className="fas fa-image text-4xl opacity-40 block mb-2"></i>ยังไม่มีรูปสินค้า</div>
                                ) : (
                                    <SafeImg src={imgs[idx]} alt={item.name} className="w-full h-full object-contain" />
                                )}
                                {imgs.length > 1 && (<>
                                    <button onClick={() => go(-1)} className="absolute left-2 top-1/2 -translate-y-1/2 w-9 h-9 rounded-full bg-black/50 text-white"><i className="fas fa-chevron-left"></i></button>
                                    <button onClick={() => go(1)} className="absolute right-2 top-1/2 -translate-y-1/2 w-9 h-9 rounded-full bg-black/50 text-white"><i className="fas fa-chevron-right"></i></button>
                                    <div className="absolute bottom-2 right-2 bg-black/60 text-white text-xs px-2 py-0.5 rounded-full">{idx + 1}/{imgs.length}</div>
                                </>)}
                            </div>
                            {imgs.length > 1 && (
                                <div className="flex gap-2 overflow-x-auto pb-1">
                                    {imgs.map((u, i) => (
                                        <button key={i} onClick={() => setIdx(i)} className={`shrink-0 rounded-lg border-2 ${i === idx ? 'border-blue-600' : 'border-transparent'}`}>
                                            <SafeImg src={u} className="w-14 h-14 object-cover rounded-md" />
                                        </button>
                                    ))}
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        const dayKey = (d) => {
            const dateObj = typeof d === 'string' ? new Date(d) : d;
            if (isNaN(dateObj)) return '';
            return `${dateObj.getFullYear()}-${String(dateObj.getMonth() + 1).padStart(2, '0')}-${String(dateObj.getDate()).padStart(2, '0')}`;
        };

        const buildLedger = (transactions) => {
            let bal = 0;
            return transactions
                .map((t, i) => ({ ...t, _i: i, _d: txDate(t) }))
                .sort((a, b) => a._d - b._d || a._i - b._i)
                .map(t => {
                    const inc = t.type === 'รายรับ' ? (t.amount || 0) : 0;
                    const exp = t.type === 'รายจ่าย' ? (t.amount || 0) : 0;
                    bal += inc - exp;
                    return { ...t, inc, exp, bal };
                });
        };

        // ==========================================
        // 1. UI Components (Toast)
        // ==========================================
        const Toast = ({ message, onClose }) => {
            useEffect(() => {
                if (message) {
                    const timer = setTimeout(onClose, 3000);
                    return () => clearTimeout(timer);
                }
            }, [message, onClose]);

            if (!message) return null;
            return (
                <div className="fixed bottom-4 right-4 bg-gray-800 text-white px-6 py-3 rounded-xl shadow-2xl flex items-center gap-3 z-50 animate-bounce">
                    <i className="fas fa-check-circle text-green-400 text-xl"></i>
                    <span className="font-medium">{message}</span>
                </div>
            );
        };

        // ==========================================
        // 2. เข้าสู่ระบบ (Login)
        // ==========================================
        const LoginView = ({ onLogin }) => {
            const [username, setUsername] = useState('');
            const [password, setPassword] = useState('');
            const [error, setError] = useState('');

            const handleSubmit = (e) => {
                e.preventDefault();
                if (username.trim().toLowerCase() === 'admin' && password === 'Nf190448') {
                    onLogin('admin', 'Admin');
                } else {
                    setError('ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง');
                    setPassword('');
                }
            };

            return (
                <div className="min-h-screen bg-slate-100 flex items-center justify-center p-4">
                    <div className="max-w-md w-full bg-white rounded-2xl shadow-xl p-8 border border-gray-100 modal-enter">
                        <div className="text-center mb-6">
                            <img src={LOGO_SRC} alt="GP Mobile shop" className="h-24 w-auto mx-auto mb-4 object-contain" />
                            <h1 className="text-2xl font-bold text-gray-800">เข้าสู่ระบบ GP Mobile shop</h1>
                        </div>
                        <form onSubmit={handleSubmit} className="space-y-4">
                            {error && <div className="bg-red-50 text-red-500 p-3 rounded-xl text-sm font-medium text-center border border-red-200">{error}</div>}
                            <div>
                                <label className="text-xs text-gray-500">ชื่อผู้ใช้ (Username)</label>
                                <input autoFocus value={username} onChange={e => setUsername(e.target.value)} className="w-full p-3 border rounded-xl text-sm" placeholder="Admin" />
                            </div>
                            <div>
                                <label className="text-xs text-gray-500">รหัสผ่าน (Password)</label>
                                <input type="password" value={password} onChange={e => setPassword(e.target.value)} className="w-full p-3 border rounded-xl text-sm" placeholder="••••••••" />
                            </div>
                            <button type="submit" className="w-full bg-blue-600 text-white font-bold py-3 rounded-xl hover:bg-blue-700 transition shadow-lg"><i className="fas fa-sign-in-alt mr-2"></i>เข้าสู่ระบบ</button>
                        </form>
                    </div>
                </div>
            );
        };

        // ==========================================
        // 2.5 หน้าอนิเมชั่นหลังเข้าสู่ระบบ (Intro) — เล่นทุกครั้งที่ล็อกอิน ก่อนเข้าหน้าหลัก (กดข้ามได้)
        // ==========================================
        const INTRO_TITLE = 'GP Mobile shop';
        const INTRO_TOTAL_MS = 4600; // ความยาวรวม รวมช่วงจางหาย (ต้องยาวกว่าอนิเมชั่นใน CSS ประมาณ 0.5 วินาที)
        // ตำแหน่ง/ขนาด/จังหวะของเศษคริสตัลที่ลอยอยู่ในพื้นหลัง
        const INTRO_SHARDS = [
            { x: '8%', y: '18%', s: '18px', d: '0s' }, { x: '84%', y: '14%', s: '26px', d: '0.5s' },
            { x: '16%', y: '70%', s: '22px', d: '0.9s' }, { x: '76%', y: '74%', s: '16px', d: '1.3s' },
            { x: '50%', y: '9%', s: '14px', d: '0.7s' }, { x: '30%', y: '86%', s: '20px', d: '1.6s' },
            { x: '92%', y: '52%', s: '18px', d: '0.3s' }, { x: '4%', y: '48%', s: '24px', d: '1.1s' },
            { x: '64%', y: '90%', s: '14px', d: '2s' }, { x: '40%', y: '6%', s: '16px', d: '1.8s' }
        ];

        const IntroView = ({ onDone }) => {
            const doneRef = useRef(false);
            const finish = () => { if (doneRef.current) return; doneRef.current = true; onDone(); };
            useEffect(() => {
                const t = setTimeout(finish, INTRO_TOTAL_MS);
                return () => clearTimeout(t);
            }, []);

            return (
                <div className="gp-intro" role="dialog" aria-label="กำลังเข้าสู่ระบบ">
                    <div className="gp-intro-rays"></div>
                    <div className="gp-intro-flash"></div>
                    {INTRO_SHARDS.map((sh, i) => (
                        <div key={i} className="gp-intro-shard" style={{ '--x': sh.x, '--y': sh.y, '--s': sh.s, '--d': sh.d }}></div>
                    ))}
                    <div className="gp-intro-content">
                        <div className="gp-intro-card">
                            <img src={LOGO_SRC} alt="GP Mobile shop" />
                        </div>
                        <h1 className="gp-intro-title" aria-label={INTRO_TITLE}>
                            {INTRO_TITLE.split('').map((ch, i) => (
                                <span key={i} className="gp-intro-letter" aria-hidden="true" style={{ animationDelay: `${1.0 + i * 0.06}s` }}>{ch === ' ' ? ' ' : ch}</span>
                            ))}
                        </h1>
                        <p className="gp-intro-sub">ระบบจัดการร้านมือถือ</p>
                    </div>
                    <div className="gp-intro-bar-wrap"><div className="gp-intro-bar"></div></div>
                    <button type="button" onClick={finish} className="gp-intro-skip"><i className="fas fa-forward"></i> ข้าม</button>
                </div>
            );
        };

        // ==========================================
        // 3. Tab Components
        // ==========================================

        // --- 3.1 แดชบอร์ด (Dashboard) ---
        const DashboardTab = ({ inventory, pawns, repairs, sales, transactions }) => {
            const [viewMode, setViewMode] = useState('summary'); // 'summary' หรือ 'calendar'
            const [calMonth, setCalMonth] = useState(new Date().getMonth());
            const [calYear, setCalYear] = useState(new Date().getFullYear());
            const [selectedDay, setSelectedDay] = useState(null); // วันที่ที่กดดูรายละเอียด (yyyy-MM-dd)

            const currentMonth = new Date().getMonth();
            const currentYear = new Date().getFullYear();

            // คำนวณมูลค่าต่างๆ
            const totalInventoryValue = inventory.reduce((sum, item) => sum + (item.cost * item.qty), 0);
            const totalPawnValue = pawns.reduce((sum, p) => ['อยู่ในระหว่างจำนำ', 'อยู่ในระหว่างหลุดจำนำ'].includes(p.status) ? sum + p.principal : sum, 0);
            const totalRepairCost = repairs.reduce((sum, r) => sum + (r.cost || 0), 0);
            
            // เปลี่ยนจากรายจ่ายต่อเดือนเป็น "ต้นทุนภายในร้าน"
            const internalStoreCost = totalInventoryValue + totalPawnValue + totalRepairCost;

            const totalRepairValue = repairs.reduce((sum, r) => sum + (r.price || 0), 0);
            const currentMonthSales = sales
                .filter(s => {
                    const d = s.date ? new Date(s.date) : new Date();
                    return d.getMonth() === currentMonth && d.getFullYear() === currentYear;
                })
                .reduce((sum, sale) => sum + sale.total, 0);
            
            const ledger = buildLedger(transactions);
            const monthRows = ledger.filter(r => r._d.getMonth() === currentMonth && r._d.getFullYear() === currentYear);
            const mIncome = monthRows.reduce((s, r) => s + r.inc, 0);
            const mExpense = monthRows.reduce((s, r) => s + r.exp, 0);
            const todayIncome = ledger.filter(r => dayKey(r._d) === dayKey(new Date())).reduce((s, r) => s + r.inc, 0);
            const mSalesProfit = monthRows.reduce((s, r) => s + (r.profit || 0), 0); // กำไรจากรายการซื้อขายสินค้า (ราคาขาย-ต้นทุน) เดือนนี้

            const bookCards = [
                { label: 'วันนี้ขายได้', val: todayIncome, color: 'text-green-600', bg: 'bg-green-50' },
                { label: 'ต้นทุนภายในร้านรวม', val: internalStoreCost, color: 'text-amber-600', bg: 'bg-amber-50' },
                { label: 'ขายได้/รายรับเดือนนี้', val: mIncome, color: 'text-green-600', bg: 'bg-green-50' },
                { label: 'กำไรสุทธิเดือนนี้', val: mIncome - mExpense, color: 'text-blue-600', bg: 'bg-blue-50' },
                { label: 'กำไรจากการขายสินค้าเดือนนี้', val: mSalesProfit, color: 'text-purple-600', bg: 'bg-purple-50' },
            ];

            const pendingPawns = pawns.filter(p => ['อยู่ในระหว่างจำนำ', 'อยู่ในระหว่างหลุดจำนำ'].includes(p.status)).length;
            const pendingRepairs = repairs.filter(r => r.status !== 'ซ่อมเสร็จสิ้น').length;
            const totalNetBalance = currentMonthSales + totalRepairValue + totalPawnValue + totalInventoryValue;

            // --- คำนวณข้อมูลปฏิทิน ---
            const calendarDays = useMemo(() => {
                const firstDay = new Date(calYear, calMonth, 1).getDay();
                const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
                const days = [];

                // เติมวันว่างก่อนวันที่ 1
                for (let i = 0; i < firstDay; i++) {
                    days.push(null);
                }

                // เติมวันในเดือน
                for (let d = 1; d <= daysInMonth; d++) {
                    const dateStr = `${calYear}-${String(calMonth + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                    
                    // 1. รายการจำนำครบกำหนดวันไหน
                    const pawnItems = pawns.filter(p => p.dueDate === dateStr && ['อยู่ในระหว่างจำนำ', 'อยู่ในระหว่างหลุดจำนำ'].includes(p.status));
                    
                    // 2. รายการขายต่อวัน (POS) แยกต่างหาก
                    const daySales = sales.filter(s => {
                        const sDate = dayKey(new Date(s.date));
                        return sDate === dateStr;
                    });
                    const daySalesTotal = daySales.reduce((sum, s) => sum + s.total, 0);

                    days.push({ dayNum: d, dateStr, pawnItems, daySalesTotal, salesCount: daySales.length, daySales });
                }
                return days;
            }, [calMonth, calYear, pawns, sales]);

            return (
                <div className="space-y-6 page-fade-in">
                    <div className="flex flex-wrap items-center justify-between gap-4">
                        <h2 className="text-2xl font-bold text-gray-800">ภาพรวมธุรกิจ (Dashboard)</h2>
                        
                        {/* ปุ่มสลับมุมมอง */}
                        <div className="flex bg-gray-200 p-1 rounded-xl">
                            <button 
                                onClick={() => setViewMode('summary')}
                                className={`px-4 py-2 text-sm font-bold rounded-lg transition ${viewMode === 'summary' ? 'bg-white text-blue-600 shadow-sm' : 'text-gray-600 hover:text-gray-900'}`}

                    capacity: isPhoneCategory ? formData.capacity : '',
                    color: isPhoneCategory ? formData.color : '',
                    ...packImages(formData.images)

                            <button type="submit" disabled={imgBusy} className="w-full bg-blue-600 text-white font-bold py-3 px-4 rounded-xl hover:bg-blue-700 shadow-md transition transform active:scale-[0.99] disabled:opacity-50">{imgBusy ? 'กำลังอัปโหลดรูป... กรุณารอสักครู่' : 'เพิ่มสินค้าใหม่'}</button>
                        </form>
                    </div>

                    <div className="flex flex-wrap gap-2">
                        {[{ key: 'all', label: 'ทั้งหมด', icon: 'fa-layer-group' }, ...INV_CATEGORIES.map(c => ({ key: c.value, label: c.label, icon: c.icon }))].map(t => (
                            <button key={t.key} type="button" onClick={() => setViewCat(t.key)} className={`px-4 py-2.5 rounded-xl font-bold text-sm border transition ${viewCat === t.key ? 'bg-blue-600 text-white border-blue-600 shadow-sm' : 'bg-white text-gray-600 hover:bg-blue-50'}`}>
                                <i className={`fas ${t.icon} mr-2`}></i>{t.label} ({t.key === 'all' ? inventory.length : inventory.filter(i => i.category === t.key).length})
                            </button>
                        ))}
                    </div>

                    <div className="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
                        <div className="overflow-x-auto">
                        <table className="w-full text-left">
                            <thead className="bg-slate-50 text-slate-600 text-sm">
                                <tr>
                                    <th className="p-4 border-b">รูปภาพ</th>
                                    <th className="p-4 border-b">รหัส / SKU</th>
                                    <th className="p-4 border-b">ชื่อสินค้า</th>
                                    <th className="p-4 border-b">หมวดหมู่</th>
                                    <th className="p-4 border-b">สเปค / รายละเอียด</th>
                                    <th className="p-4 border-b">คงเหลือ</th>
                                    {userRole === 'admin' && <th className="p-4 border-b">ต้นทุน</th>}

                                    <th className="p-4 border-b">จัดการ</th>

                                                    {imgs.length > 1 && <span className="absolute -bottom-1 -right-1 bg-blue-600 text-white text-[10px] font-bold px-1.5 rounded-full">{imgs.length}</span>}
                                                </button>

                                        <td className="p-4 font-mono">{item.sku}</td>

                                        <td className="p-4">
                                            <span className={`px-2 py-1 rounded text-xs font-semibold ${catInfo(item.category).badge}`}>
                                                {catInfo(item.category).label}

                                                <div>
                                                    {item.capacity && <span className="mr-2">💾 {item.capacity}</span>}
                                                    {item.color && <span className="mr-2">🎨 {item.color}</span>}
                                                    {item.battery && <span>🔋 {item.battery}</span>}
                                                </div>

                                            <div className="flex items-center gap-2">

                                                <button onClick={() => adjustQty(item.id, 1)} className="w-7 h-7 rounded bg-gray-100 hover:bg-gray-200 font-bold flex items-center justify-center border text-gray-700">+</button>
                                            </div>
                                        </td>
                                        {userRole === 'admin' && <td className="p-4 text-gray-500">฿{item.cost.toLocaleString()}</td>}
                                        <td className="p-4 font-bold">฿{item.price.toLocaleString()}</td>
                                        <td className="p-4 whitespace-nowrap">
                                            <button onClick={() => setEdit({ ...item, imgs: padImages(getItemImages(item)) })} className="text-xs bg-blue-100 text-blue-700 px-3 py-1.5 rounded-lg hover:bg-blue-200 font-bold mr-1"><i className="fas fa-pen mr-1"></i>แก้ไข</button>
                                            {item.qty <= LOW_STOCK_THRESHOLD && (
                                                <button onClick={() => addToOrder(item)} className="text-xs bg-orange-100 text-orange-700 px-3 py-1.5 rounded-lg hover:bg-orange-200 font-bold" title="สต็อกใกล้หมด - เพิ่มในรายการสั่งของ"><i className="fas fa-cart-plus mr-1"></i>สั่งของ</button>
                                            )}
                                        </td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                        </div>
                    </div>
                {showOrderPanel && (
                        <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4" onClick={() => setShowOrderPanel(false)}>
                            <div onClick={e => e.stopPropagation()} className="bg-white rounded-2xl p-6 w-full max-w-2xl max-h-[90vh] overflow-auto space-y-4 modal-enter">
                                <div className="flex justify-between items-center">
                                    <h3 className="text-lg font-bold text-gray-800"><i className="fas fa-cart-plus text-orange-500 mr-2"></i>รายการสั่งของ (สต็อกเหลือ ≤ {LOW_STOCK_THRESHOLD} ชิ้น)</h3>
                                    <button onClick={() => setShowOrderPanel(false)} className="text-gray-400 hover:text-gray-600"><i className="fas fa-times text-lg"></i></button>
                                </div>
                                {orderList.length === 0 ? (
                                    <p className="text-center text-gray-400 py-8">ยังไม่มีรายการ — กดปุ่ม "สั่งของ" ที่สินค้าซึ่งเหลือน้อยในตารางสต็อก</p>
                                ) : (
                                    <div className="border rounded-xl overflow-hidden">
                                        <table className="w-full text-left text-sm">
                                            <thead className="bg-slate-50 text-slate-600">
                                                <tr><th className="p-2.5">สินค้า</th><th className="p-2.5">คงเหลือ</th><th className="p-2.5">จำนวนที่จะสั่ง</th><th className="p-2.5"></th></tr>
                                            </thead>
                                            <tbody>
                                                {orderList.map(o => (
                                                    <tr key={o.id} className="border-t">
                                                        <td className="p-2.5 font-medium">{o.name}<div className="text-xs text-gray-400 font-mono">{o.sku}</div></td>
                                                        <td className="p-2.5 text-red-500 font-bold">{o.currentQty}</td>
                                                        <td className="p-2.5"><input type="number" min="1" value={o.orderQty} onChange={e => updateOrderQty(o.id, e.target.value)} className="w-20 border rounded-lg p-1.5 text-sm" /></td>
                                                        <td className="p-2.5 text-right"><button onClick={() => removeFromOrder(o.id)} className="text-red-500 hover:bg-red-50 p-1.5 rounded-lg"><i className="fas fa-trash"></i></button></td>
