    <script>
        // iOS Safari ไม่ยอมทำตาม user-scalable=no จึงต้องดักท่าทางถ่างนิ้ว (pinch) เพิ่มอีกชั้น
        ['gesturestart', 'gesturechange', 'gestureend'].forEach(function (ev) {
            document.addEventListener(ev, function (e) { e.preventDefault(); }, { passive: false });
        });
        document.addEventListener('touchmove', function (e) {
            if ((e.touches && e.touches.length > 1) || (e.scale && e.scale !== 1)) e.preventDefault();
        }, { passive: false });
    </script>

        @media print {
            .print\:hidden { display: none !important; }

            .print\:overflow-visible { overflow: visible !important; }
            .print\:h-auto { height: auto !important; }
            .print\:bg-white { background-color: white !important; }
            body { background-color: white !important; margin: 0; padding: 0; }

        html, body { overflow-x: hidden; max-width: 100vw; font-family: 'Inter', system-ui, -apple-system, sans-serif; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }

        /* ล็อกขนาดหน้าจอบนมือถือ/แท็บเล็ต: ห้ามซูมด้วยการถ่างนิ้ว / แตะสองครั้ง (ยังเลื่อนหน้าขึ้นลง-ซ้ายขวาได้ปกติ) */
        *, *::before, *::after { touch-action: pan-x pan-y; }
        /* กัน iOS ซูมเองตอนแตะช่องกรอกข้อมูล (iOS จะซูมถ้าตัวอักษรในช่องเล็กกว่า 16px) - ใช้เฉพาะหน้าจอสัมผัส */
        @media (pointer: coarse) {
            input, select, textarea { font-size: 16px !important; }
        }

        /* Animation เคลื่อนไหวในการเปลี่ยนหน้า */
        .page-fade-in {
            animation: fadeInSlide 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fadeInSlide {
            from {
                opacity: 0;
                transform: translateY(12px);

            to {

        /* Modal scale transition */

            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        const getItemImages = (item) => {
            if (!item) return [];
            let list = [];
            if (Array.isArray(item.images)) list = item.images;
            else if (typeof item.images === 'string' && item.images.trim()) list = item.images.split('|');
            list = list.map(s => String(s).trim()).filter(Boolean);
            if (list.length === 0 && item.imageUrl) list = [String(item.imageUrl).trim()];
            return list.filter(Boolean);
        };
        const padImages = (list) => { const a = [...list]; while (a.length < MIN_IMAGE_SLOTS) a.push(''); return a; };
        const packImages = (list) => {
            const clean = list.map(s => (s || '').trim()).filter(Boolean);
            // imageUrl เก็บเฉพาะรูปที่เป็นลิงก์ (ไม่เก็บรูปไฟล์ซ้ำ เพื่อประหยัดพื้นที่) - ใช้ images เป็นหลัก
            return { images: clean.join('|'), imageUrl: clean.find(s => !s.startsWith('data:')) || '' };
        };

        // รูปที่โหลดไม่ได้ / ยังไม่มีรูป จะแสดงไอคอนแทน
        const SafeImg = ({ src, alt, className }) => {
            const [failed, setFailed] = useState(false);
            useEffect(() => { setFailed(false); }, [src]);
            if (!src || failed) {
                return <div className={`${className} bg-gray-100 flex items-center justify-center text-gray-300`}><i className="fas fa-image"></i></div>;
            }
            return <img src={src} alt={alt || ''} loading="lazy" referrerPolicy="no-referrer" onError={() => setFailed(true)} className={className} />;
        };

        // ===== อัปโหลดรูปจากเครื่อง / ถ่ายรูป =====
        // รูปจากเครื่องจะถูกย่อและบีบอัดเป็น JPEG แล้วเก็บในข้อมูลสินค้าโดยตรง (ใช้ได้ทุกอุปกรณ์ที่เปิดระบบ)
        // งบขนาดรูปรวมต่อสินค้า 1 ชิ้น (จำนวนตัวอักษร) - Google Sheets เก็บได้ไม่เกิน 50,000 ตัวอักษรต่อ 1 ช่อง
        // ถ้าตรวจแล้วว่าชีตของคุณรับได้มากกว่านี้ ค่อยเพิ่มเลขนี้เพื่อให้รูปคมขึ้น
        const IMAGE_CHAR_BUDGET_PER_ITEM = 44000;
        const isDataUrl = (s) => typeof s === 'string' && s.startsWith('data:');
        const dataChars = (list) => list.reduce((n, s) => n + (isDataUrl(s) ? s.length : 0), 0);
        const kbOf = (chars) => Math.max(1, Math.round(chars * 0.75 / 1024));

        const loadImageFromFile = (file) => new Promise((resolve, reject) => {
            const url = URL.createObjectURL(file);
            const img = new Image();
            img.onload = () => { URL.revokeObjectURL(url); resolve(img); };
            img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('อ่านไฟล์รูปไม่ได้ (รองรับ JPG / PNG / WebP)')); };
            img.src = url;
        });
        // ย่อรูปลงทีละขั้นจนขนาด (ตัวอักษร base64) ไม่เกิน maxChars
        const compressImage = async (file, maxChars) => {
            const img = await loadImageFromFile(file);
            const w0 = img.naturalWidth || img.width, h0 = img.naturalHeight || img.height;
            let best = '', lastScale = -1;
            for (const maxSide of [720, 600, 480, 400, 340, 280, 240, 200]) {
                const scale = Math.min(1, maxSide / Math.max(w0, h0));
                if (scale === 1 && lastScale === 1) continue; // รูปเล็กกว่าขนาดนี้อยู่แล้ว ไม่ต้องลองซ้ำ
                lastScale = scale;
                const w = Math.max(1, Math.round(w0 * scale)), h = Math.max(1, Math.round(h0 * scale));
                const canvas = document.createElement('canvas');
                canvas.width = w; canvas.height = h;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, w, h); // พื้นขาวสำหรับรูป PNG โปร่งใส
                ctx.drawImage(img, 0, 0, w, h);
                for (const q of [0.7, 0.55, 0.42]) {
                    best = canvas.toDataURL('image/jpeg', q);
                    if (best.length <= maxChars) return best;
                }
            }
            return best;
        };

        // ช่องรูปสินค้า (ขั้นต่ำ 4 ช่อง เพิ่มได้ถึง 8): เลือกไฟล์ / ถ่ายรูป / วางลิงก์ก็ได้
        const ImageUrlsEditor = ({ urls, onChange }) => {
            const list = padImages(urls);
            const listRef = useRef(list); listRef.current = list;
            const onChangeRef = useRef(onChange); onChangeRef.current = onChange;
            const fileRef = useRef(null);
            const camRef = useRef(null);
            const [busy, setBusy] = useState(false);
            const [msg, setMsg] = useState('');
            const canCapture = typeof window !== 'undefined' && !!window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
            const setAt = (i, v) => { const a = [...list]; a[i] = v; onChange(a); };
            const filled = list.filter(s => s.trim()).length;
            const used = dataChars(list);

            const handleFiles = async (fileList) => {
                const files = Array.from(fileList || []).filter(f => (f.type || '').startsWith('image/') || /\.(jpe?g|png|webp|gif|heic|heif)$/i.test(f.name || ''));
                if (files.length === 0) return;
                setBusy(true); setMsg('');
                try {
                    const cur = listRef.current;
                    const filledNow = cur.filter(s => s.trim()).length;
                    // แบ่งงบขนาดให้พอสำหรับอย่างน้อย 4 รูป
                    const reserve = Math.max(files.length, MIN_IMAGE_SLOTS - filledNow, 1);
                    const cap = Math.max(4000, Math.floor((IMAGE_CHAR_BUDGET_PER_ITEM - dataChars(cur)) / reserve));
                    const results = [];
                    for (const f of files) results.push(await compressImage(f, cap));
                    const next = [...listRef.current];
                    let skipped = 0;
                    results.forEach(r => {
                        const i = next.findIndex(s => !s.trim());
                        if (i !== -1) next[i] = r;
                        else if (next.length < MAX_IMAGE_SLOTS) next.push(r);
                        else skipped++;
                    });
                    onChangeRef.current(next);
                    const notes = [];
                    if (skipped) notes.push(`ช่องรูปเต็ม ${MAX_IMAGE_SLOTS} รูปแล้ว ข้ามไป ${skipped} รูป`);
                    if (dataChars(next) > IMAGE_CHAR_BUDGET_PER_ITEM) notes.push('ขนาดรวมรูปจากเครื่องเกินที่แนะนำ อาจบันทึกขึ้น Google Sheets ไม่ได้ ลองลบบางรูปหรือใช้ลิงก์แทน');
                    setMsg(notes.join(' · '));
                } catch (err) {
                    setMsg('⚠️ ' + (err && err.message ? err.message : 'เพิ่มรูปไม่สำเร็จ'));
                }
                setBusy(false);
            };
            const onPick = (e) => { const fl = Array.from(e.target.files || []); e.target.value = ''; handleFiles(fl); };

            return (
                <div className="p-4 bg-slate-50 rounded-xl border border-slate-200 space-y-3">
                    <div className="flex justify-between items-center gap-2">
                        <div className="text-xs font-bold text-slate-700"><i className="fas fa-images mr-1.5"></i>รูปสินค้า (อย่างน้อย {MIN_IMAGE_SLOTS} รูป)</div>
                        <div className={`text-xs font-bold ${filled >= MIN_IMAGE_SLOTS ? 'text-green-600' : 'text-gray-400'}`}>ใส่แล้ว {filled}/{MIN_IMAGE_SLOTS}</div>
                    </div>

                    <div className="flex flex-wrap gap-2">
                        <button type="button" disabled={busy} onClick={() => fileRef.current && fileRef.current.click()} className="px-3 py-2 rounded-lg bg-blue-600 text-white text-sm font-bold hover:bg-blue-700 disabled:opacity-50">
                            <i className="fas fa-folder-open mr-1.5"></i>เลือกรูปจากเครื่อง
                        </button>
                        {canCapture && (
                            <button type="button" disabled={busy} onClick={() => camRef.current && camRef.current.click()} className="px-3 py-2 rounded-lg bg-emerald-600 text-white text-sm font-bold hover:bg-emerald-700 disabled:opacity-50">
                                <i className="fas fa-camera mr-1.5"></i>ถ่ายรูป
                            </button>
                        )}
                        {busy && <span className="text-sm text-gray-500 self-center"><i className="fas fa-spinner fa-spin mr-1.5"></i>กำลังย่อรูป...</span>}
                        <input ref={fileRef} type="file" accept="image/*" multiple className="hidden" onChange={onPick} />
                        <input ref={camRef} type="file" accept="image/*" capture="environment" className="hidden" onChange={onPick} />
                    </div>
                    <div className="text-[11px] text-gray-400">เลือกได้หลายรูปพร้อมกัน ระบบจะย่อรูปให้อัตโนมัติ หรือจะวางลิงก์รูป (https://...) ในช่องด้านล่างก็ได้</div>
                    {msg && <div className="text-xs text-red-500 font-medium">{msg}</div>}

                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        {list.map((u, i) => (
                            <div key={i} className="flex items-center gap-2">
                                <SafeImg src={u.trim()} className="w-12 h-12 shrink-0 object-cover rounded-lg border bg-white" />
                                <div className="flex-1 min-w-0">
                                    <label className="text-xs text-gray-500">{i === 0 ? 'รูปที่ 1 (รูปหลัก)' : `รูปที่ ${i + 1}`}</label>
                                    {isDataUrl(u) ? (
                                        <div className="w-full border border-green-200 p-2 rounded-lg text-sm bg-green-50 text-green-700 truncate"><i className="fas fa-check-circle mr-1.5"></i>รูปจากเครื่อง · {kbOf(u.length)} KB</div>
                                    ) : (
                                        <input value={u} onChange={e => setAt(i, e.target.value)} className="w-full border p-2 rounded-lg text-sm bg-white" placeholder="วางลิงก์ https://..." />
                                    )}
                                </div>
                                {u.trim() && (
                                    <button type="button" onClick={() => setAt(i, '')} className="shrink-0 w-8 h-8 mt-4 rounded-lg text-red-400 hover:bg-red-50" title="ลบรูปนี้"><i className="fas fa-trash text-sm"></i></button>
                                )}
                            </div>
                        ))}
                    </div>
                    <div className="flex justify-between items-center">
                        {list.length < MAX_IMAGE_SLOTS ? (
                            <button type="button" onClick={() => onChange([...list, ''])} className="text-xs font-bold text-blue-600 hover:text-blue-800"><i className="fas fa-plus mr-1"></i>เพิ่มช่องรูป</button>
                        ) : <span></span>}
                        {used > 0 && <span className={`text-[11px] ${used > IMAGE_CHAR_BUDGET_PER_ITEM ? 'text-red-500 font-bold' : 'text-gray-400'}`}>ขนาดรูปจากเครื่องรวม {kbOf(used)} KB (ไม่ควรเกิน ~{kbOf(IMAGE_CHAR_BUDGET_PER_ITEM)} KB)</span>}
                    </div>
                </div>
            );
        };

        // หน้าต่างดูรูปทั้งหมดของสินค้า
        const ImageGallery = ({ item, onClose }) => {
            const imgs = getItemImages(item);
            const [idx, setIdx] = useState(0);
            const go = (d) => setIdx(i => (i + d + imgs.length) % imgs.length);
            return (
                <div className="fixed inset-0 bg-black/70 flex items-center justify-center z-[60] p-4" onClick={onClose}>
                    <div onClick={e => e.stopPropagation()} className="bg-white rounded-2xl w-full max-w-lg max-h-[92vh] overflow-auto modal-enter">
                        <div className="flex justify-between items-center p-4 border-b">
                            <div className="font-bold text-gray-800 truncate pr-3">{item.name}</div>
                            <button onClick={onClose} className="text-gray-400 hover:text-gray-600"><i className="fas fa-times text-lg"></i></button>
                        </div>
                        <div className="p-4 space-y-3">
                            <div className="relative bg-gray-100 rounded-xl overflow-hidden aspect-square flex items-center justify-center">
                                {imgs.length === 0 ? (
                                    <div className="text-gray-400 text-sm text-center"><i className="fas fa-image text-4xl opacity-40 block mb-2"></i>ยังไม่มีรูปสินค้า</div>
                                ) : (
                                    <SafeImg src={imgs[idx]} alt={item.name} className="w-full h-full object-contain" />
                                )}
                                {imgs.length > 1 && (<>
                                    <button onClick={() => go(-1)} className="absolute left-2 top-1/2 -translate-y-1/2 w-9 h-9 rounded-full bg-black/50 text-white"><i className="fas fa-chevron-left"></i></button>
                                    <button onClick={() => go(1)} className="absolute right-2 top-1/2 -translate-y-1/2 w-9 h-9 rounded-full bg-black/50 text-white"><i className="fas fa-chevron-right"></i></button>
                                    <div className="absolute bottom-2 right-2 bg-black/60 text-white text-xs px-2 py-0.5 rounded-full">{idx + 1}/{imgs.length}</div>
                                </>)}
                            </div>
                            {imgs.length > 1 && (
                                <div className="flex gap-2 overflow-x-auto pb-1">
                                    {imgs.map((u, i) => (
                                        <button key={i} onClick={() => setIdx(i)} className={`shrink-0 rounded-lg border-2 ${i === idx ? 'border-blue-600' : 'border-transparent'}`}>
                                            <SafeImg src={u} className="w-14 h-14 object-cover rounded-md" />
                                        </button>
                                    ))}
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        const dayKey = (d) => {
            const dateObj = typeof d === 'string' ? new Date(d) : d;
            if (isNaN(dateObj)) return '';
            return `${dateObj.getFullYear()}-${String(dateObj.getMonth() + 1).padStart(2, '0')}-${String(dateObj.getDate()).padStart(2, '0')}`;
        };

        const buildLedger = (transactions) => {
            let bal = 0;
            return transactions
                .map((t, i) => ({ ...t, _i: i, _d: txDate(t) }))
                .sort((a, b) => a._d - b._d || a._i - b._i)
                .map(t => {
                    const inc = t.type === 'รายรับ' ? (t.amount || 0) : 0;
                    const exp = t.type === 'รายจ่าย' ? (t.amount || 0) : 0;
                    bal += inc - exp;
                    return { ...t, inc, exp, bal };
                });
        };

        // ==========================================
        // 1. UI Components (Toast)
        // ==========================================
        const Toast = ({ message, onClose }) => {
            useEffect(() => {
                if (message) {
                    const timer = setTimeout(onClose, 3000);
                    return () => clearTimeout(timer);
                }
            }, [message, onClose]);

            if (!message) return null;
            return (
                <div className="fixed bottom-4 right-4 bg-gray-800 text-white px-6 py-3 rounded-xl shadow-2xl flex items-center gap-3 z-50 animate-bounce">
                    <i className="fas fa-check-circle text-green-400 text-xl"></i>
                    <span className="font-medium">{message}</span>
                </div>
            );
        };

        // ==========================================
        // 2. เข้าสู่ระบบ (Login)
        // ==========================================
        const LoginView = ({ onLogin }) => {
            const [username, setUsername] = useState('');
            const [password, setPassword] = useState('');
            const [error, setError] = useState('');

            const handleSubmit = (e) => {
                e.preventDefault();
                if (username.trim().toLowerCase() === 'admin' && password === 'Nf190448') {
                    onLogin('admin', 'Admin');
                } else {
                    setError('ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง');
                    setPassword('');
                }
            };

            return (
                <div className="min-h-screen bg-slate-100 flex items-center justify-center p-4">
                    <div className="max-w-md w-full bg-white rounded-2xl shadow-xl p-8 border border-gray-100 modal-enter">
                        <div className="text-center mb-6">
                            <img src={LOGO_SRC} alt="GP Mobile shop" className="w-16 h-16 rounded-2xl mx-auto mb-4 shadow-md" />
                            <h1 className="text-2xl font-bold text-gray-800">เข้าสู่ระบบ GP Mobile shop</h1>
                        </div>
                        <form onSubmit={handleSubmit} className="space-y-4">
                            {error && <div className="bg-red-50 text-red-500 p-3 rounded-xl text-sm font-medium text-center border border-red-200">{error}</div>}
                            <div>
                                <label className="text-xs text-gray-500">ชื่อผู้ใช้ (Username)</label>
                                <input autoFocus value={username} onChange={e => setUsername(e.target.value)} className="w-full p-3 border rounded-xl text-sm" placeholder="Admin" />
                            </div>
                            <div>
                                <label className="text-xs text-gray-500">รหัสผ่าน (Password)</label>
                                <input type="password" value={password} onChange={e => setPassword(e.target.value)} className="w-full p-3 border rounded-xl text-sm" placeholder="••••••••" />
                            </div>
                            <button type="submit" className="w-full bg-blue-600 text-white font-bold py-3 rounded-xl hover:bg-blue-700 transition shadow-lg"><i className="fas fa-sign-in-alt mr-2"></i>เข้าสู่ระบบ</button>
                        </form>
                    </div>
                </div>
            );
        };

        // ==========================================
        // 3. Tab Components
        // ==========================================

        // --- 3.1 แดชบอร์ด (Dashboard) ---
        const DashboardTab = ({ inventory, pawns, repairs, sales, transactions }) => {
            const [viewMode, setViewMode] = useState('summary'); // 'summary' หรือ 'calendar'
            const [calMonth, setCalMonth] = useState(new Date().getMonth());
            const [calYear, setCalYear] = useState(new Date().getFullYear());

            const currentMonth = new Date().getMonth();
            const currentYear = new Date().getFullYear();

            // คำนวณมูลค่าต่างๆ
            const totalInventoryValue = inventory.reduce((sum, item) => sum + (item.cost * item.qty), 0);
            const totalPawnValue = pawns.reduce((sum, p) => ['อยู่ในระหว่างจำนำ', 'อยู่ในระหว่างหลุดจำนำ'].includes(p.status) ? sum + p.principal : sum, 0);
            const totalRepairCost = repairs.reduce((sum, r) => sum + (r.cost || 0), 0);
            
            // เปลี่ยนจากรายจ่ายต่อเดือนเป็น "ต้นทุนภายในร้าน"
            const internalStoreCost = totalInventoryValue + totalPawnValue + totalRepairCost;

            const totalRepairValue = repairs.reduce((sum, r) => sum + (r.price || 0), 0);
            const currentMonthSales = sales
                .filter(s => {
                    const d = s.date ? new Date(s.date) : new Date();
                    return d.getMonth() === currentMonth && d.getFullYear() === currentYear;
                })
                .reduce((sum, sale) => sum + sale.total, 0);
            
            const ledger = buildLedger(transactions);
            const monthRows = ledger.filter(r => r._d.getMonth() === currentMonth && r._d.getFullYear() === currentYear);
            const mIncome = monthRows.reduce((s, r) => s + r.inc, 0);
            const mExpense = monthRows.reduce((s, r) => s + r.exp, 0);
            const todayIncome = ledger.filter(r => dayKey(r._d) === dayKey(new Date())).reduce((s, r) => s + r.inc, 0);
            const mSalesProfit = monthRows.reduce((s, r) => s + (r.profit || 0), 0); // กำไรจากรายการซื้อขายสินค้า (ราคาขาย-ต้นทุน) เดือนนี้

            const bookCards = [
                { label: 'วันนี้ขายได้', val: todayIncome, color: 'text-green-600', bg: 'bg-green-50' },
                { label: 'ต้นทุนภายในร้านรวม', val: internalStoreCost, color: 'text-amber-600', bg: 'bg-amber-50' },
                { label: 'ขายได้/รายรับเดือนนี้', val: mIncome, color: 'text-green-600', bg: 'bg-green-50' },
                { label: 'กำไรสุทธิเดือนนี้', val: mIncome - mExpense, color: 'text-blue-600', bg: 'bg-blue-50' },
                { label: 'กำไรจากการขายสินค้าเดือนนี้', val: mSalesProfit, color: 'text-purple-600', bg: 'bg-purple-50' },
            ];

            const pendingPawns = pawns.filter(p => ['อยู่ในระหว่างจำนำ', 'อยู่ในระหว่างหลุดจำนำ'].includes(p.status)).length;
            const pendingRepairs = repairs.filter(r => r.status !== 'ซ่อมเสร็จสิ้น').length;
            const totalNetBalance = currentMonthSales + totalRepairValue + totalPawnValue + totalInventoryValue;

            // --- คำนวณข้อมูลปฏิทิน ---
            const calendarDays = useMemo(() => {
                const firstDay = new Date(calYear, calMonth, 1).getDay();
                const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
                const days = [];

                // เติมวันว่างก่อนวันที่ 1
                for (let i = 0; i < firstDay; i++) {
                    days.push(null);
                }

                // เติมวันในเดือน
                for (let d = 1; d <= daysInMonth; d++) {
                    const dateStr = `${calYear}-${String(calMonth + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                    
                    // 1. รายการจำนำครบกำหนดวันไหน
                    const pawnItems = pawns.filter(p => p.dueDate === dateStr && ['อยู่ในระหว่างจำนำ', 'อยู่ในระหว่างหลุดจำนำ'].includes(p.status));
                    
                    // 2. รายการขายต่อวัน (POS) แยกต่างหาก
                    const daySales = sales.filter(s => {
                        const sDate = dayKey(new Date(s.date));
                        return sDate === dateStr;
                    });
                    const daySalesTotal = daySales.reduce((sum, s) => sum + s.total, 0);

                    days.push({ dayNum: d, dateStr, pawnItems, daySalesTotal, salesCount: daySales.length });
                }
                return days;
            }, [calMonth, calYear, pawns, sales]);

            return (
                <div className="space-y-6 page-fade-in">
                    <div className="flex flex-wrap items-center justify-between gap-4">
                        <h2 className="text-2xl font-bold text-gray-800">ภาพรวมธุรกิจ (Dashboard)</h2>
                        
                        {/* ปุ่มสลับมุมมอง */}
                        <div className="flex bg-gray-200 p-1 rounded-xl">
                            <button

                                        <td className="p-4">
                                            <div className="flex items-center gap-2">
                                                <button onClick={() => adjustQty(item.id, -1)} className="w-7 h-7 rounded bg-gray-100 hover:bg-gray-200 font-bold flex items-center justify-center border text-gray-700">−</button>
                                                <span className={`font-bold w-8 text-center ${item.qty < 5 ? 'text-red-500' : 'text-green-600'}`}>{item.qty}</span>
                                                <button onClick={() => adjustQty(item.id, 1)} className="w-7 h-7 rounded bg-gray-100 hover:bg-gray-200 font-bold flex items-center justify-center border text-gray-700">+</button>
                                            </div>
                                        </td>
                                        {userRole === 'admin' && <td className="p-4 text-gray-500">฿{item.cost.toLocaleString()}</td>}
                                        <td className="p-4 font-bold">฿{item.price.toLocaleString()}</td>
                                        <td className="p-4 whitespace-nowrap">
                                            <button onClick={() => setEdit({ ...item, imgs: padImages(getItemImages(item)) })} className="text-xs bg-blue-100 text-blue-700 px-3 py-1.5 rounded-lg hover:bg-blue-200 font-bold mr-1"><i className="fas fa-pen mr-1"></i>แก้ไข</button>
                                            {item.qty <= LOW_STOCK_THRESHOLD && (
                                                <button onClick={() => addToOrder(item)} className="text-xs bg-orange-100 text-orange-700 px-3 py-1.5 rounded-lg hover:bg-orange-200 font-bold" title="สต็อกใกล้หมด - เพิ่มในรายการสั่งของ"><i className="fas fa-cart-plus mr-1"></i>สั่งของ</button>
                                            )}
                                        </td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                        </div>
                    </div>
                {showOrderPanel && (
                        <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4" onClick={() => setShowOrderPanel(false)}>
                            <div onClick={e => e.stopPropagation()} className="bg-white rounded-2xl p-6 w-full max-w-2xl max-h-[90vh] overflow-auto space-y-4 modal-enter">
                                <div className="flex justify-between items-center">
                                    <h3 className="text-lg font-bold text-gray-800"><i className="fas fa-cart-plus text-orange-500 mr-2"></i>รายการสั่งของ (สต็อกเหลือ ≤ {LOW_STOCK_THRESHOLD} ชิ้น)</h3>
                                    <button onClick={() => setShowOrderPanel(false)} className="text-gray-400 hover:text-gray-600"><i className="fas fa-times text-lg"></i></button>
                                </div>
                                {orderList.length === 0 ? (
                                    <p className="text-center text-gray-400 py-8">ยังไม่มีรายการ — กดปุ่ม "สั่งของ" ที่สินค้าซึ่งเหลือน้อยในตารางสต็อก</p>
                                ) : (
                                    <div className="border rounded-xl overflow-hidden">
                                        <table className="w-full text-left text-sm">
                                            <thead className="bg-slate-50 text-slate-600">
                                                <tr><th className="p-2.5">สินค้า</th><th className="p-2.5">คงเหลือ</th><th className="p-2.5">จำนวนที่จะสั่ง</th><th className="p-2.5"></th></tr>
                                            </thead>
                                            <tbody>
                                                {orderList.map(o => (
                                                    <tr key={o.id} className="border-t">
                                                        <td className="p-2.5 font-medium">{o.name}<div className="text-xs text-gray-400 font-mono">{o.sku}</div></td>
                                                        <td className="p-2.5 text-red-500 font-bold">{o.currentQty}</td>
                                                        <td className="p-2.5"><input type="number" min="1" value={o.orderQty} onChange={e => updateOrderQty(o.id, e.target.value)} className="w-20 border rounded-lg p-1.5 text-sm" /></td>
                                                        <td className="p-2.5 text-right"><button onClick={() => removeFromOrder(o.id)} className="text-red-500 hover:bg-red-50 p-1.5 rounded-lg"><i className="fas fa-trash"></i></button></td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>
                                )}
                                <div className="flex gap-3">
                                    <button type="button" onClick={() => setShowOrderPanel(false)} className="flex-1 border py-2.5 rounded-xl font-bold text-gray-600 hover:bg-gray-50">ปิด</button>
                                    <button type="button" onClick={printOrderList} disabled={orderList.length === 0} className="flex-1 bg-orange-500 text-white py-2.5 rounded-xl font-bold hover:bg-orange-600 shadow-md disabled:opacity-40 disabled:cursor-not-allowed"><i className="fas fa-print mr-2"></i>พิมพ์ใบสั่งซื้อ (A4)</button>
                                </div>
                            </div>
                        </div>
                    )}

                {edit && (
                        <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4" onClick={() => setEdit(null)}>
                            <form onSubmit={saveEdit} onClick={e => e.stopPropagation()} className="bg-white rounded-2xl p-6 w-full max-w-xl max-h-[90vh] overflow-auto space-y-4 modal-enter">
                                <h3 className="text-lg font-bold text-gray-800">แก้ไขสินค้า</h3>
                                <div className="grid grid-cols-2 gap-3">
                                    {field('sku', 'รหัส SKU')}
                                    {field('name', 'ชื่อสินค้า')}
                                    <div>
                                        <label className="text-xs text-gray-500">หมวดหมู่</label>
                                        <select value={edit.category} onChange={e => setEdit({ ...edit, category: e.target.value })} className="w-full border p-2 rounded-lg text-sm">
                                            {INV_CATEGORIES.map(c => <option key={c.value} value={c.value}>{c.full}</option>)}
                                        </select>
                                    </div>
                                    {field('qty', 'จำนวน', 'number')}
                                    {userRole === 'admin' && field('cost', 'ต้นทุน (฿)', 'number')}
                                    {field('price', 'ราคาขาย (฿)', 'number')}
                                    {(edit.category === 'เครื่องใหม่' || edit.category === 'เครื่องมือ2') && (<>
                                        {field('battery', '% แบตเตอรี่', 'text', false)}
                                        {field('capacity', 'ความจุเครื่อง', 'text', false)}
                                        {field('color', 'สีของตัวเครื่อง', 'text', false)}
                                    </>)}
                                </div>
                                <ImageUrlsEditor urls={edit.imgs || []} onChange={imgs => setEdit({ ...edit, imgs })} />
                                <div className="flex gap-3">
                                    <button type="button" onClick={() => setEdit(null)} className="flex-1 border py-2.5 rounded-xl font-bold text-gray-600 hover:bg-gray-50">ยกเลิก</button>
                                    <button type="submit" className="flex-1 bg-blue-600 text-white py-2.5 rounded-xl font-bold hover:bg-blue-700 shadow-md">บันทึก</button>
                                </div>
                            </form>
                        </div>
                    )}

                {galleryItem && <ImageGallery item={galleryItem} onClose={() => setGalleryItem(null)} />}
                </div>
            );
        };

        // --- 3.3 งานซ่อม (Repair) ---
        const RepairTab = ({ repairs, setRepairs, inventory, setInventory, addTransaction, showToast, onPrint }) => {
            const [formData, setFormData] = useState({ name: '', phone: '', model: '', issue: '', partId: '', price: '' });

            const handleSubmit = (e) => {
                e.preventDefault();
                const part = inventory.find(i => i.id === formData.partId);
                const newRepair = {
                    id: `REP${Math.floor(Math.random()*10000)}`,
                    date: new Date().toLocaleDateString('th-TH'),
                    ...formData,
                    partName: part ? part.name : 'ไม่ได้ใช้อะไหล่/ลูกค้านำมาเอง',
                    cost: part ? part.cost : 0,
                    price: parseFloat(formData.price),
                    status: 'รอคิวซ่อม'
                };
                setRepairs([...repairs, newRepair]);
                setFormData({ name: '', phone: '', model: '', issue: '', partId: '', price: '' });
                showToast(`รับงานซ่อม ${newRepair.id} สำเร็จ`);
            };

            const handleUpdateStatus = (id, currentStatus, partId) => {
                if (currentStatus === 'ซ่อมเสร็จสิ้น') return;
                const repair = repairs.find(r => r.id === id);
                if (!repair) return;
                const part = partId ? inventory.find(i => i.id === partId) : null;

                // 1) ตัดสต็อกอะไหล่ที่ใช้ในงานซ่อมออกจากคลังสินค้า
                if (part) {
                    if (part.qty <= 0) { alert('อะไหล่ชิ้นนี้หมดสต็อก ไม่สามารถตัดสต็อกได้!'); return; }
                    setInventory(prev => prev.map(i => i.id === partId ? { ...i, qty: i.qty - 1 } : i));
                }

                // 2) กำไรงานซ่อม = ค่าซ่อม - ต้นทุนอะไหล่ (ติดลบได้ถ้าค่าซ่อมต่ำกว่าทุนอะไหล่)
                const price = repair.price || 0;
                const partCost = part ? (part.cost || 0) : 0;
                const profit = price - partCost;

                setRepairs(repairs.map(r => r.id === id ? { ...r, status: 'ซ่อมเสร็จสิ้น', cost: partCost, profit } : r));

                // 3) ลงสมุดบัญชี: รายรับ = ค่าซ่อม, กำไร = ค่าซ่อม - ทุนอะไหล่
                const note = part
                    ? `ใช้อะไหล่: ${part.name} (ทุน ฿${partCost.toLocaleString()}) กำไร ฿${profit.toLocaleString()}`
                    : 'ไม่ใช้อะไหล่ (กำไรเต็มจำนวน)';
                addTransaction('รายรับ', `งานซ่อมบิล ${id} (${repair.model})`, price, 1, id, note, profit);
                showToast(part ? `จบงานซ่อม ตัดสต็อก ${part.name} และบันทึกกำไร ฿${profit.toLocaleString()} แล้ว` : `จบงานซ่อม บันทึกกำไร ฿${profit.toLocaleString()} แล้ว`);
            };

            return (
                <div className="space-y-6 page-fade-in">
                    <h2 className="text-2xl font-bold text-gray-800">จัดการงานซ่อม</h2>
                    <div className="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                        <form onSubmit={handleSubmit} className="grid grid-cols-1 md:grid-cols-6 gap-4">
                            <div><label className="text-xs text-gray-500">ชื่อลูกค้า</label><input required value={formData.name} onChange={e => setFormData({...formData, name: e.target.value})} className="w-full border p-2.5 rounded-xl text-sm" /></div>
                            <div><label className="text-xs text-gray-500">เบอร์โทร</label><input required value={formData.phone} onChange={e => setFormData({...formData, phone: e.target.value})} className="w-full border p-2.5 rounded-xl text-sm" /></div>
                            <div><label className="text-xs text-gray-500">รุ่นเครื่อง</label><input required value={formData.model} onChange={e => setFormData({...formData, model: e.target.value})} className="w-full border p-2.5 rounded-xl text-sm" /></div>
                            <div><label className="text-xs text-gray-500">อาการเสีย</label><input required value={formData.issue} onChange={e => setFormData({...formData, issue: e.target.value})} className="w-full border p-2.5 rounded-xl text-sm" /></div>
                            <div>
                                <label className="text-xs text-gray-500">เลือกอะไหล่ (ถ้ามี)</label>
                                <select value={formData.partId} onChange={e => setFormData({...formData, partId: e.target.value})} className="w-full border p-2.5 rounded-xl text-sm bg-white">
                                    <option value="">-- ไม่ใช้อะไหล่ --</option>
                                    {inventory.filter(i => i.category === 'อะไหล่').map(i => <option key={i.id} value={i.id} disabled={i.qty<=0}>{i.name} (เหลือ {i.qty})</option>)}
                                </select>
                            </div>
                            <div><label className="text-xs text-gray-500">ราคาประเมิน (฿)</label><input required type="number" value={formData.price} onChange={e => setFormData({...formData, price: e.target.value})} className="w-full border p-2.5 rounded-xl text-sm" /></div>
                            <button type="submit" className="bg-orange-500 text-white font-bold py-3 px-4 rounded-xl md:col-span-6 hover:bg-orange-600 shadow-md transition transform active:scale-[0.99]">รับงานซ่อม</button>
                        </form>
                    </div>

                    <div className="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
                        <div className="overflow-x-auto">
                        <table className="w-full text-left">
                            <thead className="bg-slate-50 text-slate-600 text-sm">
                                <tr><th className="p-4 border-b">เลขที่บิล</th><th className="p-4 border-b">ลูกค้า</th><th className="p-4 border-b">ข้อมูลเครื่อง/อาการ</th><th className="p-4 border-b">ราคา</th><th className="p-4 border-b">สถานะ</th><th className="p-4 border-b text-center">จัดการ</th></tr>
                            </thead>
                            <tbody>
                                {repairs.length === 0 ? <tr><td colSpan={6} className="p-8 text-center text-gray-400">ยังไม่มีงานซ่อม</td></tr> : repairs.map(r => (
                                    <tr key={r.id} className="hover:bg-gray-50 border-b text-sm transition">
                                        <td className="p-4"><div className="font-mono font-bold text-orange-600">{r.id}</div><div className="text-xs text-gray-400">{r.date}</div></td>
                                        <td className="p-4"><div className="font-medium">{r.name}</div><div className="text-xs text-gray-500">{r.phone}</div></td>
                                        <td className="p-4"><div className="font-medium">{r.model} - {r.issue}</div><div className="text-xs text-blue-500">อะไหล่: {r.partName}</div></td>
                                        <td className="p-4 font-bold text-gray-700">฿{r.price?.toLocaleString()}<div className="text-xs font-medium text-purple-600">กำไร ฿{((r.price || 0) - (r.cost || 0)).toLocaleString()}</div></td>
                                        <td className="p-4"><span className={`px-2.5 py-1 rounded-full text-xs font-bold ${r.status === 'ซ่อมเสร็จสิ้น' ? 'bg-green-100 text-green-700' : 'bg-yellow-100 text-yellow-700'}`}>{r.status}</span></td>
                                        <td className="p-4 text-center">
                                            {r.status !== 'ซ่อมเสร็จสิ้น' ? (
                                                <button onClick={() => handleUpdateStatus(r.id, r.status, r.partId)} className="bg-green-500 text-white px-3 py-1.5 rounded-lg text-xs font-bold hover:bg-green-600 shadow-sm">กดจบงาน/ตัดสต็อก</button>
                                            ) : (
                                                <div className="flex flex-col gap-2 items-center">
                                                    <button onClick={() => onPrint('repair', r)} className="text-xs bg-blue-100 text-blue-700 px-3 py-1.5 rounded-lg hover:bg-blue-200 font-bold flex items-center">
                                                        <i className="fas fa-print mr-1"></i> พิมพ์ A4
                                                    </button>
                                                </div>
                                            )}
                                        </td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                        </div>
                    </div>
                </div>
            );
        };

        // --- 3.4 รับจำนำ (Pawn) ---
        const PawnTab = ({ pawns, setPawns, setTransactions, showToast, addTransaction }) => {
            const [formData, setFormData] = useState({ name: '', phone: '', idCard: '', model: '', imei: '', principal: '', startDate: '', dueDate: '', brand: '', modelSel: '' });

            const syncToCalendar = async (pawnData) => {
                showToast("กำลังซิงค์กับปฏิทิน...");
                try {
                    const response = await fetch(SHEET_API_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify({ action: 'syncCalendar', pawn: pawnData })
                    });
                    const result = await response.json();
                    if (!result.success) { showToast(result.message || 'ซิงค์ปฏิทินไม่สำเร็จ'); return; }
                    setPawns(prev => prev.map(p => p.id === pawnData.id ? { ...p, eventId: result.eventId } : p));
                    showToast(result.message || "ซิงค์ปฏิทินสำเร็จ");
                } catch (error) {
                    console.error("Calendar Sync Error:", error);
                    showToast("ไม่สามารถซิงค์ปฏิทินได้");
                }
            };

            const handleSubmit = (e) => {
                e.preventDefault();
                const principal = parseFloat(formData.principal);
                const newPawn = {
                    id: `PWN${Math.floor(Math.random()*10000)}`,
                    ...formData,
                    principal,
                    interest: principal * 0.10,
                    status: 'อยู่ในระหว่างจำนำ',
                    eventId: null
                };
                
                setPawns([...pawns, newPawn]);
                addTransaction('รายจ่าย', `ปล่อยเงินรับจำนำ: ${newPawn.model}`, principal, 1, newPawn.id);
                syncToCalendar(newPawn);

                setFormData({ name: '', phone: '', idCard: '', model: '', imei: '', principal: '', startDate: '', dueDate: '', brand: '', modelSel: '' });
                showToast(`รับจำนำสำเร็จ (ดอกเบี้ย 10%)`);
            };

            // --- ต่อดอก: เก็บดอกเบี้ย 10% ของยอดจำนำเป็นกำไร และเลื่อนวันครบกำหนด ---
            const [renewTarget, setRenewTarget] = useState(null);
            const [renewDate, setRenewDate] = useState('');
            const addDaysYmd = (ymd, n) => {
                const base = ymd && !isNaN(new Date(ymd)) ? new Date(ymd + 'T00:00:00') : new Date();
                base.setDate(base.getDate() + n);
                return dayKey(base);
            };
            const openRenew = (p) => { setRenewTarget(p); setRenewDate(addDaysYmd(p.dueDate, 30)); };
            const confirmRenew = () => {
                const p = renewTarget;
                if (!p || !renewDate) { showToast('กรุณาเลือกวันครบกำหนดใหม่'); return; }
                const profit = (p.principal || 0) * 0.10;
                const updated = {
                    ...p,
                    dueDate: renewDate,
                    status: 'อยู่ในระหว่างจำนำ',
                    renewCount: (p.renewCount || 0) + 1,
                    renewTotal: (p.renewTotal || 0) + profit,
                    lastRenewDate: dayKey(new Date())
                };
                setPawns(pawns.map(x => x.id === p.id ? updated : x));
                addTransaction('รายรับ', `ต่อดอกจำนำ: ${p.model}`, profit, 1, p.id, `ต่อดอกครั้งที่ ${updated.renewCount} (10% ของ ฿${(p.principal || 0).toLocaleString()}) เลื่อนครบกำหนด ${p.dueDate || '-'} → ${renewDate}`);
                syncToCalendar(updated);
                setRenewTarget(null);
                showToast(`ต่อดอกสำเร็จ กำไร ฿${profit.toLocaleString()}`);
            };
            const totalRenewProfit = pawns.reduce((sum, x) => sum + (x.renewTotal || 0), 0);

            const handleExtendDueDate = (pawnId, newDueDate) => {
                const pawn = pawns.find(p => p.id === pawnId);
                const updatedPawn = { ...pawn, dueDate: newDueDate };
                setPawns(pawns.map(p => p.id === pawnId ? updatedPawn : p));
                syncToCalendar(updatedPawn);
            };

            const ACTIVE_STATUS = ['อยู่ในระหว่างจำนำ', 'อยู่ในระหว่างหลุดจำนำ'];
            const syncAllToCalendar = async () => {
                const todo = pawns.filter(x => ACTIVE_STATUS.includes(x.status) && !x.eventId && x.dueDate);
                if (todo.length === 0) { showToast('ไม่มีรายการที่ต้องส่งเข้าปฏิทิน'); return; }
                for (const p of todo) { await syncToCalendar(p); }
                showToast(`ส่งนัดเข้าปฏิทินแล้ว ${todo.length} รายการ`);
            };

            const handleUpdateStatus = (id, newStatus) => {
                const p = pawns.find(x => x.id === id);
                setPawns(pawns.map(pwn => pwn.id === id ? { ...pwn, status: newStatus } : pwn));
                if (newStatus === 'ไถ่เครื่องออก') {
                    addTransaction('รายรับ', `ลูกค้าไถ่เครื่องจำนำ: ${p.model}`, p.principal + p.interest, 1, p.id);
                } else if (newStatus === 'ออกก่อนกำหนด') {
                    addTransaction('รายรับ', `ออกก่อนกำหนด: ${p.model}`, p.principal, 1, p.id);
                }
                showToast(`อัปเดตสถานะเป็น ${newStatus}`);
                syncToCalendar({ ...p, status: newStatus });
            };

            // --- แก้ไขข้อมูลรายการจำนำ (ชื่อ / เบอร์ / บัตร / รุ่น / IMEI / ยอดจำนำ / วันที่) ---
            const [editTarget, setEditTarget] = useState(null);
            const [editForm, setEditForm] = useState({});
            const openEdit = (p) => {
                setEditTarget(p);
                setEditForm({
                    name: p.name || '', phone: p.phone || '', idCard: p.idCard || '',
                    brand: p.brand || '', modelSel: p.modelSel || '', model: p.model || '',
                    imei: p.imei || '', principal: String(p.principal ?? ''),
                    startDate: p.startDate || '', dueDate: p.dueDate || ''
                });
            };
            const saveEdit = (e) => {
                e.preventDefault();
                const p = editTarget;
                const principal = parseFloat(editForm.principal);
                if (!editForm.name.trim()) { showToast('กรุณากรอกชื่อลูกค้า'); return; }
                if (!editForm.model.trim()) { showToast('กรุณาระบุรุ่นเครื่อง'); return; }
                if (isNaN(principal) || principal <= 0) { showToast('ยอดเงินจำนำไม่ถูกต้อง'); return; }
                const updated = {
                    ...p,
                    name: editForm.name.trim(), phone: editForm.phone.trim(), idCard: editForm.idCard.trim(),
                    brand: editForm.brand, modelSel: editForm.modelSel, model: editForm.model.trim(),
                    imei: editForm.imei.trim(), principal, interest: principal * 0.10,
                    startDate: editForm.startDate, dueDate: editForm.dueDate
                };
                setPawns(pawns.map(x => x.id === p.id ? updated : x));
                // ถ้าแก้ยอดจำนำ/รุ่น ให้แก้รายการ "ปล่อยเงินรับจำนำ" ในสมุดบัญชีให้ตรงกัน
                if (principal !== p.principal || updated.model !== p.model) {

                            <div><label className="text-xs text-gray-500">วันที่ครบกำหนด</label><input required type="date" value={formData.dueDate} onChange={e => setFormData({...formData, dueDate: e.target.value})} className="w-full border p-2.5 rounded-xl text-sm" /></div>
                            <button type="submit" className="bg-purple-600 text-white font-bold py-3 px-4 rounded-xl md:col-span-4 hover:bg-purple-700 shadow-md transition transform active:scale-[0.99]">บันทึกรับจำนำ</button>

                    <div className="flex flex-wrap items-center gap-4 text-xs text-gray-600 px-1">

                    {/* ตารางแสดงข้อมูลจำนำครบถ้วนทุกรายละเอียด */}
                    <div className="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">

                            </thead>
                            <tbody>
                                {pawns.length === 0 ? <tr><td colSpan={8} className="p-8 text-center text-gray-400">ยังไม่มีรายการรับจำนำ</td></tr> : pawns.map(p => {
                                    const today = new Date(); today.setHours(0,0,0,0);
                                    const todayStr = dayKey(new Date());
                                    const isOverdue = ACTIVE_STATUS.includes(p.status) && ((p.dueDate && p.dueDate < todayStr) || p.status === 'อยู่ในระหว่างหลุดจำนำ');

                                                {ACTIVE_STATUS.includes(p.status) && <option value="__renew">ต่อดอก (เลื่อนวันครบกำหนด)</option>}

                    </div>

                    {editTarget && (
                        <div className="fixed inset-0 z-50 bg-black/50 flex items-center justify-center p-4" onClick={() => setEditTarget(null)}>
                            <form onSubmit={saveEdit} className="bg-white rounded-2xl shadow-xl w-full max-w-2xl max-h-[90vh] overflow-y-auto p-6 space-y-4" onClick={e => e.stopPropagation()}>
                                <h3 className="text-lg font-bold text-gray-800"><i className="fas fa-edit text-blue-600 mr-2"></i>แก้ไขรายการจำนำ <span className="font-mono text-purple-600">{editTarget.id}</span></h3>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    <div><label className="text-xs text-gray-500">ชื่อลูกค้าผู้จำนำ</label><input required value={editForm.name} onChange={e => setEditForm({...editForm, name: e.target.value})} className="w-full border p-2.5 rounded-xl text-sm" /></div>
                                    <div><label className="text-xs text-gray-500">เบอร์โทรศัพท์</label><input value={editForm.phone} onChange={e => setEditForm({...editForm, phone: e.target.value})} className="w-full border p-2.5 rounded-xl text-sm" /></div>
                                    <div className="md:col-span-2"><label className="text-xs text-gray-500">เลขบัตรประชาชน</label><input value={editForm.idCard} onChange={e => setEditForm({...editForm, idCard: e.target.value})} className="w-full border p-2.5 rounded-xl text-sm" /></div>
                                    <BrandModelPicker brand={editForm.brand} model={editForm.modelSel} onChange={({ brand, model, resolved }) => setEditForm({ ...editForm, brand, modelSel: model, model: resolved || editForm.model })} />
                                    <div className="md:col-span-2"><label className="text-xs text-gray-500">ชื่อ/รุ่นเครื่อง (เลือกจากรายการด้านบน หรือพิมพ์แก้เองได้)</label><input required value={editForm.model} onChange={e => setEditForm({...editForm, model: e.target.value})} className="w-full border p-2.5 rounded-xl text-sm" /></div>
                                    <div><label className="text-xs text-gray-500">หมายเลข IMEI / Serial</label><input value={editForm.imei} onChange={e => setEditForm({...editForm, imei: e.target.value})} className="w-full border p-2.5 rounded-xl text-sm" /></div>
                                    <div><label className="text-xs text-gray-500">ยอดเงินจำนำ (฿)</label><input required type="number" min="0" step="any" value={editForm.principal} onChange={e => setEditForm({...editForm, principal: e.target.value})} className="w-full border p-2.5 rounded-xl text-sm" /></div>
                                    <div><label className="text-xs text-gray-500">วันที่รับจำนำ</label><input type="date" value={editForm.startDate} onChange={e => setEditForm({...editForm, startDate: e.target.value})} className="w-full border p-2.5 rounded-xl text-sm" /></div>
                                    <div><label className="text-xs text-gray-500">วันที่ครบกำหนด</label><input type="date" value={editForm.dueDate} onChange={e => setEditForm({...editForm, dueDate: e.target.value})} className="w-full border p-2.5 rounded-xl text-sm" /></div>
                                </div>
                                <div className="text-xs text-gray-500 bg-slate-50 border rounded-xl p-3">ดอกเบี้ย 10% จะคำนวณใหม่จากยอดจำนำ และถ้าแก้ยอด/รุ่น รายการ "ปล่อยเงินรับจำนำ" ในสมุดบัญชีจะถูกแก้ให้ตรงกัน</div>
                                <div className="flex gap-3">
                                    <button type="button" onClick={() => setEditTarget(null)} className="flex-1 border border-gray-300 text-gray-600 font-bold py-2.5 rounded-xl hover:bg-gray-50">ยกเลิก</button>
                                    <button type="submit" className="flex-1 bg-blue-600 text-white font-bold py-2.5 rounded-xl hover:bg-blue-700 shadow-md">บันทึกการแก้ไข</button>
                                </div>
                            </form>
                        </div>
                    )}

                    {renewTarget && (
                        <div className="fixed inset-0 z-50 bg-black/50 flex items-center justify-center p-4" onClick={() => setRenewTarget(null)}>
                            <div className="bg-white rounded-2xl shadow-xl w-full max-w-md p-6 space-y-4" onClick={e => e.stopPropagation()}>
                                <h3 className="text-lg font-bold text-gray-800"><i className="fas fa-sync-alt text-purple-600 mr-2"></i>ต่อดอก {renewTarget.id}</h3>
                                <div className="text-sm text-gray-600 space-y-1">
                                    <div>ลูกค้า: <b>{renewTarget.name}</b> · {renewTarget.model}</div>
                                    <div>ยอดจำนำ: <b>฿{(renewTarget.principal || 0).toLocaleString()}</b></div>
                                    <div>ครบกำหนดเดิม: <b className="text-red-500">{renewTarget.dueDate || '-'}</b></div>
                                </div>
                                <div className="bg-green-50 border border-green-200 rounded-xl p-3 text-sm text-green-700 font-bold">
                                    ดอกเบี้ยที่รับ (กำไร 10%): ฿{((renewTarget.principal || 0) * 0.10).toLocaleString()}
                                </div>
                                <div>
                                    <label className="text-xs text-gray-500">วันครบกำหนดใหม่ (เปลี่ยนวันได้)</label>
                                    <input type="date" value={renewDate} onChange={e => setRenewDate(e.target.value)} className="w-full border p-2.5 rounded-xl text-sm" />
                                </div>
                                <div className="flex gap-3">
                                    <button onClick={() => setRenewTarget(null)} className="flex-1 border border-gray-300 text-gray-600 font-bold py-2.5 rounded-xl hover:bg-gray-50">ยกเลิก</button>
                                    <button onClick={confirmRenew} className="flex-1 bg-purple-600 text-white font-bold py-2.5 rounded-xl hover:bg-purple-700 shadow-md">ยืนยันต่อดอก</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        // --- 3.5 ลูกค้าสัมพันธ์ (CRM) ---
        const CRMTab = ({ repairs, pawns, onPrintRepair }) => {
            const [searchPhone, setSearchPhone] = useState('');
            const q = searchPhone.trim().toLowerCase();
            const matchRecord = (rec) => q && [rec.phone, rec.id, rec.model, rec.imei].some(f => f && String(f).toLowerCase().includes(q));
            const customerRepairs = repairs.filter(matchRecord);
            const customerPawns = pawns.filter(matchRecord);

            return (
                <div className="space-y-6 page-fade-in">
                    <h2 className="text-2xl font-bold text-gray-800">ค้นหาประวัติลูกค้า (CRM)</h2>
                    <div className="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                        <div className="relative max-w-md mb-6">
                            <input type="text" placeholder="ค้นหาด้วย เบอร์โทร / รหัสเครื่อง / เลขเครื่อง (IMEI) / โมเดลเครื่อง..." value={searchPhone} onChange={e => setSearchPhone(e.target.value)} className="w-full pl-10 pr-4 py-3 border rounded-xl bg-gray-50 focus:bg-white transition" />
                            <i className="fas fa-search text-gray-400 absolute left-3 top-4"></i>
                        </div>

                        {searchPhone && (
                            <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
