<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GP Mobile shop - ระบบจัดการร้านมือถือ</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Crect%20width='64'%20height='64'%20rx='14'%20fill='%232563eb'/%3E%3Ctext%20x='32'%20y='43'%20font-family='Arial,Helvetica,sans-serif'%20font-size='30'%20font-weight='700'%20fill='%23ffffff'%20text-anchor='middle'%3EGP%3C/text%3E%3C/svg%3E">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Babel for in-browser JSX compilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        /* สไตล์สำหรับการพิมพ์ (A4 Print) */
        @media print {
            .print\:hidden { display: none !important; }
            .print\:block { display: block !important; }
            .print\:overflow-visible { overflow: visible !important; }
            .print\:h-auto { height: auto !important; }
            .print\:bg-white { background-color: white !important; }
            body { background-color: white !important; margin: 0; padding: 0; }
            @page { size: A4; margin: 20mm; }
        }
        html, body { overflow-x: hidden; max-width: 100vw; font-family: 'Inter', system-ui, -apple-system, sans-serif; }

        /* Animation เคลื่อนไหวในการเปลี่ยนหน้า */
        .page-fade-in {
            animation: fadeInSlide 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fadeInSlide {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Modal scale transition */
        .modal-enter {
            animation: modalScale 0.25s ease-out forwards;
        }

        @keyframes modalScale {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
    </style>
</head>
<body class="bg-slate-50 text-gray-900">
    
    <div id="root"></div>

    <!-- React Application Code -->
    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // URL ของ Google Apps Script (Web App) สำหรับบันทึก/ดึงข้อมูลอัตโนมัติ
        const SHEET_API_URL = "https://script.google.com/macros/s/AKfycbyH5b7ekdRfJK97w02F946oLfhk-6kJTY1tYo3v36ePE4TCR4uj447EB-zx46CmvjlioQ/exec";

        // ===== ตัวช่วยสมุดบัญชี =====
        const TH_MONTHS = ['มกราคม', 'กุมภาพันธ์', 'มีนาคม', 'เมษายน', 'พฤษภาคม', 'มิถุนายน', 'กรกฎาคม', 'สิงหาคม', 'กันยายน', 'ตุลาคม', 'พฤศจิกายน', 'ธันวาคม'];
        const txDate = (t) => { const d = new Date(t.rawDate || t.id); return isNaN(d) ? new Date() : d; };
        // โลโก้ร้าน (SVG ฝังในไฟล์) - ถ้าต้องการเปลี่ยนเป็นรูปโลโก้ของร้าน แก้ที่ค่านี้ที่เดียว
        const LOGO_SRC = "data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Crect%20width='64'%20height='64'%20rx='14'%20fill='%232563eb'/%3E%3Ctext%20x='32'%20y='43'%20font-family='Arial,Helvetica,sans-serif'%20font-size='30'%20font-weight='700'%20fill='%23ffffff'%20text-anchor='middle'%3EGP%3C/text%3E%3C/svg%3E";

        const dayKey = (d) => {
            const dateObj = typeof d === 'string' ? new Date(d) : d;
            if (isNaN(dateObj)) return '';
            return `${dateObj.getFullYear()}-${String(dateObj.getMonth() + 1).padStart(2, '0')}-${String(dateObj.getDate()).padStart(2, '0')}`;
        };

        const buildLedger = (transactions) => {
            let bal = 0;
            return transactions
                .map((t, i) => ({ ...t, _i: i, _d: txDate(t) }))
                .sort((a, b) => a._d - b._d || a._i - b._i)
                .map(t => {
                    const inc = t.type === 'รายรับ' ? (t.amount || 0) : 0;
                    const exp = t.type === 'รายจ่าย' ? (t.amount || 0) : 0;
                    bal += inc - exp;
                    return { ...t, inc, exp, bal };
                });
        };

        // ==========================================
        // 1. UI Components (Toast)
        // ==========================================
        const Toast = ({ message, onClose }) => {
            useEffect(() => {
                if (message) {
                    const timer = setTimeout(onClose, 3000);
                    return () => clearTimeout(timer);
                }
            }, [message, onClose]);

            if (!message) return null;
            return (
                <div className="fixed bottom-4 right-4 bg-gray-800 text-white px-6 py-3 rounded-xl shadow-2xl flex items-center gap-3 z-50 animate-bounce">
                    <i className="fas fa-check-circle text-green-400 text-xl"></i>
                    <span className="font-medium">{message}</span>
                </div>
            );
        };

        // ==========================================
        // 2. หน้าต่างเข้าสู่ระบบ (LoginView)
        // ==========================================
        const LoginView = ({ onLogin }) => {
            const [username, setUsername] = useState('Navapich');

            const handleLoginSubmit = (e) => {
                e.preventDefault();
                onLogin('admin');
            };

            return (
                <div className="min-h-screen bg-slate-100 flex items-center justify-center p-4">
                    <div className="max-w-md w-full bg-white rounded-2xl shadow-xl p-8 border border-gray-100 modal-enter">
                        <div className="text-center mb-8">
                            <img src={LOGO_SRC} alt="GP Mobile shop" className="w-16 h-16 rounded-2xl mx-auto mb-4 shadow-md" />
                            <h1 className="text-2xl font-bold text-gray-800">เข้าสู่ระบบ GP Mobile shop</h1>
                        </div>
                        
                        <form onSubmit={handleLoginSubmit} className="space-y-4">
                            <div>
                                <label className="block text-xs font-semibold text-gray-600 mb-1">Username (ชื่อผู้ใช้งาน)</label>
                                <input 
                                    type="text" 
                                    value={username} 
                                    onChange={(e) => setUsername(e.target.value)} 
                                    placeholder="กรอก Username" 
                                    className="w-full p-3 border rounded-xl text-sm focus:outline-blue-500" 
                                />
                            </div>
                            <button type="submit" className="w-full bg-blue-600 text-white font-bold py-3 rounded-xl hover:bg-blue-700 transition flex items-center justify-center gap-2 mt-4 shadow-lg">
                                <i className="fas fa-sign-in-alt text-xl"></i> เข้าสู่ระบบ
                            </button>
                        </form>
                    </div>
                </div>
            );
        };

        // ==========================================
        // 3. Tab Components
        // ==========================================

        // --- 3.1 แดชบอร์ด (Dashboard) ---
        const DashboardTab = ({ inventory, pawns, repairs, sales, transactions }) => {
            const [viewMode, setViewMode] = useState('summary'); // 'summary' หรือ 'calendar'
            const [calMonth, setCalMonth] = useState(new Date().getMonth());
            const [calYear, setCalYear] = useState(new Date().getFullYear());

            const currentMonth = new Date().getMonth();
            const currentYear = new Date().getFullYear();

            // คำนวณมูลค่าต่างๆ
            const totalInventoryValue = inventory.reduce((sum, item) => sum + (item.cost * item.qty), 0);
            const totalPawnValue = pawns.reduce((sum, p) => ['อยู่ในระหว่างจำนำ', 'อยู่ในระหว่างหลุดจำนำ'].includes(p.status) ? sum + p.principal : sum, 0);
            const totalRepairCost = repairs.reduce((sum, r) => sum + (r.cost || 0), 0);
            
            // เปลี่ยนจากรายจ่ายต่อเดือนเป็น "ต้นทุนภายในร้าน"
            const internalStoreCost = totalInventoryValue + totalPawnValue + totalRepairCost;

            const totalRepairValue = repairs.reduce((sum, r) => sum + (r.price || 0), 0);
            const currentMonthSales = sales
                .filter(s => {
                    const d = s.date ? new Date(s.date) : new Date();
                    return d.getMonth() === currentMonth && d.getFullYear() === currentYear;
                })
                .reduce((sum, sale) => sum + sale.total, 0);
            
            const ledger = buildLedger(transactions);
            const monthRows = ledger.filter(r => r._d.getMonth() === currentMonth && r._d.getFullYear() === currentYear);
            const mIncome = monthRows.reduce((s, r) => s + r.inc, 0);
            const mExpense = monthRows.reduce((s, r) => s + r.exp, 0);
            const todayIncome = ledger.filter(r => dayKey(r._d) === dayKey(new Date())).reduce((s, r) => s + r.inc, 0);
            const ledgerBalance = ledger.length ? ledger[ledger.length - 1].bal : 0;

            const bookCards = [
                { label: 'วันนี้ขายได้', val: todayIncome, color: 'text-green-600', bg: 'bg-green-50' },
                { label: 'ต้นทุนภายในร้านรวม', val: internalStoreCost, color: 'text-amber-600', bg: 'bg-amber-50' },
                { label: 'ขายได้/รายรับเดือนนี้', val: mIncome, color: 'text-green-600', bg: 'bg-green-50' },
                { label: 'กำไรสุทธิเดือนนี้', val: mIncome - mExpense, color: 'text-blue-600', bg: 'bg-blue-50' },
                { label: 'ยอดคงเหลือสะสม', val: ledgerBalance, color: 'text-indigo-600', bg: 'bg-indigo-50' },
            ];

            const pendingPawns = pawns.filter(p => ['อยู่ในระหว่างจำนำ', 'อยู่ในระหว่างหลุดจำนำ'].includes(p.status)).length;
            const pendingRepairs = repairs.filter(r => r.status !== 'ซ่อมเสร็จสิ้น').length;
            const totalNetBalance = currentMonthSales + totalRepairValue + totalPawnValue + totalInventoryValue;

            // --- คำนวณข้อมูลปฏิทิน ---
            const calendarDays = useMemo(() => {
                const firstDay = new Date(calYear, calMonth, 1).getDay();
                const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
                const days = [];

                // เติมวันว่างก่อนวันที่ 1
                for (let i = 0; i < firstDay; i++) {
                    days.push(null);
                }

                // เติมวันในเดือน
                for (let d = 1; d <= daysInMonth; d++) {
                    const dateStr = `${calYear}-${String(calMonth + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                    
                    // 1. รายการจำนำครบกำหนดวันไหน
                    const pawnItems = pawns.filter(p => p.dueDate === dateStr && ['อยู่ในระหว่างจำนำ', 'อยู่ในระหว่างหลุดจำนำ'].includes(p.status));
                    
                    // 2. รายการขายต่อวัน (POS) แยกต่างหาก
                    const daySales = sales.filter(s => {
                        const sDate = dayKey(new Date(s.date));
                        return sDate === dateStr;
                    });
                    const daySalesTotal = daySales.reduce((sum, s) => sum + s.total, 0);

                    days.push({ dayNum: d, dateStr, pawnItems, daySalesTotal, salesCount: daySales.length });
                }
                return days;
            }, [calMonth, calYear, pawns, sales]);

            return (
                <div className="space-y-6 page-fade-in">
                    <div className="flex flex-wrap items-center justify-between gap-4">
                        <h2 className="text-2xl font-bold text-gray-800">ภาพรวมธุรกิจ (Dashboard)</h2>
                        
                        {/* ปุ่มสลับมุมมอง */}
                        <div className="flex bg-gray-200 p-1 rounded-xl">
                            <button 
                                onClick={() => setViewMode('summary')}
                                className={`px-4 py-2 text-sm font-bold rounded-lg transition ${viewMode === 'summary' ? 'bg-white text-blue-600 shadow-sm' : 'text-gray-600 hover:text-gray-900'}`}
                            >
                                <i className="fas fa-chart-pie mr-2"></i>สรุปภาพรวม
                            </button>
                            <button 
                                onClick={() => setViewMode('calendar')}
                                className={`px-4 py-2 text-sm font-bold rounded-lg transition ${viewMode === 'calendar' ? 'bg-white text-blue-600 shadow-sm' : 'text-gray-600 hover:text-gray-900'}`}
                            >
                                <i className="fas fa-calendar-alt mr-2"></i>ปฏิทินวันครบกำหนด & ยอดขาย
                            </button>
                        </div>
                    </div>

                    {viewMode === 'summary' ? (
                        <>
                            {/* ยอดรวมสุทธิ */}
                            <div className="bg-gradient-to-r from-blue-600 to-indigo-700 text-white p-6 rounded-2xl shadow-lg flex items-center justify-between">
                                <div>
                                    <p className="text-sm font-medium opacity-80 mb-1">ยอดรวมสุทธิทั้งหมด (มูลค่าธุรกิจรวม)</p>
                                    <h3 className="text-3xl font-extrabold">฿{totalNetBalance.toLocaleString()}</h3>
                                </div>
                                <div className="w-14 h-14 bg-white/20 rounded-2xl flex items-center justify-center backdrop-blur-sm">
                                    <i className="fas fa-coins text-3xl"></i>
                                </div>
                            </div>

                            <div className="bg-white rounded-2xl shadow-sm border border-gray-100 p-6">
                                <div className="flex items-center justify-between mb-4">
                                    <h3 className="font-bold text-gray-800"><i className="fas fa-book text-blue-600 mr-2"></i>สรุปจากสมุดบัญชี เดือน{TH_MONTHS[currentMonth]} {currentYear}</h3>
                                    <span className="text-xs text-gray-400">{monthRows.length} รายการ</span>
                                </div>
                                <div className="grid grid-cols-2 lg:grid-cols-5 gap-4">
                                    {bookCards.map(c => (
                                        <div key={c.label} className={`${c.bg} rounded-xl p-4 transition hover:scale-105 duration-200`}>
                                            <p className="text-xs text-gray-500 font-medium mb-1">{c.label}</p>
                                            <h4 className={`text-xl font-bold ${c.color}`}>฿{c.val.toLocaleString()}</h4>
                                        </div>
                                    ))}
                                </div>
                            </div>

                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                                <div className="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 flex items-center justify-between">
                                    <div>
                                        <p className="text-sm text-gray-500 font-medium mb-1">ยอดขายเดือนนี้</p>
                                        <h3 className="text-2xl font-bold text-gray-800">฿{currentMonthSales.toLocaleString()}</h3>
                                    </div>
                                    <div className="w-12 h-12 bg-green-100 text-green-600 rounded-xl flex items-center justify-center">
                                        <i className="fas fa-wallet text-2xl"></i>
                                    </div>
                                </div>

                                {/* แสดงต้นทุนภายในร้าน */}
                                <div className="bg-white p-6 rounded-2xl shadow-sm border border-amber-200 bg-amber-50/20 flex items-center justify-between">
                                    <div>
                                        <p className="text-sm text-amber-700 font-bold mb-1">ต้นทุนภายในร้านรวม</p>
                                        <h3 className="text-2xl font-bold text-amber-900">฿{internalStoreCost.toLocaleString()}</h3>
                                        <p className="text-xs text-amber-600 mt-1">สต็อก + ปล่อยจำนำ + อะไหล่ซ่อม</p>
                                    </div>
                                    <div className="w-12 h-12 bg-amber-100 text-amber-600 rounded-xl flex items-center justify-center">
                                        <i className="fas fa-boxes-stacked text-2xl"></i>
                                    </div>
                                </div>

                                <div className="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 flex items-center justify-between">
                                    <div>
                                        <p className="text-sm text-gray-500 font-medium mb-1">มูลค่ารับจำนำ ({pawns.length} รายการ)</p>
                                        <h3 className="text-2xl font-bold text-gray-800">฿{totalPawnValue.toLocaleString()}</h3>
                                        <p className="text-xs text-purple-500 font-semibold mt-1">อยู่ในจำนำ: {pendingPawns} เครื่อง</p>
                                    </div>
                                    <div className="w-12 h-12 bg-purple-100 text-purple-600 rounded-xl flex items-center justify-center">
                                        <i className="fas fa-hand-holding-usd text-2xl"></i>
                                    </div>
                                </div>

                                <div className="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 flex items-center justify-between">
                                    <div>
                                        <p className="text-sm text-gray-500 font-medium mb-1">มูลค่าคลังสินค้า</p>
                                        <h3 className="text-2xl font-bold text-gray-800">฿{totalInventoryValue.toLocaleString()}</h3>
                                    </div>
                                    <div className="w-12 h-12 bg-blue-100 text-blue-600 rounded-xl flex items-center justify-center">
                                        <i className="fas fa-box text-2xl"></i>
                                    </div>
                                </div>
                            </div>
                        </>
                    ) : (
                        /* หน้าปฏิทินวันครบกำหนด & ยอดขายแยกส่วนกัน */
                        <div className="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 space-y-6">
                            <div className="flex flex-wrap items-center justify-between gap-4 border-b pb-4">
                                <div className="flex items-center gap-3">
                                    <h3 className="font-bold text-xl text-gray-800">
                                        <i className="fas fa-calendar-days text-blue-600 mr-2"></i>
                                        ปฏิทินประจำเดือน {TH_MONTHS[calMonth]} {calYear}
                                    </h3>
                                </div>
                                <div className="flex items-center gap-2">
                                    <select 
                                        value={calMonth} 
                                        onChange={e => setCalMonth(Number(e.target.value))}
                                        className="border rounded-lg p-2 text-sm bg-white font-medium"
                                    >
                                        {TH_MONTHS.map((m, i) => <option key={i} value={i}>{m}</option>)}
                                    </select>
                                    <select 
                                        value={calYear} 
                                        onChange={e => setCalYear(Number(e.target.value))}
                                        className="border rounded-lg p-2 text-sm bg-white font-medium"
                                    >
                                        {[...Array(5)].map((_, i) => { const y = currentYear - i; return <option key={y} value={y}>{y}</option>; })}
                                    </select>
                                </div>
                            </div>

                            {/* คำอธิบายสัญลักษณ์สี */}
                            <div className="flex items-center gap-6 text-xs font-semibold">
                                <div className="flex items-center gap-2">
                                    <span className="w-3 h-3 rounded-full bg-purple-600 inline-block"></span>
                                    <span className="text-gray-700">รายการครบกำหนดจำนำ (นัดไถ่/ส่งดอก)</span>
                                </div>
                                <div className="flex items-center gap-2">
                                    <span className="w-3 h-3 rounded-full bg-emerald-500 inline-block"></span>
                                    <span className="text-gray-700">รายการยอดขายต่อวัน (POS)</span>
                                </div>
                            </div>

                            {/* ตารางปฏิทิน */}
                            <div className="grid grid-cols-7 gap-2">
                                {['อา.', 'จ.', 'อ.', 'พ.', 'พฤ.', 'ศ.', 'ส.'].map((dayName, idx) => (
                                    <div key={dayName} className={`text-center font-bold text-sm py-2 rounded-t-lg ${idx === 0 ? 'text-red-500 bg-red-50' : idx === 6 ? 'text-blue-500 bg-blue-50' : 'text-gray-600 bg-gray-50'}`}>
                                        {dayName}
                                    </div>
                                ))}

                                {calendarDays.map((cell, idx) => {
                                    if (!cell) {
                                        return <div key={`empty-${idx}`} className="bg-slate-50/50 min-h-[110px] rounded-xl border border-dashed border-gray-200"></div>;
                                    }

                                    const isToday = cell.dateStr === dayKey(new Date());

                                    return (
                                        <div key={cell.dateStr} className={`min-h-[110px] p-2 rounded-xl border flex flex-col justify-between transition ${isToday ? 'border-blue-500 bg-blue-50/30 ring-2 ring-blue-400' : 'border-gray-100 bg-white hover:border-gray-300'}`}>
                                            <div className="flex justify-between items-center mb-1">
                                                <span className={`text-sm font-bold ${isToday ? 'bg-blue-600 text-white w-6 h-6 rounded-full flex items-center justify-center text-xs' : 'text-gray-700'}`}>
                                                    {cell.dayNum}
                                                </span>
                                            </div>

                                            <div className="space-y-1 overflow-y-auto max-h-[80px]">
                                                {/* ส่วนรายการครบกำหนดจำนำ */}
                                                {cell.pawnItems.length > 0 && (
                                                    <div className="bg-purple-100 text-purple-800 text-[11px] p-1.5 rounded-lg border border-purple-200 shadow-sm">
                                                        <div className="font-bold flex items-center gap-1">
                                                            <i className="fas fa-hand-holding-usd text-purple-600 text-[10px]"></i>
                                                            <span>จำนำ ({cell.pawnItems.length})</span>
                                                        </div>
                                                        {cell.pawnItems.map(p => (
                                                            <div key={p.id} className="truncate text-[10px] opacity-90">
                                                                • {p.name}: {p.model}
                                                            </div>
                                                        ))}
                                                    </div>
                                                )}

                                                {/* ส่วนรายการขายต่อวัน (แยกต่างหากไม่มารวมกัน) */}
                                                {cell.daySalesTotal > 0 && (
                                                    <div className="bg-emerald-100 text-emerald-800 text-[11px] p-1.5 rounded-lg border border-emerald-200 shadow-sm">
                                                        <div className="font-bold flex items-center gap-1">
                                                            <i className="fas fa-shopping-bag text-emerald-600 text-[10px]"></i>
                                                            <span>ยอดขาย ({cell.salesCount} บิล)</span>
                                                        </div>

        // --- 3.3 งานซ่อม (Repair) ---
        const RepairTab = ({ repairs, setRepairs, inventory, setInventory, addTransaction, showToast, onPrint }) => {

            const handleSubmit = (e) => {
                e.preventDefault();
                const part = inventory.find(i => i.id === formData.partId);
                const newRepair = {
                    id: `REP${Math.floor(Math.random()*10000)}`,
                    date: new Date().toLocaleDateString('th-TH'),
                    ...formData,
                    partName: part ? part.name : 'ไม่ได้ใช้อะไหล่/ลูกค้านำมาเอง',
                    cost: part ? part.cost : 0,
                    price: parseFloat(formData.price),
                    status: 'รอคิวซ่อม'
                };
                setRepairs([...repairs, newRepair]);
                setFormData({ name: '', phone: '', model: '', issue: '', partId: '', price: '' });
                showToast(`รับงานซ่อม ${newRepair.id} สำเร็จ`);
            };

            const handleUpdateStatus = (id, currentStatus, partId) => {
                if (currentStatus !== 'ซ่อมเสร็จสิ้น') {
                    const repair = repairs.find(r => r.id === id);
                    const part = inventory.find(i => i.id === partId);
                    if (part) {
                        if (part.qty <= 0) { alert('อะไหล่ชิ้นนี้หมดสต็อก ไม่สามารถตัดสต็อกได้!'); return; }
                        setInventory(inventory.map(i => i.id === partId ? { ...i, qty: i.qty - 1 } : i));
                    }
                    setRepairs(repairs.map(r => r.id === id ? { ...r, status: 'ซ่อมเสร็จสิ้น' } : r));
                    addTransaction('รายรับ', `งานซ่อมบิล ${id} (${repair.model})`, repair.price, 1, id);
                    showToast(`อัปเดตสถานะและตัดสต็อกอะไหล่เรียบร้อย`);
                }
            };

            return (
                <div className="space-y-6 page-fade-in">
                    <h2 className="text-2xl font-bold text-gray-800">จัดการงานซ่อม</h2>
                    <div className="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                        <form onSubmit={handleSubmit} className="grid grid-cols-1 md:grid-cols-6 gap-4">
                            <div><label className="text-xs text-gray-500">ชื่อลูกค้า</label><input required value={formData.name} onChange={e => setFormData({...formData, name: e.target.value})} className="w-full border p-2.5 rounded-xl text-sm" /></div>
                            <div><label className="text-xs text-gray-500">เบอร์โทร</label><input required value={formData.phone} onChange={e => setFormData({...formData, phone: e.target.value})} className="w-full border p-2.5 rounded-xl text-sm" /></div>
                            <div><label className="text-xs text-gray-500">รุ่นเครื่อง</label><input required value={formData.model} onChange={e => setFormData({...formData, model: e.target.value})} className="w-full border p-2.5 rounded-xl text-sm" /></div>

                            <div>

                                <select value={formData.partId} onChange={e => setFormData({...formData, partId: e.target.value})} className="w-full border p-2.5 rounded-xl text-sm bg-white">
                                    <option value="">-- ไม่ใช้อะไหล่ --</option>

        // --- 3.4 รับจำนำ (Pawn) ---
        const PawnTab = ({ pawns, setPawns, showToast, addTransaction }) => {
            const [formData, setFormData] = useState({ name: '', phone: '', idCard: '', model: '', imei: '', principal: '', startDate: '', dueDate: '' });

            const syncToCalendar = async (pawnData) => {
                showToast("กำลังซิงค์กับปฏิทิน...");
                try {
                    const response = await fetch(SHEET_API_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify({ action: 'syncCalendar', pawn: pawnData })
                    });
                    const result = await response.json();
                    if (!result.success) { showToast(result.message || 'ซิงค์ปฏิทินไม่สำเร็จ'); return; }
                    setPawns(prev => prev.map(p => p.id === pawnData.id ? { ...p, eventId: result.eventId } : p));
                    showToast(result.message || "ซิงค์ปฏิทินสำเร็จ");
                } catch (error) {
                    console.error("Calendar Sync Error:", error);
                    showToast("ไม่สามารถซิงค์ปฏิทินได้");
                }
            };

            const handleSubmit = (e) => {
                e.preventDefault();
                const principal = parseFloat(formData.principal);
                const newPawn = {
                    id: `PWN${Math.floor(Math.random()*10000)}`,
                    ...formData,
                    principal,
                    interest: principal * 0.10,
                    status: 'อยู่ในระหว่างจำนำ',
                    eventId: null
                };
                
                setPawns([...pawns, newPawn]);
                addTransaction('รายจ่าย', `ปล่อยเงินรับจำนำ: ${newPawn.model}`, principal, 1, newPawn.id);
                syncToCalendar(newPawn);

                setFormData({ name: '', phone: '', idCard: '', model: '', imei: '', principal: '', startDate: '', dueDate: '' });
                showToast(`รับจำนำสำเร็จ (ดอกเบี้ย 10%)`);
            };

            // --- ต่อดอก: เก็บดอกเบี้ย 10% ของยอดจำนำเป็นกำไร และเลื่อนวันครบกำหนด ---
            const [renewTarget, setRenewTarget] = useState(null);
            const [renewDate, setRenewDate] = useState('');
            const addDaysYmd = (ymd, n) => {
                const base = ymd && !isNaN(new Date(ymd)) ? new Date(ymd + 'T00:00:00') : new Date();
                base.setDate(base.getDate() + n);
                return dayKey(base);
            };
            const openRenew = (p) => { setRenewTarget(p); setRenewDate(addDaysYmd(p.dueDate, 30)); };
            const confirmRenew = () => {
                const p = renewTarget;
                if (!p || !renewDate) { showToast('กรุณาเลือกวันครบกำหนดใหม่'); return; }
                const profit = (p.principal || 0) * 0.10;
                const updated = {
                    ...p,
                    dueDate: renewDate,
                    status: 'อยู่ในระหว่างจำนำ',
                    renewCount: (p.renewCount || 0) + 1,
                    renewTotal: (p.renewTotal || 0) + profit,
                    lastRenewDate: dayKey(new Date())
                };
                setPawns(pawns.map(x => x.id === p.id ? updated : x));
                addTransaction('รายรับ', `ต่อดอกจำนำ: ${p.model}`, profit, 1, p.id, `ต่อดอกครั้งที่ ${updated.renewCount} (10% ของ ฿${(p.principal || 0).toLocaleString()}) เลื่อนครบกำหนด ${p.dueDate || '-'} → ${renewDate}`);
                syncToCalendar(updated);
                setRenewTarget(null);
                showToast(`ต่อดอกสำเร็จ กำไร ฿${profit.toLocaleString()}`);
            };
            const totalRenewProfit = pawns.reduce((sum, x) => sum + (x.renewTotal || 0), 0);

            const handleExtendDueDate = (pawnId, newDueDate) => {
                const pawn = pawns.find(p => p.id === pawnId);
                const updatedPawn = { ...pawn, dueDate: newDueDate };
                setPawns(pawns.map(p => p.id === pawnId ? updatedPawn : p));
                syncToCalendar(updatedPawn);
            };

            const ACTIVE_STATUS = ['อยู่ในระหว่างจำนำ', 'อยู่ในระหว่างหลุดจำนำ'];
            const syncAllToCalendar = async () => {
                const todo = pawns.filter(x => ACTIVE_STATUS.includes(x.status) && !x.eventId && x.dueDate);
                if (todo.length === 0) { showToast('ไม่มีรายการที่ต้องส่งเข้าปฏิทิน'); return; }
                for (const p of todo) { await syncToCalendar(p); }
                showToast(`ส่งนัดเข้าปฏิทินแล้ว ${todo.length} รายการ`);
            };

            const handleUpdateStatus = (id, newStatus) => {
                const p = pawns.find(x => x.id === id);
                setPawns(pawns.map(pwn => pwn.id === id ? { ...pwn, status: newStatus } : pwn));
                if (newStatus === 'ไถ่เครื่องออก') {
                    addTransaction('รายรับ', `ลูกค้าไถ่เครื่องจำนำ: ${p.model}`, p.principal + p.interest, 1, p.id);
                } else if (newStatus === 'ออกก่อนกำหนด') {
                    addTransaction('รายรับ', `ออกก่อนกำหนด: ${p.model}`, p.principal, 1, p.id);
                }
                showToast(`อัปเดตสถานะเป็น ${newStatus}`);
                syncToCalendar({ ...p, status: newStatus });
            };

            return (
                <div className="space-y-6 page-fade-in">
                    <div className="flex flex-wrap items-center justify-between gap-3">
                        <h2 className="text-2xl font-bold text-gray-800">ระบบรับจำนำ</h2>
                        {totalRenewProfit > 0 && <span className="bg-green-50 text-green-700 border border-green-200 px-3 py-1.5 rounded-xl text-sm font-bold"><i className="fas fa-sync-alt mr-1.5"></i>กำไรจากต่อดอกสะสม ฿{totalRenewProfit.toLocaleString()}</span>}
                        <button onClick={syncAllToCalendar} className="bg-white border border-blue-200 text-blue-600 px-4 py-2 rounded-xl text-sm font-bold hover:bg-blue-50 shadow-sm transition"><i className="fas fa-calendar-plus mr-2"></i>ส่งนัดครบกำหนดทั้งหมดเข้าปฏิทิน</button>
                    </div>
                    
                    <div className="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                        <form onSubmit={handleSubmit} className="grid grid-cols-1 md:grid-cols-4 gap-4">
                            <div><label className="text-xs text-gray-500">ชื่อลูกค้าผู้จำนำ</label><input required value={formData.name} onChange={e => setFormData({...formData, name: e.target.value})} className="w-full border p-2.5 rounded-xl text-sm" placeholder="นายสมชาย ใจดี" /></div>
                            <div><label className="text-xs text-gray-500">เบอร์โทรศัพท์</label><input required value={formData.phone} onChange={e => setFormData({...formData, phone: e.target.value})} className="w-full border p-2.5 rounded-xl text-sm" placeholder="0812345678" /></div>
                            <div><label className="text-xs text-gray-500">เลขบัตรประชาชน</label><input required value={formData.idCard} onChange={e => setFormData({...formData, idCard: e.target.value})} className="w-full border p-2.5 rounded-xl text-sm" placeholder="1-xxxx-xxxxx-xx-x" /></div>
                            <div><label className="text-xs text-gray-500">ชื่อรุ่นเครื่อง / สเปค</label><input required value={formData.model} onChange={e => setFormData({...formData, model: e.target.value})} className="w-full border p-2.5 rounded-xl text-sm" placeholder="iPhone 14 Pro 128GB" /></div>
                            <div><label className="text-xs text-gray-500">หมายเลข IMEI / Serial</label><input required value={formData.imei} onChange={e => setFormData({...formData, imei: e.target.value})} className="w-full border p-2.5 rounded-xl text-sm" placeholder="35xxxxxxxxxxxxx" /></div>
                            <div><label className="text-xs text-gray-500">ยอดเงินจำนำ (฿)</label><input required type="number" value={formData.principal} onChange={e => setFormData({...formData, principal: e.target.value})} className="w-full border p-2.5 rounded-xl text-sm" placeholder="10000" /></div>
                            <div><label className="text-xs text-gray-500">วันที่รับจำนำ</label><input required type="date" value={formData.startDate} onChange={e => setFormData({...formData, startDate: e.target.value})} className="w-full border p-2.5 rounded-xl text-sm" /></div>
                            <div><label className="text-xs text-gray-500">วันที่ครบกำหนด</label><input required type="date" value={formData.dueDate} onChange={e => setFormData({...formData, dueDate: e.target.value})} className="w-full border p-2.5 rounded-xl text-sm" /></div>
                            <button type="submit" className="bg-purple-600 text-white font-bold py-3 px-4 rounded-xl md:col-span-4 hover:bg-purple-700 shadow-md transition transform active:scale-[0.99]">บันทึกรับจำนำ</button>
                        </form>
                    </div>

                    {/* ตารางแสดงข้อมูลจำนำครบถ้วนทุกรายละเอียด */}
                    <div className="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
                        <div className="overflow-x-auto">
                        <table className="w-full text-left border-collapse min-w-[1000px]">
                            <thead className="bg-slate-50 text-slate-600 text-xs uppercase font-bold">
                                <tr>
                                    <th className="p-4 border-b">เลขที่</th>
                                    <th className="p-4 border-b">ข้อมูลผู้จำนำ</th>
                                    <th className="p-4 border-b">ข้อมูลตัวเครื่อง & IMEI</th>
                                    <th className="p-4 border-b text-right">ยอดเงินจำนำ</th>
                                    <th className="p-4 border-b text-right">ดอกเบี้ย (10%)</th>
                                    <th className="p-4 border-b text-center">วันที่รับ / ครบกำหนด</th>
                                    <th className="p-4 border-b text-center">สถานะ</th>
                                    <th className="p-4 border-b text-center">จัดการ</th>
                                </tr>
                            </thead>
                            <tbody>
                                {pawns.length === 0 ? <tr><td colSpan={8} className="p-8 text-center text-gray-400">ยังไม่มีรายการรับจำนำ</td></tr> : pawns.map(p => {
                                    const today = new Date(); today.setHours(0,0,0,0);
                                    const isOverdue = new Date(p.dueDate) < today;
                                    const displayStatus = (p.status === 'อยู่ในระหว่างจำนำ' && isOverdue) ? 'อยู่ในระหว่างหลุดจำนำ' : p.status;
                                    
                                    return (
                                    <tr key={p.id} className="hover:bg-gray-50 border-b text-sm transition">
                                        <td className="p-4 font-mono font-bold text-purple-600 whitespace-nowrap">{p.id}</td>
                                        <td className="p-4">
                                            <div className="font-bold text-gray-800">{p.name}</div>
                                            <div className="text-xs text-gray-500">โทร: {p.phone}</div>
                                            <div className="text-[11px] text-gray-400">ปปช: {p.idCard || '-'}</div>
                                        </td>
                                        <td className="p-4">
                                            <div className="font-semibold text-gray-800">{p.model}</div>
                                            <div className="text-xs font-mono text-gray-500">IMEI: {p.imei || '-'}</div>
                                        </td>
                                        <td className="p-4 text-right font-bold text-gray-800">฿{(p.principal || 0).toLocaleString()}</td>
                                        <td className="p-4 text-right font-medium text-purple-600">
                                            ฿{(p.interest || (p.principal * 0.1)).toLocaleString()}
                                            {p.renewCount > 0 && <div className="text-[11px] text-green-600 font-bold">ต่อดอก {p.renewCount} ครั้ง (+฿{(p.renewTotal || 0).toLocaleString()})</div>}
                                        </td>
                                        <td className="p-4 text-center text-xs whitespace-nowrap">
                                            <div className="text-gray-500">เริ่ม: {p.startDate || '-'}</div>
                                            <div className="text-red-500 font-bold mt-1">
                                                {ACTIVE_STATUS.includes(p.status)
                                                    ? <input key={p.id + p.dueDate} type="date" defaultValue={p.dueDate} title="เปลี่ยนวันครบกำหนด (ปฏิทินจะอัปเดตตาม)" onBlur={e => { if (e.target.value && e.target.value !== p.dueDate) handleExtendDueDate(p.id, e.target.value); }} className="border rounded p-1 text-xs text-red-600 font-bold bg-white" />
                                                    : p.dueDate}
                                            </div>
                                        </td>
                                        <td className="p-4 text-center whitespace-nowrap">
                                            <span className={`px-2.5 py-1 rounded-full text-xs font-bold ${displayStatus.includes('หลุด') ? 'bg-red-100 text-red-700' : displayStatus === 'อยู่ในระหว่างจำนำ' ? 'bg-yellow-100 text-yellow-700' : 'bg-green-100 text-green-700'}`}>
                                                {displayStatus}
                                            </span>
                                        </td>
                                        <td className="p-4 text-center whitespace-nowrap">
                                            <select className="border rounded-lg text-xs p-1.5 bg-white cursor-pointer font-medium" value={p.status} onChange={(e) => { if (e.target.value === '__renew') openRenew(p); else handleUpdateStatus(p.id, e.target.value); }}>
                                                <option value="อยู่ในระหว่างจำนำ">อยู่ในระหว่างจำนำ</option>
                                                {ACTIVE_STATUS.includes(p.status) && <option value="__renew">ต่อดอก (เลื่อนวันครบกำหนด)</option>}
                                                <option value="ไถ่เครื่องออก">ไถ่เครื่องออก</option>
                                                <option value="ออกก่อนกำหนด">ออกก่อนกำหนด</option>
                                                <option value="หลุดจำนำ">หลุดจำนำ (ยึดเครื่อง)</option>
                                            </select>
                                        </td>
                                    </tr>
                                )})}
                            </tbody>
                        </table>
                        </div>
                    </div>

                    {renewTarget && (
                        <div className="fixed inset-0 z-50 bg-black/50 flex items-center justify-center p-4" onClick={() => setRenewTarget(null)}>
                            <div className="bg-white rounded-2xl shadow-xl w-full max-w-md p-6 space-y-4" onClick={e => e.stopPropagation()}>
                                <h3 className="text-lg font-bold text-gray-800"><i className="fas fa-sync-alt text-purple-600 mr-2"></i>ต่อดอก {renewTarget.id}</h3>
                                <div className="text-sm text-gray-600 space-y-1">
                                    <div>ลูกค้า: <b>{renewTarget.name}</b> · {renewTarget.model}</div>
                                    <div>ยอดจำนำ: <b>฿{(renewTarget.principal || 0).toLocaleString()}</b></div>
                                    <div>ครบกำหนดเดิม: <b className="text-red-500">{renewTarget.dueDate || '-'}</b></div>
                                </div>
                                <div className="bg-green-50 border border-green-200 rounded-xl p-3 text-sm text-green-700 font-bold">
                                    ดอกเบี้ยที่รับ (กำไร 10%): ฿{((renewTarget.principal || 0) * 0.10).toLocaleString()}
                                </div>
                                <div>
                                    <label className="text-xs text-gray-500">วันครบกำหนดใหม่ (เปลี่ยนวันได้)</label>
                                    <input type="date" value={renewDate} onChange={e => setRenewDate(e.target.value)} className="w-full border p-2.5 rounded-xl text-sm" />
                                </div>
                                <div className="flex gap-3">
                                    <button onClick={() => setRenewTarget(null)} className="flex-1 border border-gray-300 text-gray-600 font-bold py-2.5 rounded-xl hover:bg-gray-50">ยกเลิก</button>
                                    <button onClick={confirmRenew} className="flex-1 bg-purple-600 text-white font-bold py-2.5 rounded-xl hover:bg-purple-700 shadow-md">ยืนยันต่อดอก</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        // --- 3.5 ลูกค้าสัมพันธ์ (CRM) ---
        const CRMTab = ({ repairs, pawns, onPrintRepair }) => {
            const [searchPhone, setSearchPhone] = useState('');
            const customerRepairs = repairs.filter(r => searchPhone && r.phone.includes(searchPhone));
            const customerPawns = pawns.filter(p => searchPhone && p.phone.includes(searchPhone));

            return (
                <div className="space-y-6 page-fade-in">
                    <h2 className="text-2xl font-bold text-gray-800">ค้นหาประวัติลูกค้า (CRM)</h2>
                    <div className="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                        <div className="relative max-w-md mb-6">
                            <input type="text" placeholder="พิมพ์เบอร์โทรศัพท์..." value={searchPhone} onChange={e => setSearchPhone(e.target.value)} className="w-full pl-10 pr-4 py-3 border rounded-xl bg-gray-50 focus:bg-white transition" />
                            <i className="fas fa-search text-gray-400 absolute left-3 top-4"></i>
                        </div>

                        {searchPhone && (
                            <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                                <div className="border rounded-xl p-4 bg-gray-50">
                                    <h3 className="font-bold text-gray-800 mb-3 border-b pb-2 flex items-center">
                                        <i className="fas fa-wrench mr-2 text-gray-600"></i> ประวัติงานซ่อม
                                    </h3>
                                    <div className="space-y-2">
                                        {customerRepairs.map(r => (
                                            <div key={r.id} className="p-3 bg-white border rounded-xl shadow-sm text-sm">
                                                <div className="flex justify-between">
                                                    <span className="font-bold">{r.id} ({r.model})</span>
                                                    {r.status === 'ซ่อมเสร็จสิ้น' && 
                                                        <button onClick={() => onPrintRepair('repair', r)} className="text-blue-600 underline text-xs">
                                                            <i className="fas fa-print mr-1"></i> พิมพ์
                                                        </button>
                                                    }
                                                </div>
                                                <div className="text-gray-500">อาการ: {r.issue} | ฿{r.price}</div>
                                            </div>
                                        ))}
                                        {customerRepairs.length === 0 && <p className="text-sm text-gray-400">ไม่พบประวัติซ่อม</p>}
                                    </div>
                                </div>
                                
                                <div className="border rounded-xl p-4 bg-gray-50">
                                    <h3 className="font-bold text-gray-800 mb-3 border-b pb-2 flex items-center">
                                        <i className="fas fa-exclamation-circle mr-2 text-gray-600"></i> ประวัติจำนำ
                                    </h3>
                                    <div className="space-y-2">
                                        {customerPawns.map(p => (
                                            <div key={p.id} className="p-3 bg-white border rounded-xl shadow-sm text-sm">
                                                <div className="flex justify-between"><span className="font-bold">{p.id} ({p.model})</span><span className="text-red-500 font-bold">฿{p.principal}</span></div>
                                                <div className="text-gray-500">สถานะ: {p.status}</div>
                                            </div>
                                        ))}
                                        {customerPawns.length === 0 && <p className="text-sm text-gray-400">ไม่พบประวัติจำนำ</p>}
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        // --- 3.6 สมุดบัญชีรายรับ-รายจ่าย (Ledger) ---
        const TransactionTab = ({ transactions, setTransactions, onPrint, showToast }) => {
            const now = new Date();
            const [selectedMonth, setSelectedMonth] = useState(now.getMonth());
            const [selectedYear, setSelectedYear] = useState(now.getFullYear());
            const [ledgerTab, setLedgerTab] = useState('all'); // 'all', 'sales', 'pawns' (แยกส่วนรายการจำนำและขายต่อวัน)
            
            const [editIdx, setEditIdx] = useState(null);
            const [draft, setDraft] = useState({});
            const [showAdd, setShowAdd] = useState(false);
            const blank = () => ({ date: dayKey(new Date()), type: 'รายรับ', detail: '', ref: '', amount: '', note: '' });
            const [nr, setNr] = useState(blank());
            const inp = 'w-full border rounded-lg p-2 text-sm';
            const setDate = (ymd, base) => { const [y, m, d] = ymd.split('-').map(Number); const nd = new Date(base || new Date()); nd.setFullYear(y, m - 1, d); return nd; };

            const ledger = buildLedger(transactions);
            const monthRows = ledger.filter(r => r._d.getMonth() === selectedMonth && r._d.getFullYear() === selectedYear);
            
            // กรองตามประเภท Tab เพื่อแยกรายการจำนำออกจากขายหน้าร้าน/งานซ่อม
            const filteredRows = useMemo(() => {
                if (ledgerTab === 'sales') {
                    return monthRows.filter(r => !r.detail.includes('จำนำ') && !r.detail.includes('ไถ่เครื่อง'));
                } else if (ledgerTab === 'pawns') {
                    return monthRows.filter(r => r.detail.includes('จำนำ') || r.detail.includes('ไถ่เครื่อง'));
                }
                return monthRows;
            }, [monthRows, ledgerTab]);

            const before = ledger.filter(r => r._d < new Date(selectedYear, selectedMonth, 1));
            const opening = before.length ? before[before.length - 1].bal : 0;
            const totalIncome = monthRows.reduce((s, r) => s + r.inc, 0);
            const totalExpense = monthRows.reduce((s, r) => s + r.exp, 0);
            const netProfit = totalIncome - totalExpense;
            const todayIncome = ledger.filter(r => dayKey(r._d) === dayKey(now)).reduce((s, r) => s + r.inc, 0);

            const days = [];
            filteredRows.forEach(r => {
                const k = dayKey(r._d);
                let g = days[days.length - 1];
                if (!g || g.k !== k) { g = { k, d: r._d, items: [] }; days.push(g); }
                g.items.push(r);
            });

            const startEdit = (r) => { setEditIdx(r._i); setDraft({ date: dayKey(r._d), detail: r.detail || '', ref: r.ref || '', income: r.inc || '', expense: r.exp || '', note: r.note || '' }); };
            const saveEdit = (r) => {
                const inc = parseFloat(draft.income) || 0, exp = parseFloat(draft.expense) || 0;
                if ((inc > 0) === (exp > 0)) { showToast('กรอกยอดรายรับ หรือ รายจ่าย อย่างใดอย่างหนึ่งเท่านั้น'); return; }
                const nd = setDate(draft.date, r._d);
                setTransactions(prev => prev.map((t, i) => i === r._i ? { ...t, date: nd.toLocaleString('th-TH'), rawDate: nd.toISOString(), type: inc > 0 ? 'รายรับ' : 'รายจ่าย', amount: inc > 0 ? inc : exp, detail: draft.detail, ref: draft.ref, note: draft.note } : t));
                setEditIdx(null);
                showToast('บันทึกการแก้ไขแล้ว');
            };

            const removeRow = (r) => {
                if (!confirm(`ลบรายการ "${r.detail}" ?`)) return;
                setTransactions(prev => prev.filter((_, i) => i !== r._i));
                showToast('ลบรายการแล้ว');
            };

            const addRow = (e) => {
                e.preventDefault();
                const amount = parseFloat(nr.amount) || 0;
                if (amount <= 0) { showToast('กรุณากรอกจำนวนเงิน'); return; }
                const nd = setDate(nr.date);
                setTransactions(prev => [{ id: Date.now(), date: nd.toLocaleString('th-TH'), rawDate: nd.toISOString(), type: nr.type, detail: nr.detail, amount, qty: '-', ref: nr.ref, note: nr.note }, ...prev]);
                setNr(blank());
                setShowAdd(false);
                showToast('เพิ่มรายการเรียบร้อย');
            };

            const handlePrintSummary = () => onPrint('transaction', { monthStr: `${TH_MONTHS[selectedMonth]} ${selectedYear}`, totalIncome, totalExpense, netProfit, transactions: filteredRows });

            const cards = [
                { label: 'วันนี้ขายได้', val: todayIncome, c: 'text-green-600', b: 'border-green-100' },
                { label: `รายรับรวมเดือน${TH_MONTHS[selectedMonth]}`, val: totalIncome, c: 'text-green-600', b: 'border-green-100' },
                { label: 'รายจ่ายรวมเดือนนี้', val: totalExpense, c: 'text-red-600', b: 'border-red-100' },
                { label: 'กำไรสุทธิเดือนนี้', val: netProfit, c: 'text-blue-600', b: 'border-blue-100' },
                { label: 'ยอดคงเหลือสิ้นเดือน', val: opening + netProfit, c: 'text-indigo-600', b: 'border-indigo-100' },
            ];

            return (
                <div className="space-y-6 page-fade-in">
                    <div className="flex flex-wrap justify-between items-end gap-3">
                        <h2 className="text-2xl font-bold text-gray-800">สมุดบัญชีรายรับ-รายจ่าย</h2>
                        <div className="flex flex-wrap gap-2">
                            <select value={selectedMonth} onChange={e => setSelectedMonth(Number(e.target.value))} className="border p-2 rounded-xl bg-white shadow-sm font-medium">
                                {TH_MONTHS.map((m, i) => <option key={i} value={i}>{m}</option>)}
                            </select>
                            <select value={selectedYear} onChange={e => setSelectedYear(Number(e.target.value))} className="border p-2 rounded-xl bg-white shadow-sm font-medium">
                                {[...Array(5)].map((_, i) => { const y = now.getFullYear() - i; return <option key={y} value={y}>{y}</option>; })}
